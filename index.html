<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vezpa Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#141012; --panel:#1e181b; --panel2:#272024; --line:#3a3035; --ink:#f4ede6; --mute:#a99c94;
  --amber:#f2a63b; --amber2:#ffcf7a; --rose:#e8607a; --teal:#4fc3b0; --violet:#9b8cf2; --green:#7cc46a; --red:#e8604f;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
a{color:var(--amber2)}

/* login */
#tela-login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% 0%,#3b2418 0%,transparent 60%),radial-gradient(900px 500px at 100% 100%,#2c1830 0%,transparent 60%),var(--bg)}
.cartao-login{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.marca .logo{width:44px;height:44px;border-radius:12px;background:var(--amber);color:#1a1208;display:grid;place-items:center;font:800 22px Fraunces,serif}
.marca h1{font-size:26px}.marca small{display:block;color:var(--mute);font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
.btn{background:var(--amber);color:#1a1208;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--amber2)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sec:hover{border-color:var(--amber)}
.btn.peq{padding:6px 10px;font-size:13px}
.btn.perigo{background:transparent;border:1px solid #6b2b30;color:#ff9aa5}
.btn:disabled{opacity:.5;cursor:wait}
.largo{width:100%;margin-top:20px}
.msg{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--panel2)}
.msg.erro{color:#ffb4b4;border:1px solid #5c2a2a}.msg.ok{color:#bfe8b0;border:1px solid #2f5a2a}
.link-btn{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0;margin-top:14px;font-size:13px}

/* app */
header.topo{position:sticky;top:0;z-index:5;background:rgba(20,16,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topo-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topo .marca{margin:0}.topo .marca .logo{width:36px;height:36px;font-size:18px}.topo .marca h1{font-size:20px}
nav.abas{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.abas button{background:none;border:0;color:var(--mute);padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:500}
nav.abas button:hover{color:var(--ink);background:var(--panel)}
nav.abas button.ativa{color:#1a1208;background:var(--amber)}
.quem{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.selo{font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--amber2)}
@media(max-width:760px){
  .topo-in{padding:10px 14px;gap:8px}
  nav.abas{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.abas button{white-space:nowrap}
  .quem{margin-left:auto}.quem #quem-nome{display:none}
  main{padding:16px 14px 60px}
  .cab-sec h2{font-size:23px}
}
main{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.cab-sec{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cab-sec h2{font-size:28px}.cab-sec p{margin:4px 0 0;color:var(--mute)}
.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filtros input,.filtros select{width:auto;padding:8px 10px}
.grade{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.dois{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media(max-width:520px){.dois{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:17px;margin-bottom:4px}
.card .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.kpi .rot{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.kpi .val{font:700 28px "DM Sans";margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .det{color:var(--mute);font-size:12.5px;margin-top:4px}
.kpi.destaque{background:linear-gradient(135deg,#3a2612,#2a1d14);border-color:#5c3f1c}
.kpi.destaque .val{color:var(--amber2)}
.graf{position:relative;height:280px}.graf.alto{height:360px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--panel)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.rolagem{max-height:440px;overflow:auto}
.barra-mini{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:4px}
.barra-mini i{display:block;height:100%;background:var(--amber)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.tag.bom{color:#bfe8b0;border-color:#2f5a2a}.tag.ruim{color:#ffb4b4;border-color:#5c2a2a}.tag.ok{color:var(--amber2);border-color:#5c3f1c}
.vazio{padding:40px;text-align:center;color:var(--mute)}
.aviso{background:#2a2112;border:1px solid #5c4a1c;color:#f5dca0;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.heat{display:grid;gap:3px;font-size:11px}
.heat .c{border-radius:4px;height:26px;display:grid;place-items:center;color:#1a1208;font-weight:700}
.heat .h{color:var(--mute);display:grid;place-items:center}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--mute);cursor:pointer;transition:.15s}
.drop.sobre,.drop:hover{border-color:var(--amber);color:var(--ink)}
.linha-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.ao-vivo{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.ao-vivo:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(124,196,106,.6);animation:pulso 2s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(124,196,106,0)}100%{box-shadow:0 0 0 0 rgba(124,196,106,0)}}
.insights li{margin:0 0 10px}
.insights{padding-left:18px;margin:0}
/* passo a passo */
.passos{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.passos span{font-size:12.5px;padding:5px 10px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.passos span.at{background:var(--amber);color:#1a1208;border-color:var(--amber);font-weight:700}
.passos span.ok{color:#bfe8b0;border-color:#2f5a2a}
.escolhas{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.escolha{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;color:var(--ink)}
.escolha:hover,.escolha.sel{border-color:var(--amber);background:#2e2318}
.escolha b{display:block;font-size:17px;margin-bottom:4px}.escolha small{color:var(--mute)}
.escolha .prog{margin-top:10px}
.item-cont{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item-cont .nome{flex:1;min-width:0}.item-cont .nome small{display:block;color:var(--mute);font-size:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:22px;cursor:pointer}
.stepper button:active{background:var(--amber);color:#1a1208}
.stepper input{width:76px;text-align:center;font-size:18px;font-weight:700;padding:9px 4px}
.salvo{width:20px;font-size:14px;color:var(--green)}
.salvo.erro{color:var(--red)}
.rodape-passos{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:9px 14px;cursor:pointer}
.chips button.sel{background:var(--amber);color:#1a1208;border-color:var(--amber);font-weight:700}
input.grande{font-size:26px;font-weight:700;padding:14px}
.dif-pos{color:#ff9aa5;font-weight:700}.dif-neg{color:var(--amber2);font-weight:700}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="tela-login" class="hidden">
  <div class="cartao-login">
    <div class="marca"><div class="logo">V</div><div><h1>Vezpa Gestão</h1><small>Painel interno do Vezpa Bar</small></div></div>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button class="btn largo" type="submit">Entrar</button>
      <button class="link-btn" type="button" id="btn-esqueci">Esqueci minha senha</button>
    </form>

    <form id="form-nova-senha" class="hidden">
      <p style="margin:0;color:var(--mute)">Defina a sua senha para acessar o painel.</p>
      <label for="nova1">Nova senha (mín. 8 caracteres)</label>
      <input id="nova1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="nova2">Repita a senha</label>
      <input id="nova2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn largo" type="submit">Salvar senha e entrar</button>
    </form>
    <div id="msg-login" class="msg hidden"></div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topo"><div class="topo-in">
    <div class="marca"><div class="logo">V</div><h1>Vezpa</h1></div>
    <nav class="abas" id="abas"></nav>
    <div class="quem"><span id="quem-nome"></span><span class="selo" id="quem-papel"></span><button class="btn sec peq" id="btn-sair">Sair</button></div>
  </div></header>
  <main id="conteudo"></main>
</div>

<dialog id="dlg"></dialog>

<script>
// ============ CONFIG ============
const SUPABASE_URL = "https://obnrddlgftdxilvteuks.supabase.co";
const SUPABASE_KEY = "sb_publishable_cXoEUXsrUgD8xZLT626bpg_RDG_GU9U";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (s, el = document) => el.querySelector(s);
const brl = v => (v ?? 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const brl0 = v => (v ?? 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const nfmt = (v, d = 0) => (v ?? 0).toLocaleString("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = v => isFinite(v) ? (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "%" : "—";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DIAS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const DIAS_LONGO = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
const dt = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const br = s => s ? s.split("-").reverse().join("/") : "";
const dow = s => dt(s).getDay();
const addDias = (s, n) => { const d = dt(s); d.setDate(d.getDate() + n); return iso(d); };

const CATEG = g => {
  g = (g || "").toUpperCase();
  if (/COMIDA|PRATO|ENTRADA|COMPARTILHAR|WRAP|BURGER/.test(g)) return "Comida";
  if (/CERVEJA|LONG NECK|600/.test(g)) return "Cerveja";
  if (/DRINK|MOCKTAIL|PROMO|DOSE|VINHO|BEBIDA|SOFT/.test(g)) return "Drinks e outras bebidas";
  return "Entradas, cortesias e outros";
};
const COR_CAT = { "Cerveja": "#f2a63b", "Drinks e outras bebidas": "#e8607a", "Comida": "#4fc3b0", "Entradas, cortesias e outros": "#9b8cf2" };

Chart.defaults.color = "#a99c94";
Chart.defaults.borderColor = "#3a3035";
Chart.defaults.font.family = "DM Sans";
Chart.defaults.plugins.tooltip.callbacks.label = ctx => {
  const v = ctx.parsed.y ?? ctx.parsed;
  return `${ctx.dataset.label ? ctx.dataset.label + ": " : ""}${ctx.dataset._fmt === "n" ? nfmt(v) : brl(v)}`;
};
let charts = [];
function grafico(el, cfg) { const c = new Chart(el, cfg); charts.push(c); return c; }
function limparGraficos() { charts.forEach(c => c.destroy()); charts = []; }

// ============ ESTADO ============
const S = { user: null, perfil: null, aba: null, timer: null, periodo: null };

// ============ AUTENTICAÇÃO ============
function mostrarMsg(txt, tipo = "erro") { const m = $("#msg-login"); m.textContent = txt; m.className = "msg " + tipo; }

$("#form-login").addEventListener("submit", async e => {
  e.preventDefault();
  const b = e.submitter; b.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#senha").value });
  b.disabled = false;
  if (error) return mostrarMsg(error.message.includes("Invalid") ? "E-mail ou senha incorretos." : error.message);
  $("#msg-login").className = "msg hidden";
  iniciar();
});

$("#btn-esqueci").addEventListener("click", async () => {
  const email = $("#email").value.trim();
  if (!email) return mostrarMsg("Digite seu e-mail acima e clique de novo em “Esqueci minha senha”.");
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  mostrarMsg(error ? error.message : "Se esse e-mail tiver acesso, você vai receber um link para criar uma nova senha.", error ? "erro" : "ok");
});

$("#form-nova-senha").addEventListener("submit", async e => {
  e.preventDefault();
  const a = $("#nova1").value, b = $("#nova2").value;
  if (a !== b) return mostrarMsg("As senhas não conferem.");
  const { error } = await sb.auth.updateUser({ password: a });
  if (error) return mostrarMsg(error.message);
  history.replaceState(null, "", location.pathname);
  definindoSenha = false;
  iniciar();
});

$("#btn-sair").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

let definindoSenha = /type=(invite|recovery)/.test(location.hash);
sb.auth.onAuthStateChange((ev) => {
  if (ev === "PASSWORD_RECOVERY") { definindoSenha = true; telaSenha(); }
});

function telaLogin() {
  $("#app").classList.add("hidden"); $("#tela-login").classList.remove("hidden");
  $("#form-login").classList.remove("hidden"); $("#form-nova-senha").classList.add("hidden");
}
function telaSenha() {
  $("#app").classList.add("hidden"); $("#tela-login").classList.remove("hidden");
  $("#form-login").classList.add("hidden"); $("#form-nova-senha").classList.remove("hidden");
}

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  if (definindoSenha) return telaSenha();
  S.user = session.user;
  const { data: perfil } = await sb.from("perfis").select("*").eq("user_id", S.user.id).maybeSingle();
  if (!perfil) {
    telaLogin(); mostrarMsg("Seu usuário ainda não tem perfil de acesso. Peça para a Andrea liberar.");
    await sb.auth.signOut(); return;
  }
  S.perfil = perfil;
  $("#tela-login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#quem-nome").textContent = perfil.nome;
  $("#quem-papel").textContent = { dona: "Dona", gerente: "Gerente", caixa: "Caixa" }[perfil.papel];
  montarAbas();
}

// ============ NAVEGAÇÃO ============
const ABAS = [
  { id: "hoje", nome: "Hoje", papeis: ["dona", "gerente", "caixa"], fn: abaHoje },
  { id: "geral", nome: "Faturamento", papeis: ["dona", "gerente"], fn: abaGeral },
  { id: "produtos", nome: "Produtos", papeis: ["dona", "gerente"], fn: abaProdutos },
  { id: "equipe", nome: "Equipe", papeis: ["dona", "gerente"], fn: abaEquipe },
  { id: "cruzamentos", nome: "Cruzamentos", papeis: ["dona", "gerente"], fn: abaCruzamentos },
  { id: "contagem", nome: "Contagem", papeis: ["dona", "gerente", "caixa"], fn: abaContagem },
  { id: "bandas", nome: "Bandas", papeis: ["dona", "gerente"], fn: abaBandas },
  { id: "pedido", nome: "Pedido", papeis: ["dona", "gerente"], fn: abaPedido },
  { id: "importar", nome: "Importar dados", papeis: ["dona", "gerente"], fn: abaImportar },
  { id: "usuarios", nome: "Usuários", papeis: ["dona"], fn: abaUsuarios },
];
function montarAbas() {
  const minhas = ABAS.filter(a => a.papeis.includes(S.perfil.papel));
  $("#abas").innerHTML = minhas.map(a => `<button data-aba="${a.id}">${a.nome}</button>`).join("");
  $("#abas").onclick = e => { const b = e.target.closest("button"); if (b) abrir(b.dataset.aba); };
  const h = location.hash.slice(1);
  if (h === "receber" && gestor()) return abaReceber();
  abrir(minhas.find(a => a.id === h) ? h : (S.perfil.papel === "caixa" ? "hoje" : "geral"));
}
function abrir(id) {
  clearInterval(S.timer); limparGraficos();
  S.aba = id; history.replaceState(null, "", "#" + id);
  document.querySelectorAll("#abas button").forEach(b => b.classList.toggle("ativa", b.dataset.aba === id));
  $("#abas .ativa")?.scrollIntoView({ inline: "center", block: "nearest" });
  $("#conteudo").innerHTML = `<div class="vazio">Carregando…</div>`;
  ABAS.find(a => a.id === id).fn().catch(err => {
    console.error(err);
    $("#conteudo").innerHTML = `<div class="msg erro">Erro ao carregar: ${esc(err.message || err)}</div>`;
  });
}

// ============ DADOS ============
async function todos(q) { // pagina além do limite de 1000 linhas
  let out = [], de = 0, passo = 1000;
  for (;;) {
    const { data, error } = await q().range(de, de + passo - 1);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < passo) return out;
    de += passo;
  }
}
async function limitesDados() {
  const { data: a } = await sb.from("vw_resumo_diario").select("dia").order("dia", { ascending: true }).limit(1);
  const { data: b } = await sb.from("vw_resumo_diario").select("dia").order("dia", { ascending: false }).limit(1);
  return { min: a?.[0]?.dia, max: b?.[0]?.dia };
}
async function periodoPadrao() {
  if (S.periodo) return S.periodo;
  const { min, max } = await limitesDados();
  if (!max) return null;
  const ini = max.slice(0, 8) + "01";
  S.periodo = { ini: ini < min ? min : ini, fim: max, min, max };
  return S.periodo;
}
function htmlFiltro(p) {
  return `<div class="filtros">
    <select id="f-atalho"><option value="">Atalhos…</option><option value="mes">Último mês com dados</option><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option><option value="tudo">Todo o histórico</option></select>
    <input type="date" id="f-ini" value="${p.ini}"> <span style="color:var(--mute)">até</span> <input type="date" id="f-fim" value="${p.fim}">
    <button class="btn peq" id="f-ok">Aplicar</button></div>`;
}
function ligarFiltro() {
  $("#f-ok").onclick = () => { S.periodo = { ...S.periodo, ini: $("#f-ini").value, fim: $("#f-fim").value }; abrir(S.aba); };
  $("#f-atalho").onchange = e => {
    const v = e.target.value, p = S.periodo; if (!v) return;
    if (v === "mes") { p.fim = p.max; p.ini = p.max.slice(0, 8) + "01"; }
    if (v === "30") { p.fim = p.max; p.ini = addDias(p.max, -29); }
    if (v === "90") { p.fim = p.max; p.ini = addDias(p.max, -89); }
    if (v === "tudo") { p.ini = p.min; p.fim = p.max; }
    abrir(S.aba);
  };
}
function semDados() {
  $("#conteudo").innerHTML = `<div class="card vazio"><h3>Ainda não há vendas no sistema</h3>
  <p>${S.perfil.papel === "caixa" ? "Peça para a gerência importar os dados do Epoc." : `Vá em <a href="#importar" onclick="abrir('importar');return false">Importar dados</a> e envie o relatório “Venda de produtos por hora” do Epoc.`}</p></div>`;
}

// ============ ABA: HOJE ============
async function abaHoje() {
  const render = async () => {
    const { max } = await limitesDados();
    if (!max) return semDados();
    const hojeSP = diaOperacionalHoje(); // dia operacional vira às 06h
    const dia = max;
    const [{ data: res }, { data: horas }, prods, { data: ultimas }, { data: info }] = await Promise.all([
      sb.from("vw_resumo_diario").select("*").eq("dia", dia).maybeSingle(),
      sb.from("vw_vendas_hora").select("*").eq("dia", dia).order("hora"),
      todos(() => sb.from("vw_vendas_produto_dia").select("*").eq("dia", dia).order("faturamento", { ascending: false })),
      sb.from("vendas_itens").select("data,hora,produto,qtd,valor").eq("dia_operacional", dia).order("data", { ascending: false }).order("hora", { ascending: false }).limit(15),
      sb.from("dias").select("*").eq("data", dia).maybeSingle(),
    ]);
    // comparação com mesmo dia da semana anterior (gestão)
    let comp = null;
    if (S.perfil.papel !== "caixa") {
      const { data: c } = await sb.from("vw_resumo_diario").select("*").eq("dia", addDias(dia, -7)).maybeSingle();
      comp = c;
    }
    const ehHoje = dia === hojeSP;
    const ordenaH = h => (h < 6 ? h + 24 : h);
    const hs = (horas || []).sort((a, b) => ordenaH(a.hora) - ordenaH(b.hora));
    const top = prods.slice(0, 10);
    const qtdTop = [...prods].sort((a, b) => b.qtd - a.qtd).slice(0, 10);
    const maxF = Math.max(...top.map(p => p.faturamento), 1);
    const varia = comp ? (res.faturamento - comp.faturamento) / comp.faturamento : null;

    $("#conteudo").innerHTML = `
    <div class="cab-sec"><div><h2>${ehHoje ? "Hoje" : "Último dia com vendas"}: ${DIAS_LONGO[dow(dia)]}, ${br(dia)}</h2>
      <p>${info?.atracao ? "Atração: <b>" + esc(info.atracao) + "</b> · " : ""}${info?.jogo ? "Jogo: " + esc(info.jogo) + " · " : ""}Primeira venda ${res.primeira_venda?.slice(11, 16)} · última ${res.ultima_venda?.slice(11, 16)}</p></div>
      <span class="ao-vivo">Atualiza sozinho a cada minuto</span></div>
    ${!ehHoje ? `<div class="aviso">Os dados vêm da última importação do Epoc. Quando a integração automática com a API do Epoc for liberada, esta tela vai mostrar o movimento da noite em tempo real.</div>` : ""}
    <div class="grade kpis">
      <div class="card kpi destaque"><div class="rot">Faturamento</div><div class="val">${brl(res.faturamento)}</div>
        <div class="det">${varia !== null ? `${varia >= 0 ? "▲" : "▼"} ${pct(Math.abs(varia))} vs ${DIAS[dow(dia)]} anterior (${brl0(comp.faturamento)})` : ""}</div></div>
      <div class="card kpi"><div class="rot">Itens vendidos</div><div class="val">${nfmt(res.itens)}</div><div class="det">${nfmt(res.lancamentos)} lançamentos</div></div>
      <div class="card kpi"><div class="rot">Valor médio por item</div><div class="val">${brl(res.faturamento / res.itens)}</div></div>
      <div class="card kpi"><div class="rot">Hora mais forte</div><div class="val">${hs.length ? String([...hs].sort((a, b) => b.faturamento - a.faturamento)[0].hora).padStart(2, "0") + "h" : "—"}</div>
        <div class="det">${hs.length ? brl0(Math.max(...hs.map(h => h.faturamento))) + " nessa hora" : ""}</div></div>
    </div>
    <div class="grade dois" style="margin-top:14px">
      <div class="card"><h3>Vendas por hora</h3><div class="sub">Faturamento em cada hora da noite</div><div class="graf"><canvas id="g-hora"></canvas></div></div>
      <div class="card"><h3>Mais vendidos da noite</h3><div class="sub">Por faturamento</div>
        <div class="rolagem"><table><tbody>${top.map(p => `<tr><td>${esc(p.produto)}<div class="barra-mini"><i style="width:${p.faturamento / maxF * 100}%"></i></div></td><td class="n">${nfmt(p.qtd)} un</td><td class="n">${brl(p.faturamento)}</td></tr>`).join("")}</tbody></table></div></div>
    </div>
    <div class="grade dois" style="margin-top:14px">
      <div class="card"><h3>Contagem por produto</h3><div class="sub">Os 10 com mais unidades — útil para conferir estoque no fechamento</div>
        <table><thead><tr><th>Produto</th><th class="n">Unid.</th></tr></thead><tbody>${qtdTop.map(p => `<tr><td>${esc(p.produto)}</td><td class="n">${nfmt(p.qtd)}</td></tr>`).join("")}</tbody></table></div>
      <div class="card"><h3>Últimos lançamentos</h3><div class="sub">Mais recentes primeiro</div>
        <table><thead><tr><th>Hora</th><th>Produto</th><th class="n">Qtd</th><th class="n">Valor</th></tr></thead><tbody>${(ultimas || []).map(u => `<tr><td>${u.hora.slice(0, 5)}</td><td>${esc(u.produto)}</td><td class="n">${nfmt(u.qtd)}</td><td class="n">${brl(u.valor)}</td></tr>`).join("")}</tbody></table></div>
    </div>`;
    limparGraficos();
    grafico($("#g-hora"), { type: "bar", data: { labels: hs.map(h => String(h.hora).padStart(2, "0") + "h"), datasets: [{ data: hs.map(h => h.faturamento), backgroundColor: "#f2a63b", borderRadius: 6 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => brl0(v) } } } } });

}

// ============ ABA: FATURAMENTO ============
async function abaGeral() {
  const p = await periodoPadrao(); if (!p) return semDados();
  const [dias, horas, prods, { data: infos }] = await Promise.all([
    todos(() => sb.from("vw_resumo_diario").select("*").gte("dia", p.ini).lte("dia", p.fim).order("dia")),
    todos(() => sb.from("vw_vendas_hora").select("*").gte("dia", p.ini).lte("dia", p.fim)),
    todos(() => sb.from("vw_vendas_produto_dia").select("dia,grupo,faturamento").gte("dia", p.ini).lte("dia", p.fim)),
    sb.from("dias").select("*").gte("data", p.ini).lte("data", p.fim),
  ]);
  if (!dias.length) { $("#conteudo").innerHTML = `<div class="cab-sec"><h2>Faturamento</h2>${htmlFiltro(p)}</div><div class="card vazio">Sem vendas nesse período.</div>`; return ligarFiltro(); }
  const info = Object.fromEntries((infos || []).map(i => [i.data, i]));
  const total = dias.reduce((s, d) => s + +d.faturamento, 0);
  const itens = dias.reduce((s, d) => s + +d.itens, 0);
  const melhor = [...dias].sort((a, b) => b.faturamento - a.faturamento)[0];
  const pior = [...dias].sort((a, b) => a.faturamento - b.faturamento)[0];
  // por dia da semana
  const porDow = Array.from({ length: 7 }, () => ({ soma: 0, n: 0 }));
  dias.forEach(d => { const w = dow(d.dia); porDow[w].soma += +d.faturamento; porDow[w].n++; });
  const ordemDow = [3, 4, 5, 6, 0, 1, 2].filter(w => porDow[w].n);
  // categorias
  const porCat = {}; prods.forEach(r => { const c = CATEG(r.grupo); porCat[c] = (porCat[c] || 0) + +r.faturamento; });
  // heatmap
  const horasLista = [...new Set(horas.map(h => h.hora))].sort((a, b) => (a < 6 ? a + 24 : a) - (b < 6 ? b + 24 : b));
  const hm = {}; horas.forEach(h => { const k = dow(h.dia) + "-" + h.hora; hm[k] = (hm[k] || 0) + +h.faturamento; });
  Object.keys(hm).forEach(k => { const w = +k.split("-")[0]; hm[k] /= porDow[w].n; });
  const hmMax = Math.max(...Object.values(hm), 1);
  const corHeat = v => { const t = v / hmMax; return `rgba(242,166,59,${0.08 + t * 0.92})`; };

  // insights automáticos
  const medDow = ordemDow.map(w => ({ w, m: porDow[w].soma / porDow[w].n })).sort((a, b) => b.m - a.m);
  const ins = [];
  if (medDow.length > 1) ins.push(`<b>${DIAS_LONGO[medDow[0].w]}</b> é o dia mais forte (média ${brl0(medDow[0].m)}), ${nfmt(medDow[0].m / medDow[medDow.length - 1].m, 1)}× a <b>${DIAS_LONGO[medDow[medDow.length - 1].w].toLowerCase()}</b> (${brl0(medDow[medDow.length - 1].m)}).`);
  const pico = Object.entries(hm).sort((a, b) => b[1] - a[1])[0];
  if (pico) { const [w, h] = pico[0].split("-"); ins.push(`O pico médio é <b>${DIAS_LONGO[w].toLowerCase()} às ${h}h</b>, com ${brl0(pico[1])} por hora — é aí que a equipe não pode faltar.`); }
  const cerv = (porCat["Cerveja"] || 0) / total; ins.push(`Cerveja responde por <b>${pct(cerv)}</b> do faturamento; comida por <b>${pct((porCat["Comida"] || 0) / total)}</b>.`);
  ins.push(`Melhor dia: <b>${br(melhor.dia)}</b> (${brl0(melhor.faturamento)})${info[melhor.dia]?.jogo ? " — dia de " + esc(info[melhor.dia].jogo) : info[melhor.dia]?.atracao ? " — " + esc(info[melhor.dia].atracao) : ""}. Pior: ${br(pior.dia)} (${brl0(pior.faturamento)}).`);

  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Faturamento</h2><p>${br(p.ini)} a ${br(p.fim)} · ${dias.length} dias com vendas</p></div>${htmlFiltro(p)}</div>
  <div class="grade kpis">
    <div class="card kpi destaque"><div class="rot">Faturamento no período</div><div class="val">${brl0(total)}</div><div class="det">${nfmt(itens)} itens vendidos</div></div>
    <div class="card kpi"><div class="rot">Média por noite aberta</div><div class="val">${brl0(total / dias.length)}</div></div>
    <div class="card kpi"><div class="rot">Valor médio por item</div><div class="val">${brl(total / itens)}</div></div>
    <div class="card kpi"><div class="rot">Melhor noite</div><div class="val">${brl0(melhor.faturamento)}</div><div class="det">${DIAS[dow(melhor.dia)]} ${br(melhor.dia)}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>O que os números dizem</h3><div class="sub">Gerado automaticamente a partir do período escolhido</div><ul class="insights">${ins.map(i => `<li>${i}</li>`).join("")}</ul></div>
  <div class="card" style="margin-top:14px"><h3>Faturamento por noite</h3><div class="sub">Cor da barra = dia da semana</div><div class="graf alto"><canvas id="g-dias"></canvas></div></div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Média por dia da semana</h3><div class="sub">Faturamento médio por noite aberta</div><div class="graf"><canvas id="g-dow"></canvas></div></div>
    <div class="card"><h3>De onde vem o dinheiro</h3><div class="sub">Faturamento por categoria</div><div class="graf"><canvas id="g-cat"></canvas></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Mapa de calor: dia × hora</h3><div class="sub">Faturamento médio por hora em cada dia da semana — use para escalar equipe</div>
    <div style="overflow-x:auto"><div class="heat" style="grid-template-columns:44px repeat(${horasLista.length},minmax(42px,1fr));min-width:${60 + horasLista.length * 46}px">
      <div></div>${horasLista.map(h => `<div class="h">${String(h).padStart(2, "0")}h</div>`).join("")}
      ${ordemDow.map(w => `<div class="h">${DIAS[w]}</div>${horasLista.map(h => { const v = hm[w + "-" + h] || 0; return `<div class="c" style="background:${v ? corHeat(v) : "var(--panel2)"};color:${v / hmMax > .45 ? "#1a1208" : "#f4ede6"}" title="${DIAS[w]} ${h}h: ${brl0(v)}">${v ? nfmt(v / 1000, 1) + "k" : ""}</div>`; }).join("")}`).join("")}
    </div></div></div>`;
  ligarFiltro();
  const coresDow = ["#9b8cf2", "#555", "#555", "#4fc3b0", "#7cc46a", "#e8607a", "#f2a63b"];
  grafico($("#g-dias"), { type: "bar", data: { labels: dias.map(d => DIAS[dow(d.dia)] + " " + br(d.dia).slice(0, 5)), datasets: [{ data: dias.map(d => d.faturamento), backgroundColor: dias.map(d => coresDow[dow(d.dia)]), borderRadius: 5 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { afterLabel: ctx => { const i = info[dias[ctx.dataIndex].dia]; return i ? [i.atracao, i.jogo].filter(Boolean).join(" · ") : ""; } } } }, scales: { y: { ticks: { callback: v => brl0(v) } } } } });
  grafico($("#g-dow"), { type: "bar", data: { labels: ordemDow.map(w => DIAS[w] + ` (${porDow[w].n})`), datasets: [{ data: ordemDow.map(w => porDow[w].soma / porDow[w].n), backgroundColor: ordemDow.map(w => coresDow[w]), borderRadius: 6 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => brl0(v) } } } } });
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  grafico($("#g-cat"), { type: "bar", data: { labels: cats.map(c => c[0]), datasets: [{ data: cats.map(c => c[1]), backgroundColor: cats.map(c => COR_CAT[c[0]]), borderRadius: 6 }] },
    options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${brl0(ctx.parsed.x)} (${pct(ctx.parsed.x / total)})` } } }, scales: { x: { ticks: { callback: v => brl0(v) } } } } });
}

// ============ ABA: PRODUTOS ============
async function abaProdutos() {
  const p = await periodoPadrao(); if (!p) return semDados();
  const rows = await todos(() => sb.from("vw_vendas_produto_dia").select("*").gte("dia", p.ini).lte("dia", p.fim));
  const nDias = new Set(rows.map(r => r.dia)).size;
  const ag = {};
  rows.forEach(r => {
    const k = r.produto; ag[k] ??= { produto: k, grupo: r.grupo, qtd: 0, fat: 0, dias: new Set(), fds: 0, sem: 0 };
    ag[k].qtd += +r.qtd; ag[k].fat += +r.faturamento; ag[k].dias.add(r.dia);
    const w = dow(r.dia); if (w === 5 || w === 6) ag[k].fds += +r.faturamento; else ag[k].sem += +r.faturamento;
  });
  const lista = Object.values(ag).sort((a, b) => b.fat - a.fat);
  const total = lista.reduce((s, x) => s + x.fat, 0);
  let acum = 0; lista.forEach(x => { acum += x.fat; x.abc = acum / total <= .8 ? "A" : acum / total <= .95 ? "B" : "C"; });
  const mortos = lista.filter(x => x.qtd < 10 && x.fat > 0);
  const gratis = lista.filter(x => x.fat === 0 && x.qtd > 0);
  const grupos = {}; lista.forEach(x => { grupos[x.grupo] = (grupos[x.grupo] || 0) + x.fat; });
  const gl = Object.entries(grupos).sort((a, b) => b[1] - a[1]);
  const nA = lista.filter(x => x.abc === "A").length;
  // produtos de dia fraco: maior peso relativo qua/qui/dom
  const fracos = lista.filter(x => x.fat > total * 0.003).map(x => ({ ...x, peso: x.sem / (x.fat || 1) })).sort((a, b) => b.peso - a.peso).slice(0, 8);

  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Produtos</h2><p>${br(p.ini)} a ${br(p.fim)} · ${lista.length} produtos vendidos em ${nDias} noites</p></div>${htmlFiltro(p)}</div>
  <div class="grade kpis">
    <div class="card kpi destaque"><div class="rot">Curva A</div><div class="val">${nA} produtos</div><div class="det">fazem 80% do faturamento</div></div>
    <div class="card kpi"><div class="rot">Quase parados</div><div class="val">${mortos.length}</div><div class="det">venderam menos de 10 un. e somam ${brl0(mortos.reduce((s, x) => s + x.fat, 0))}</div></div>
    <div class="card kpi"><div class="rot">Saíram a R$ 0</div><div class="val">${nfmt(gratis.reduce((s, x) => s + x.qtd, 0))} un.</div><div class="det">${gratis.length} itens (cortesias, welcome drink…)</div></div>
    <div class="card kpi"><div class="rot">Grupo líder</div><div class="val" style="font-size:22px">${esc(gl[0]?.[0])}</div><div class="det">${pct(gl[0]?.[1] / total)} do faturamento</div></div>
  </div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Faturamento por grupo do cardápio</h3><div class="sub">Grupos cadastrados no Epoc</div><div class="graf alto"><canvas id="g-grupos"></canvas></div></div>
    <div class="card"><h3>Bons para promover nos dias fracos</h3><div class="sub">Produtos relevantes que já vendem proporcionalmente mais de qua, qui e dom</div>
      <table><thead><tr><th>Produto</th><th class="n">% fora de sex/sáb</th><th class="n">Faturamento</th></tr></thead><tbody>${fracos.map(x => `<tr><td>${esc(x.produto)}</td><td class="n">${pct(x.peso)}</td><td class="n">${brl0(x.fat)}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
    <div><h3>Ranking completo</h3><div class="sub">A = 80% do faturamento, B = próximos 15%, C = últimos 5%</div></div>
    <input id="busca" placeholder="Buscar produto…" style="width:220px"></div>
    <div class="rolagem"><table id="tab-prod"><thead><tr><th>#</th><th>Produto</th><th>Grupo</th><th class="n">Unid.</th><th class="n">Faturamento</th><th class="n">% total</th><th class="n">Noites</th><th>Curva</th></tr></thead>
    <tbody>${lista.map((x, i) => `<tr data-n="${esc(x.produto.toLowerCase())}"><td>${i + 1}</td><td>${esc(x.produto)}</td><td><span class="tag">${esc(x.grupo)}</span></td><td class="n">${nfmt(x.qtd)}</td><td class="n">${brl(x.fat)}</td><td class="n">${pct(x.fat / total)}</td><td class="n">${x.dias.size}</td><td><span class="tag ${x.abc === "A" ? "bom" : x.abc === "C" ? "ruim" : "ok"}">${x.abc}</span></td></tr>`).join("")}</tbody></table></div></div>
  <div class="card" style="margin-top:14px"><h3>Candidatos a sair do cardápio</h3><div class="sub">Menos de 10 unidades no período</div>
    <div class="rolagem" style="max-height:300px"><table><thead><tr><th>Produto</th><th>Grupo</th><th class="n">Unid.</th><th class="n">Faturamento</th></tr></thead><tbody>${mortos.map(x => `<tr><td>${esc(x.produto)}</td><td>${esc(x.grupo)}</td><td class="n">${nfmt(x.qtd)}</td><td class="n">${brl(x.fat)}</td></tr>`).join("")}</tbody></table></div></div>`;
  ligarFiltro();
  $("#busca").oninput = e => { const t = e.target.value.toLowerCase(); document.querySelectorAll("#tab-prod tbody tr").forEach(tr => tr.style.display = tr.dataset.n.includes(t) ? "" : "none"); };
  grafico($("#g-grupos"), { type: "bar", data: { labels: gl.map(g => g[0]), datasets: [{ data: gl.map(g => g[1]), backgroundColor: gl.map(g => COR_CAT[CATEG(g[0])]), borderRadius: 5 }] },

}

// ============ ABA: EQUIPE ============
async function abaEquipe() {
  const p = await periodoPadrao(); if (!p) return semDados();
  const [{ data: fr }, { data: vf }, dias] = await Promise.all([
    sb.from("freelas").select("*").order("semana_inicio"),
    sb.from("vendas_funcionario").select("*").order("valor", { ascending: false }),
    todos(() => sb.from("vw_resumo_diario").select("dia,faturamento")),
  ]);
  const semanas = {};
  (fr || []).forEach(f => { const s = semanas[f.semana_inicio] ??= { ini: f.semana_inicio, pessoas: 0, diarias: 0, custo: 0, temCusto: false, lista: [] }; s.pessoas++; s.diarias += +f.dias || 0; if (f.valor != null) { s.custo += +f.valor; s.temCusto = true; } s.lista.push(f); });
  const sl = Object.values(semanas).sort((a, b) => a.ini.localeCompare(b.ini));
  sl.forEach(s => { const fim = addDias(s.ini, 6); s.fat = dias.filter(d => d.dia >= s.ini && d.dia <= fim).reduce((t, d) => t + +d.faturamento, 0); s.noites = dias.filter(d => d.dia >= s.ini && d.dia <= fim).length; });
  const ultima = sl[sl.length - 1];
  const totVF = (vf || []).reduce((s, x) => s + +x.valor, 0);

async function abaCruzamentos() {
  const p = await periodoPadrao(); if (!p) return semDados();
  const [dias, { data: infos }, prods, { data: pags }] = await Promise.all([
    todos(() => sb.from("vw_resumo_diario").select("*").gte("dia", p.ini).lte("dia", p.fim).order("dia")),
    sb.from("dias").select("*").gte("data", p.ini).lte("data", p.fim),
    todos(() => sb.from("vw_vendas_produto_dia").select("dia,grupo,faturamento").gte("dia", p.ini).lte("dia", p.fim)),
    sb.from("pagamentos_bandas").select("data,atracao,valor").gte("data", p.ini).lte("data", p.fim),
  ]);
  const info = Object.fromEntries((infos || []).map(i => [i.data, { ...i }]));
  (pags || []).forEach(pg => {
    const i = info[pg.data] ??= { data: pg.data };
    i.cache_valor = (+i.cache_valor || 0) + +pg.valor;
    if (!i.atracao) i.atracao = pg.atracao;
    else if (!i.atracao.toLowerCase().includes(pg.atracao.toLowerCase())) i.atracao += " + " + pg.atracao;
  });
  const porDow = {}; dias.forEach(d => { const w = dow(d.dia); (porDow[w] ??= []).push(+d.faturamento); });
  const mediaDow = w => porDow[w].reduce((a, b) => a + b, 0) / porDow[w].length;
  const comida = {}; prods.forEach(r => { if (CATEG(r.grupo) === "Comida") comida[r.dia] = (comida[r.dia] || 0) + +r.faturamento; });
  const linhas = dias.map(d => {
    const i = info[d.dia] || {}; const m = mediaDow(dow(d.dia)); const desvio = (d.faturamento - m) / m;
    return { ...d, i, m, desvio, liq: d.faturamento - (+i.cache_valor || 0), comida: (comida[d.dia] || 0) / d.faturamento };
  });
  const comChuva = linhas.filter(l => l.i.chuva === true), semChuva = linhas.filter(l => l.i.chuva === false);
  const md = a => a.length ? a.reduce((s, l) => s + l.desvio, 0) / a.length : null;
  const ins = [];
  const acima = linhas.filter(l => l.i.atracao).sort((a, b) => b.desvio - a.desvio);
  if (acima.length) ins.push(`Atração que mais puxou acima da média do seu dia da semana: <b>${esc(acima[0].i.atracao)}</b> (${acima[0].desvio >= 0 ? "+" : ""}${pct(acima[0].desvio)} em ${br(acima[0].dia)}).`);
  if (acima.length > 1) ins.push(`A que ficou mais abaixo: <b>${esc(acima[acima.length - 1].i.atracao)}</b> (${pct(acima[acima.length - 1].desvio)}).`);
  const jogos = linhas.filter(l => l.i.jogo); if (jogos.length) ins.push(`Dias com jogo ficaram em média <b>${md(jogos) >= 0 ? "+" : ""}${pct(md(jogos))}</b> vs a média do dia da semana.`);
  if (comChuva.length && semChuva.length) ins.push(`Com chuva: <b>${pct(md(comChuva))}</b> vs média; sem chuva: <b>${pct(md(semChuva))}</b>.`);
  if (!ins.length) ins.push("Preencha atração, cachê, clima e jogo na tabela abaixo para o painel começar a encontrar padrões.");
  const podeEditar = ["dona", "gerente"].includes(S.perfil.papel);

  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Cruzamentos</h2><p>Atração, cachê, clima e jogos contra o faturamento · comparação sempre contra a média do mesmo dia da semana</p></div>${htmlFiltro(p)}</div>
  <div class="card"><h3>Padrões encontrados</h3><div class="sub">Quanto mais dias você preencher, mais confiáveis ficam</div><ul class="insights">${ins.map(i => `<li>${i}</li>`).join("")}</ul></div>
  <div class="card" style="margin-top:14px"><h3>Desempenho de cada noite vs. a média do seu dia da semana</h3><div class="sub">Assim uma quarta não é comparada com um sábado</div><div class="graf"><canvas id="g-desvio"></canvas></div></div>
  <div class="card" style="margin-top:14px"><h3>Noite a noite</h3><div class="sub">${podeEditar ? "Clique em “Editar” para lançar atração, cachê, clima ou jogo" : ""}</div>
    <div class="rolagem" style="max-height:600px"><table><thead><tr><th>Data</th><th>Atração</th><th>Clima</th><th>Jogo / obs.</th><th class="n">Faturamento</th><th class="n">vs média</th><th class="n">Cachê</th><th class="n">Fat. − cachê</th><th class="n">% comida</th>${podeEditar ? "<th></th>" : ""}</tr></thead><tbody>

      <td>${[l.i.clima, l.i.temp_min != null ? nfmt(+l.i.temp_min) + "–" + nfmt(+l.i.temp_max) + "°C" : "", l.i.chuva ? "chuva" : ""].filter(Boolean).map(esc).join(" · ")}</td>

    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${nfmt(ctx.parsed.y, 1)}% vs média · ${brl0(linhas[ctx.dataIndex].faturamento)}`, afterLabel: ctx => linhas[ctx.dataIndex].i.atracao || "" } } }, scales: { y: { ticks: { callback: v => v + "%" } } } } });
  document.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => editarDia(b.dataset.ed, info[b.dataset.ed] || {}));

const MOMENTOS = {

  entrada: { nome: "Entrada de mercadoria", dica: "Chegou fornecedor? Lance só o que entrou" },

};
const diaOperacionalHoje = () => iso(new Date(Date.now() - 3 * 3600e3 - 6 * 3600e3 + new Date().getTimezoneOffset() * 60e3));
const C = { passo: 1, data: null, momento: null, cat: null, itens: [], valores: {}, timers: {} };

async function abaContagem() {
  C.data ??= diaOperacionalHoje();

async function carregarValores() {

function cabPassos(nomes, atual) {

function desenharContagem() {

      ${its.map(i => `<div class="item-cont"><div class="nome">${esc(i.nome)}<small>${esc(i.unidade)}</small></div>

function agendarSalvar(id, txt) {

    if (v == null) ({ error } = await sb.from("contagens").delete().match({ data: C.data, momento: C.momento, item_id: id }));
    else ({ error } = await sb.from("contagens").upsert({ data: C.data, momento: C.momento, item_id: id, quantidade: v, atualizado_em: new Date().toISOString() }, { onConflict: "data,momento,item_id" }));
    if (error) { if (ok) { ok.textContent = "✖"; ok.className = "salvo erro"; ok.title = error.message; } return; }
    if (v == null) delete C.valores[id]; else C.valores[id] = v;
    if (ok) ok.textContent = v == null ? "" : "✔";
  }, 600);
}
async function resumoContagem() {

    <div class="sub">${C.itens.length - faltam.length} de ${C.itens.length} itens lançados</div>
    ${faltam.length && C.momento !== "entrada" ? `<div class="aviso">Faltam: ${faltam.map(i => esc(i.nome)).join(", ")}</div>` : `<div class="msg ok">Contagem completa ✔</div>`}`;
  if (!gestor()) { el.className = ""; el.innerHTML = html + `<p style="color:var(--mute)">A gerência vê a comparação com as vendas do Epoc.</p>`; return; }
  const [{ data: comp }, { data: vendas }] = await Promise.all([
    sb.from("vw_estoque_comparativo").select("*").eq("data", C.data).order("ordem"),
    sb.from("vendas_itens").select("codigo,qtd,valor").eq("dia_operacional", C.data),
  ]);
  const preco = {}; (vendas || []).forEach(v => { const p = preco[v.codigo] ??= { q: 0, v: 0 }; p.q += +v.qtd; p.v += +v.valor; });
  const itensPorId = Object.fromEntries(C.itens.map(i => [i.id, i]));
  const linhas = (comp || []).map(r => {
    const it = itensPorId[r.item_id] || { codigos: [] };
    const pv = it.codigos.reduce((a, c) => ({ q: a.q + (preco[c]?.q || 0), v: a.v + (preco[c]?.v || 0) }), { q: 0, v: 0 });
    const dif = r.consumo_contado != null && r.vendido_epoc != null ? +r.consumo_contado - +r.vendido_epoc : null;
    return { ...r, dif, valorDif: dif != null && pv.q ? dif * pv.v / pv.q / (+it.fator || 1) : null };
  });
  const comDif = linhas.filter(l => l.dif != null);
  const perda = comDif.filter(l => l.dif > 0).reduce((s, l) => s + (l.valorDif || 0), 0);
  const temVendas = (vendas || []).length > 0;
  html += `${!temVendas ? `<div class="aviso">As vendas desta noite ainda não foram importadas do Epoc. A comparação aparece depois da importação.</div>` : ""}
    ${comDif.length ? `<div class="grade kpis" style="margin:12px 0"><div class="card kpi ${perda > 0 ? "destaque" : ""}"><div class="rot">Sumiu sem venda (estimado)</div><div class="val">${brl0(perda)}</div><div class="det">pelo preço médio de venda da noite</div></div>
      <div class="card kpi"><div class="rot">Itens com diferença</div><div class="val">${comDif.filter(l => Math.abs(l.dif) >= 1).length}</div><div class="det">de ${comDif.length} comparáveis</div></div></div>` : ""}
    <div class="rolagem"><table><thead><tr><th>Item</th><th class="n">Abertura</th><th class="n">Entrada</th><th class="n">Fechamento</th><th class="n">Consumo contado</th><th class="n">Vendido no Epoc</th><th class="n">Diferença</th></tr></thead><tbody>
    ${linhas.map(l => `<tr><td>${esc(l.nome)}</td><td class="n">${l.abertura ?? "—"}</td><td class="n">${+l.entrada || ""}</td><td class="n">${l.fechamento ?? "—"}</td><td class="n">${l.consumo_contado ?? "—"}</td><td class="n">${l.vendido_epoc ?? "<span class='tag'>sem vínculo</span>"}</td>
      <td class="n">${l.dif == null ? "—" : l.dif === 0 ? "0 ✔" : `<span class="${l.dif > 0 ? "dif-pos" : "dif-neg"}">${l.dif > 0 ? "−" + nfmt(l.dif, 1) + " sumiu" : "+" + nfmt(-l.dif, 1) + " sobrou"}</span>`}</td></tr>`).join("")}
    </tbody></table></div>
    <p style="font-size:13px;color:var(--mute)">Consumo contado = abertura + entrada − fechamento. “Sumiu” = saiu do estoque sem venda (quebra, cortesia não lançada, erro de contagem ou desvio). “Sobrou” = vendeu mais do que saiu (erro de contagem ou de lançamento no Epoc).</p>`;
  el.className = ""; el.innerHTML = html;
}
async function historicoDiferencas() {
  const el = $("#hist-dif"); if (!el) return;

  const l = Object.values(ag).sort((a, b) => b.dif - a.dif);

}

  <tr data-id=""><td><input name="ordem" type="number" value="99" style="width:64px;padding:6px"></td><td><input name="nome" placeholder="Novo item" style="padding:6px"></td><td><input name="categoria" placeholder="Categoria" style="padding:6px"></td><td><input name="unidade" value="un" style="width:80px;padding:6px"></td><td><input name="codigos" placeholder="ex.: 51" style="width:110px;padding:6px"></td><td><input name="fator" type="number" value="1" style="width:70px;padding:6px"></td><td><input name="ativo" type="checkbox" checked style="width:auto"></td><td><button class="btn peq" data-salvar>Adicionar</button></td></tr>

  <p style="font-size:13px;color:var(--mute)">Códigos Epoc: o código do produto no Epoc (aparece no relatório de vendas). Pode ter mais de um, separados por vírgula. Fator: quantas unidades contadas cada venda consome (ex.: um balde com 4 garrafas = código do balde com fator 4, num item separado). Destilados sem código ficam só na contagem, sem comparação.</p></div>`;

// ============ ABA: BANDAS (passo a passo) ============
const B = { passo: 1, reg: {} };
async function abaBandas() {
  const p = await periodoPadrao();
  B.mes ??= (p?.max || diaOperacionalHoje()).slice(0, 7);
  B.reg.data ??= diaOperacionalHoje();
  B.reg.status ??= "pago";
  const ini = B.mes + "-01", fim = iso(new Date(+B.mes.slice(0, 4), +B.mes.slice(5, 7), 0));
  const [{ data: pags }, { data: todasAtr }, dias] = await Promise.all([
    sb.from("pagamentos_bandas").select("*").order("data", { ascending: false }),
    sb.from("dias").select("atracao").not("atracao", "is", null),
    todos(() => sb.from("vw_resumo_diario").select("dia,faturamento")),
  ]);
  const fat = Object.fromEntries(dias.map(d => [d.dia, +d.faturamento]));
  const nomes = [...new Set([...(pags || []).map(x => x.atracao), ...(todasAtr || []).map(x => x.atracao)])].sort();
  const doMes = (pags || []).filter(x => x.data >= ini && x.data <= fim);
  const pend = (pags || []).filter(x => x.status === "a pagar");
  const totMes = doMes.reduce((s, x) => s + +x.valor, 0);
  const noitesMes = new Set(doMes.map(x => x.data));
  const fatNoites = [...noitesMes].reduce((s, d) => s + (fat[d] || 0), 0);
  // média por dia da semana (para comparar atrações de forma justa)
  const porDow = {}; dias.forEach(d => (porDow[dow(d.dia)] ??= []).push(+d.faturamento));
  const mediaDow = w => porDow[w] ? porDow[w].reduce((a, b) => a + b, 0) / porDow[w].length : null;
  // ranking por atração (todas as datas)
  const rk = {}; (pags || []).forEach(x => { const r = rk[x.atracao] ??= { nome: x.atracao, noites: new Set(), cache: 0, fat: 0, desv: [] };
    if (!r.noites.has(x.data)) { r.noites.add(x.data); if (fat[x.data] != null) { r.fat += fat[x.data]; const m = mediaDow(dow(x.data)); if (m) r.desv.push((fat[x.data] - m) / m); } } r.cache += +x.valor; });
  const rank = Object.values(rk).map(r => ({ ...r, n: r.noites.size, desvMed: r.desv.length ? r.desv.reduce((a, b) => a + b, 0) / r.desv.length : null })).sort((a, b) => (b.desvMed ?? -9) - (a.desvMed ?? -9));

  const passos = cabPassos(["Noite", "Atração", "Valor", "Confirmar"], B.passo);
  const R = B.reg;
  let wiz = "";
  if (B.passo === 1) wiz = `<h3>De qual noite é o pagamento?</h3><input type="date" id="b-data" class="grande" value="${R.data}" style="max-width:280px">
    <div id="b-info" class="sub" style="margin-top:10px"></div><div class="rodape-passos"><span></span><button class="btn" id="b-prox">Próximo →</button></div>`;
  if (B.passo === 2) wiz = `<h3>Quem tocou?</h3><input id="b-atr" class="grande" list="lista-atr" value="${esc(R.atracao || "")}" placeholder="Nome da banda / DJ" autocomplete="off">
    <datalist id="lista-atr">${nomes.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
    <div class="chips" style="margin-top:12px">${nomes.slice(0, 12).map(n => `<button data-nome="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <div class="rodape-passos"><button class="btn sec" id="b-volta">← Voltar</button><button class="btn" id="b-prox">Próximo →</button></div>`;
  if (B.passo === 3) wiz = `<h3>Quanto e como?</h3><label>Valor do cachê (R$)</label><input id="b-valor" class="grande" inputmode="decimal" value="${R.valor != null ? nfmt(R.valor, 2) : ""}" placeholder="0,00" style="max-width:280px">
    <label>Forma de pagamento</label><div class="chips" id="b-forma">${["Pix", "Dinheiro", "Transferência", "Outro"].map(f => `<button class="${R.forma === f ? "sel" : ""}" data-v="${f}">${f}</button>`).join("")}</div>
    <label>Situação</label><div class="chips" id="b-status"><button class="${R.status === "pago" ? "sel" : ""}" data-v="pago">Já paguei</button><button class="${R.status === "a pagar" ? "sel" : ""}" data-v="a pagar">Ainda vou pagar</button></div>
    <div class="rodape-passos"><button class="btn sec" id="b-volta">← Voltar</button><button class="btn" id="b-prox">Próximo →</button></div>`;
  if (B.passo === 4) wiz = `<h3>Confere?</h3><table><tbody>
    <tr><td>Noite</td><td><b>${DIAS_LONGO[dow(R.data)]}, ${br(R.data)}</b></td></tr><tr><td>Atração</td><td><b>${esc(R.atracao)}</b></td></tr>
    <tr><td>Cachê</td><td><b>${brl(R.valor)}</b> · ${esc(R.forma || "—")}</td></tr><tr><td>Situação</td><td><span class="tag ${R.status === "pago" ? "bom" : "ok"}">${R.status === "pago" ? "pago" : "a pagar"}</span></td></tr>
    ${fat[R.data] ? `<tr><td>Faturamento da noite</td><td>${brl0(fat[R.data])} · cachê = <b>${pct(R.valor / fat[R.data])}</b></td></tr>` : ""}</tbody></table>
    <label>Observação (opcional)</label><input id="b-obs" value="${esc(R.observacao || "")}" placeholder="ex.: cachê dividido em 3 noites">
    <div class="rodape-passos"><button class="btn sec" id="b-volta">← Voltar</button><button class="btn" id="b-salvar">Salvar pagamento ✔</button></div><div id="b-msg"></div>`;
  if (B.passo === 5) wiz = `<div class="msg ok">Pagamento salvo ✔</div><div class="rodape-passos"><button class="btn" id="b-outro">Lançar outro</button></div>`;

  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Pagamentos de bandas</h2><p>Lance o cachê em 4 passos; o painel soma e compara com o faturamento</p></div>
    <div class="filtros"><label style="margin:0">Mês</label><input type="month" id="b-mes" value="${B.mes}"></div></div>
  <div class="grade dois"><div class="card">${B.passo <= 4 ? passos : ""}${wiz}</div>
    <div class="card"><h3>Resumo de ${new Date(ini + "T12:00").toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}</h3><div class="sub">${noitesMes.size} noites com atração paga</div>
      <div class="grade kpis"><div class="card kpi destaque"><div class="rot">Cachês no mês</div><div class="val">${brl0(totMes)}</div></div>
      <div class="card kpi"><div class="rot">% do faturamento dessas noites</div><div class="val">${fatNoites ? pct(totMes / fatNoites) : "—"}</div><div class="det">${fatNoites ? brl0(fatNoites) + " faturados" : "vendas ainda não importadas"}</div></div>
      <div class="card kpi"><div class="rot">A pagar (todos os meses)</div><div class="val">${brl0(pend.reduce((s, x) => s + +x.valor, 0))}</div><div class="det">${pend.length} lançamentos</div></div></div>
      ${pend.length ? `<h3 style="margin-top:16px">Pendentes</h3><table><tbody>${pend.map(x => `<tr><td>${br(x.data)}</td><td>${esc(x.atracao)}</td><td class="n">${brl(x.valor)}</td><td><button class="btn peq" data-pagar="${x.id}">Marcar pago</button></td></tr>`).join("")}</tbody></table>` : ""}
    </div></div>
  <div class="card" style="margin-top:14px"><h3>Lançamentos do mês</h3><div class="rolagem"><table><thead><tr><th>Noite</th><th>Atração</th><th class="n">Cachê</th><th>Forma</th><th>Situação</th><th class="n">Faturamento da noite</th><th class="n">Cachê / fat.</th><th></th></tr></thead><tbody>
    ${doMes.map(x => `<tr><td>${DIAS[dow(x.data)]} ${br(x.data)}</td><td>${esc(x.atracao)}${x.observacao ? `<div style="font-size:12px;color:var(--mute)">${esc(x.observacao)}</div>` : ""}</td><td class="n">${brl(x.valor)}</td><td>${esc(x.forma || "")}</td><td><span class="tag ${x.status === "pago" ? "bom" : "ok"}">${x.status}</span></td>
      <td class="n">${fat[x.data] != null ? brl0(fat[x.data]) : "—"}</td><td class="n">${fat[x.data] ? pct(x.valor / fat[x.data]) : "—"}</td><td><button class="btn perigo peq" data-apagar="${x.id}">Apagar</button></td></tr>`).join("") || `<tr><td colspan="8" style="color:var(--mute)">Nenhum pagamento neste mês</td></tr>`}
  </tbody></table></div></div>
  <div class="card" style="margin-top:14px"><h3>Quais atrações valem o cachê</h3><div class="sub">Todo o histórico · comparação com a média do mesmo dia da semana, para não comparar quarta com sábado</div>
    <div class="rolagem"><table><thead><tr><th>Atração</th><th class="n">Noites</th><th class="n">Cachê total</th><th class="n">Faturamento das noites</th><th class="n">vs média do dia</th><th class="n">R$ faturado por R$ 1 de cachê</th></tr></thead><tbody>
    ${rank.map(r => `<tr><td>${esc(r.nome)}</td><td class="n">${r.n}</td><td class="n">${brl0(r.cache)}</td><td class="n">${r.fat ? brl0(r.fat) : "—"}</td><td class="n">${r.desvMed != null ? `<span class="tag ${r.desvMed > .1 ? "bom" : r.desvMed < -.1 ? "ruim" : ""}">${r.desvMed >= 0 ? "+" : ""}${pct(r.desvMed)}</span>` : "—"}</td><td class="n">${r.fat && r.cache ? nfmt(r.fat / r.cache, 1) : "—"}</td></tr>`).join("")}
    </tbody></table></div><p style="font-size:13px;color:var(--mute)">Quando duas atrações tocam na mesma noite (ex.: banda + DJ), o faturamento da noite conta para as duas.</p></div>`;

  // eventos do passo a passo
  const ir = n => { B.passo = n; abaBandas(); };
  $("#b-mes").onchange = e => { B.mes = e.target.value; abaBandas(); };
  if (B.passo === 1) {
    const info = () => { const d = $("#b-data").value; const ja = (pags || []).filter(x => x.data === d);
      $("#b-info").innerHTML = (fat[d] != null ? `Faturamento dessa noite: <b>${brl0(fat[d])}</b>. ` : "") + (ja.length ? `Já lançado: ${ja.map(x => esc(x.atracao) + " " + brl0(x.valor)).join(", ")}` : ""); };
    $("#b-data").onchange = info; info();
    $("#b-prox").onclick = () => { R.data = $("#b-data").value; if (R.data) ir(2); };
  }
  if (B.passo === 2) {
    document.querySelectorAll("[data-nome]").forEach(b => b.onclick = () => { $("#b-atr").value = b.dataset.nome; });
    $("#b-volta").onclick = () => ir(1);
    $("#b-prox").onclick = () => { R.atracao = $("#b-atr").value.trim(); if (R.atracao) ir(3); else $("#b-atr").focus(); };
  }
  if (B.passo === 3) {

    ["b-forma", "b-status"].forEach(id => $("#" + id).onclick = e => { const b = e.target.closest("button"); if (!b) return; $("#" + id).querySelectorAll("button").forEach(x => x.classList.remove("sel")); b.classList.add("sel"); if (id === "b-forma") R.forma = b.dataset.v; else R.status = b.dataset.v; });
    $("#b-volta").onclick = () => ir(2);

  if (B.passo === 4) {
    $("#b-volta").onclick = () => ir(3);

      $("#b-salvar").disabled = true;
      const { error } = await sb.from("pagamentos_bandas").insert({ data: R.data, atracao: R.atracao, valor: R.valor, forma: R.forma || null, status: R.status, pago_em: R.status === "pago" ? iso(new Date()) : null, observacao: $("#b-obs").value.trim() || null });
      if (error) { $("#b-msg").innerHTML = `<div class="msg erro">${esc(error.message)}</div>`; $("#b-salvar").disabled = false; return; }
      B.mes = R.data.slice(0, 7); ir(5);
    };
  }
  if (B.passo === 5) $("#b-outro").onclick = () => { B.reg = { data: R.data, status: "pago" }; ir(1); };
  document.querySelectorAll("[data-pagar]").forEach(b => b.onclick = async () => { await sb.from("pagamentos_bandas").update({ status: "pago", pago_em: iso(new Date()) }).eq("id", b.dataset.pagar); abaBandas(); });
  document.querySelectorAll("[data-apagar]").forEach(b => b.onclick = () => {
    const d = $("#dlg"); d.innerHTML = `<h3>Apagar este pagamento?</h3><p style="color:var(--mute)">Não dá para desfazer.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="c-n">Cancelar</button><button class="btn perigo" id="c-s">Apagar</button></div>`;
    d.showModal(); $("#c-n").onclick = () => d.close(); $("#c-s").onclick = async () => { await sb.from("pagamentos_bandas").delete().eq("id", b.dataset.apagar); d.close(); abaBandas(); };
  });
}

const P = {};
async function abaPedido() {
  const hoje = diaOperacionalHoje();
  P.ini ??= addDias(hoje, 1);
  P.fim ??= addDias(hoje, 7);
  const [{ data: itens }, { data: cfgRow }, { data: conts }] = await Promise.all([
    sb.from("itens_estoque").select("*").eq("ativo", true).order("ordem"),
    sb.from("config").select("valor").eq("chave", "pedido").maybeSingle(),
    sb.from("contagens").select("data,momento,item_id,quantidade").gte("data", addDias(hoje, -45)).order("data"),
  ]);
  const cfg = { margem: .2, fator_feriado: 1.3, fator_vespera: 1.3, ...(cfgRow?.valor || {}) };
  const { max } = await limitesDados();
  const baseFim = max || hoje, baseIni = addDias(baseFim, -55); // 8 semanas de histórico
  const codigos = [...new Set(itens.flatMap(i => i.codigos))];
  const vendas = codigos.length ? await todos(() => sb.from("vw_vendas_codigo_dia").select("*").gte("dia", addDias(baseIni, -45)).in("codigo", codigos)) : [];
  const diasComVenda = new Set(vendas.map(v => v.dia));
  const vendaDia = {}; vendas.forEach(v => { vendaDia[v.dia + "|" + v.codigo] = +v.qtd; });

  // média por dia da semana em noites abertas (últimas 8 semanas), excluindo feriados para não inflar
  const noitesBase = [...diasComVenda].filter(d => d >= baseIni && d <= baseFim && !FERIADOS[d] && !FERIADOS[addDias(d, 1)]);
  const nPorDow = {}; noitesBase.forEach(d => nPorDow[dow(d)] = (nPorDow[dow(d)] || 0) + 1);
  const abreDow = w => (nPorDow[w] || 0) > 0;

  // dias do período a cobrir
  const periodo = []; for (let d = P.ini; d <= P.fim; d = addDias(d, 1)) periodo.push(d);
  const diasAbertos = periodo.filter(d => abreDow(dow(d)) || FERIADOS[addDias(d, 1)]);
  const fatorDia = d => FERIADOS[addDias(d, 1)] ? cfg.fator_vespera : FERIADOS[d] ? cfg.fator_feriado : 1;

  const linhas = itens.map(it => {
    const temCod = it.codigos.length > 0;
    // média de unidades por dia da semana
    const mediaDow = {};
    if (temCod) noitesBase.forEach(d => { const q = it.codigos.reduce((s, c) => s + (vendaDia[d + "|" + c] || 0), 0) * (+it.fator || 1); mediaDow[dow(d)] = (mediaDow[dow(d)] || 0) + q / nPorDow[dow(d)]; });
    const previsto = temCod ? diasAbertos.reduce((s, d) => s + (mediaDow[dow(d)] ?? 0) * fatorDia(d), 0) : null;
    // estoque atual: última contagem (fechamento > abertura no mesmo dia) + entradas depois − vendas depois
    const cs = (conts || []).filter(c => c.item_id === it.id);
    const base = [...cs].filter(c => c.momento !== "entrada").sort((a, b) => a.data.localeCompare(b.data) || (a.momento === "fechamento") - (b.momento === "fechamento")).pop();
    let estoque = null, ref = null;
    if (base) {
      ref = base.data + (base.momento === "abertura" ? " (abertura)" : "");
      estoque = +base.quantidade
        + cs.filter(c => c.momento === "entrada" && (c.data > base.data || (base.momento === "abertura" && c.data === base.data))).reduce((s, c) => s + +c.quantidade, 0);
      if (temCod) {
        const desde = base.momento === "fechamento" ? addDias(base.data, 1) : base.data;
        for (let d = desde; d <= hoje; d = addDias(d, 1)) estoque -= it.codigos.reduce((s, c) => s + (vendaDia[d + "|" + c] || 0), 0) * (+it.fator || 1);
        estoque = Math.max(0, estoque);
      }
    }
    let sugerido = null, caixas = null;
    if (previsto != null) {
      const precisa = previsto * (1 + cfg.margem) - (estoque ?? 0);
      caixas = Math.max(0, Math.ceil(precisa / it.embalagem));
      sugerido = caixas * it.embalagem;
    }
    return { it, previsto, estoque, ref, sugerido, caixas };
  });
  const feriadosNoPeriodo = periodo.filter(d => FERIADOS[d] || FERIADOS[addDias(d, 1)]);
  const semEstoque = linhas.filter(l => l.estoque == null && l.previsto != null).length;
  const porForn = {}; linhas.filter(l => l.caixas > 0).forEach(l => (porForn[l.it.fornecedor || "Sem fornecedor"] ??= []).push(l));

  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Pedido sugerido</h2><p>Baseado no que vendeu por dia da semana nas últimas 8 semanas (${noitesBase.length} noites), no estoque contado e nos feriados</p></div></div>
  <div class="card"><div class="linha-form">
    <div><label>Cobrir de</label><input type="date" id="p-ini" value="${P.ini}"></div><div><label>até</label><input type="date" id="p-fim" value="${P.fim}"></div>
    <div><label>Margem de segurança</label><input type="number" id="p-margem" value="${Math.round(cfg.margem * 100)}" min="0" max="200"> </div>
    <div><label>Véspera de feriado (×)</label><input type="number" step="0.05" id="p-vesp" value="${cfg.fator_vespera}"></div>
    <div><label>Feriado (×)</label><input type="number" step="0.05" id="p-fer" value="${cfg.fator_feriado}"></div>
    <div><button class="btn largo" id="p-calc" style="margin-top:0">Recalcular</button></div></div>
    <p style="font-size:13px;color:var(--mute);margin-bottom:0">Período: ${diasAbertos.length} noites abertas (${diasAbertos.map(d => DIAS[dow(d)] + " " + br(d).slice(0, 5)).join(", ") || "nenhuma"}).
    ${feriadosNoPeriodo.length ? `<br>🎉 ${feriadosNoPeriodo.map(d => FERIADOS[d] ? `${br(d).slice(0, 5)} ${FERIADOS[d]}` : `${br(d).slice(0, 5)} véspera de ${FERIADOS[addDias(d, 1)]}`).join(" · ")}` : ""}</p></div>
  ${!noitesBase.length ? `<div class="aviso" style="margin-top:14px">Ainda não há vendas importadas nas últimas 8 semanas — importe o relatório do Epoc para a previsão funcionar.</div>` : ""}
  ${semEstoque ? `<div class="aviso" style="margin-top:14px">${semEstoque} itens sem contagem recente: a sugestão considera estoque zero para eles. Faça a contagem de fechamento para o pedido ficar certeiro.</div>` : ""}
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Pedido pronto para enviar</h3><div class="sub">Por fornecedor, em embalagens fechadas</div>
      ${Object.keys(porForn).length ? Object.entries(porForn).map(([f, ls]) => `<div style="margin-bottom:14px"><b>${esc(f)}</b><pre id="txt-${esc(f).replace(/\W/g, "")}" style="white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:10px;font:13px/1.5 'DM Sans'">${esc(`Pedido Vezpa Bar – ${br(hoje)}\n` + ls.map(l => `${l.caixas} × ${l.it.embalagem > 1 ? "cx " + l.it.embalagem : ""} ${l.it.nome}`.replace("  ", " ")).join("\n"))}</pre>
        <button class="btn sec peq" data-copiar="txt-${esc(f).replace(/\W/g, "")}">Copiar texto</button></div>`).join("") : `<div class="vazio">Nada a pedir no período com o estoque atual.</div>`}</div>
    <div class="card"><h3>Como a conta é feita</h3><ol class="insights">
      <li>Para cada item, calcula a média vendida em cada dia da semana nas últimas 8 semanas (sem contar feriados).</li>
      <li>Soma a previsão das noites que o bar abre no período, multiplicando vésperas e feriados pelo fator.</li>
      <li>Acrescenta a margem de segurança e desconta o estoque atual (última contagem − vendas desde então + entradas).</li>
      <li>Arredonda para cima em caixas fechadas. Embalagem e fornecedor se ajustam em <a href="#contagem" onclick="abrir('contagem');setTimeout(editarItens,300);return false">Itens da contagem</a>.</li></ol></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Item a item</h3><div class="rolagem" style="max-height:600px"><table><thead><tr><th>Item</th><th>Fornecedor</th><th class="n">Previsão de venda</th><th class="n">Estoque atual</th><th>Contado em</th><th class="n">Embalagem</th><th class="n">Pedir</th></tr></thead><tbody>
    ${linhas.map(l => `<tr><td>${esc(l.it.nome)}</td><td>${esc(l.it.fornecedor || "")}</td><td class="n">${l.previsto != null ? nfmt(l.previsto) : "<span class='tag'>sem vínculo Epoc</span>"}</td><td class="n">${l.estoque != null ? nfmt(l.estoque) : "—"}</td><td>${l.ref ? br(l.ref.slice(0, 10)) + l.ref.slice(10) : "—"}</td><td class="n">${l.it.embalagem}</td>
      <td class="n">${l.caixas == null ? "—" : l.caixas === 0 ? "<span class='tag bom'>ok</span>" : `<b>${l.caixas}</b> (${nfmt(l.sugerido)} ${esc(l.it.unidade)})`}</td></tr>`).join("")}
  </tbody></table></div>
  <p style="font-size:13px;color:var(--mute)">Destilados não têm código no Epoc (saem em doses e drinks), então não entram na previsão. Para eles, use a contagem como referência. Se quiser, dá para vincular cada drink ao destilado com um fator em doses.</p></div>`;
  $("#p-calc").onclick = async () => {
    P.ini = $("#p-ini").value; P.fim = $("#p-fim").value;
    const novo = { margem: (+$("#p-margem").value || 0) / 100, fator_vespera: +$("#p-vesp").value || 1, fator_feriado: +$("#p-fer").value || 1 };
    await sb.from("config").upsert({ chave: "pedido", valor: novo });
    abrir("pedido");
  };
  document.querySelectorAll("[data-copiar]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText($("#" + b.dataset.copiar).textContent); b.textContent = "Copiado ✔"; } catch (_) { b.textContent = "Selecione e copie o texto acima"; }
  });
}

function lerCSV(texto, sep) {
  const linhas = []; let campo = "", linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) { if (c === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c; }
    else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && texto[i + 1] === "\n") i++; linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}
const numBR = s => { s = String(s ?? "").replace(/R\$|\s/g, ""); const neg = s.startsWith("(-)"); s = s.replace("(-)", ""); if (!s) return null; const v = parseFloat(s.replace(/\./g, "").replace(",", ".")); return neg ? -v : v; };
const numQtd = s => { s = String(s).trim(); return /^\d+\.\d{1,2}$/.test(s) ? parseFloat(s) : numBR(s); };
const dataBR = s => { const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };
const diasTxt = s => { s = String(s || "").toLowerCase(); let m = s.match(/(\d+)?\s*(\d)\/(\d)/); if (m) return (+(m[1] || 0)) + m[2] / m[3]; m = s.match(/(\d+(?:[.,]\d+)?)/); return m ? +m[1].replace(",", ".") : 0; };
async function lerArquivo(f) {
  const buf = await f.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("�")) t = new TextDecoder("windows-1252").decode(buf);
  return t.replace(/^﻿/, "");
}
function detectar(texto) {
  const h = texto.slice(0, 300).toLowerCase();
  if (h.includes('"data";"hora"') || /^data;hora/.test(h)) return "hora";
  if (h.includes("total recebido") || (h.includes("codigo") && h.includes("grupo"))) return "produtos";
  if (h.includes("funcionario")) return "funcionario";
  if (/dias?\s*,/.test(h)) return "freelas";
  return "";
}
const TIPOS = { hora: "Venda de produtos por hora (Epoc)", produtos: "Relatório de venda de produtos — atualiza os grupos (Epoc)", funcionario: "Vendas por funcionário (Epoc)", freelas: "Pagamento de freelancers da semana" };

async function preparar(arquivo) {
  const texto = await lerArquivo(arquivo);
  const tipo = detectar(texto);
  const prev = $("#prev");
  prev.innerHTML = `<label>Tipo de relatório</label><select id="tipo">${Object.entries(TIPOS).map(([k, v]) => `<option value="${k}" ${k === tipo ? "selected" : ""}>${v}</option>`).join("")}</select>
    <div id="extra"></div><div id="resumo" class="msg" style="margin-top:12px"></div>
    <button class="btn largo" id="btn-imp">Importar</button>`;
  const atualizar = () => {
    const t = $("#tipo").value; const ex = $("#extra");
    ex.innerHTML = t === "funcionario" ? `<div class="linha-form"><div><label>Período de</label><input type="date" id="p-ini"></div><div><label>até</label><input type="date" id="p-fim"></div></div>`
      : t === "freelas" ? `<label>Semana que começa na quarta-feira</label><input type="date" id="p-sem">` : "";
    try { const r = analisar(t, texto); $("#resumo").innerHTML = r.resumo; $("#resumo").className = "msg ok"; $("#btn-imp").disabled = false; prev._r = r; }
    catch (e) { $("#resumo").textContent = e.message; $("#resumo").className = "msg erro"; $("#btn-imp").disabled = true; }
  };
  $("#tipo").onchange = atualizar; atualizar();
  $("#btn-imp").onclick = async () => {
    const b = $("#btn-imp"); b.disabled = true; b.textContent = "Importando…";
    try { await enviar($("#tipo").value, prev._r, arquivo.name); $("#resumo").innerHTML = "Importado com sucesso ✔"; $("#resumo").className = "msg ok"; S.periodo = null; setTimeout(() => abrir("importar"), 1200); }
    catch (e) { $("#resumo").textContent = "Erro: " + (e.message || e); $("#resumo").className = "msg erro"; b.disabled = false; b.textContent = "Importar"; }
  };
}

function analisar(tipo, texto) {
  if (tipo === "hora") {
    const ls = lerCSV(texto, ";").slice(1).filter(l => dataBR(l[0]) && l[1]);
    if (!ls.length) throw new Error("Não encontrei linhas de venda (esperado: Data;Hora;Cód.;Produto;Qtde.;Vlr. Total).");
    const itens = ls.map(l => ({ data: dataBR(l[0]), hora: l[1].trim(), codigo: (l[2] || "").trim(), produto: (l[3] || "").trim(), qtd: numBR(l[4]) ?? 1, valor: numBR(l[5]) ?? 0 }));
    const datas = [...new Set(itens.map(i => i.data))].sort();
    const total = itens.reduce((s, i) => s + i.valor, 0);
    return { itens, resumo: `${nfmt(itens.length)} lançamentos de ${br(datas[0])} a ${br(datas[datas.length - 1])} · total ${brl(total)}` };
  }
  if (tipo === "produtos") {
    const ls = lerCSV(texto, ";").slice(1).filter(l => l.length >= 13 && /^\d+$/.test((l[0] || "").trim()));
    if (!ls.length) throw new Error("Não encontrei produtos com código e grupo.");
    const itens = ls.map(l => ({ codigo: l[0].trim(), nome: l[1].trim(), grupo: l[2].trim() }));
    return { itens, resumo: `${itens.length} produtos em ${new Set(itens.map(i => i.grupo)).size} grupos` };
  }
  if (tipo === "funcionario") {
    const ls = lerCSV(texto, ";").slice(1).filter(l => /^\d+$/.test((l[0] || "").trim()));
    const itens = ls.map(l => ({ funcionario: l[1].trim(), qtd: parseFloat(l[2]), valor: numBR(l[4]) }));
    if (!itens.length) throw new Error("Não encontrei funcionários.");
    return { itens, resumo: `${itens.length} funcionários · total ${brl(itens.reduce((s, i) => s + i.valor, 0))}` };
  }
  if (tipo === "freelas") {
    const sep = (texto.split("\n")[0].match(/;/g) || []).length > (texto.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
    const ls = lerCSV(texto, sep).filter(l => (l[0] || "").trim() && /dia/i.test(l[1] || ""));
    const itens = ls.map(l => ({ nome: l[0].trim(), dias: diasTxt(l[1]), valor: numBR(l[3]), funcao: (l[4] || "").trim() || null }));
    if (!itens.length) throw new Error("Não encontrei freelas (esperado: Nome, X dias, CPF/Pix, Valor, Função).");
    return { itens, resumo: `${itens.length} freelas · ${nfmt(itens.reduce((s, i) => s + i.dias, 0), 1)} diárias · ${brl(itens.reduce((s, i) => s + (i.valor || 0), 0))}` };
  }
  throw new Error("Escolha o tipo de relatório.");
}

async function enviar(tipo, r, nome) {
  if (tipo === "hora") {
    // envia em lotes de datas inteiras (cada lote substitui as suas datas)
    const porData = {}; r.itens.forEach(i => (porData[i.data] ??= []).push(i));
    let lote = [];
    const datas = Object.keys(porData).sort();
    for (let k = 0; k < datas.length; k++) {
      lote = lote.concat(porData[datas[k]]);
      if (lote.length > 2500 || k === datas.length - 1) {
        const { error } = await sb.rpc("importar_vendas_itens", { p_arquivo: nome, p_linhas: lote });
        if (error) throw error; lote = [];
      }
    }
  } else if (tipo === "produtos") {
    const { error } = await sb.rpc("importar_produtos", { p_linhas: r.itens }); if (error) throw error;
  } else if (tipo === "funcionario") {
    const ini = $("#p-ini").value, fim = $("#p-fim").value; if (!ini || !fim) throw new Error("Informe o período do relatório.");
    const { error } = await sb.rpc("importar_vendas_funcionario", { p_arquivo: nome, p_ini: ini, p_fim: fim, p_linhas: r.itens }); if (error) throw error;
  } else if (tipo === "freelas") {
    const sem = $("#p-sem").value; if (!sem) throw new Error("Informe a quarta-feira que inicia a semana.");
    const { error } = await sb.rpc("importar_freelas", { p_arquivo: nome, p_semana: sem, p_linhas: r.itens }); if (error) throw error;
  }
}
