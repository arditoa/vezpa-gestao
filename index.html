// ============ Ranking de clientes (visitas do relatório Fidelidade do Epoc) ============
const RK = { modo: "mes", ref: null, busca: "", ordem: "visitas" };
function periodoRK() {
  const hoje = diaOperacionalHoje(), [a, m] = hoje.split("-").map(Number);
  if (RK.modo === "mes") { const r = RK.ref || hoje.slice(0, 7); const [y, mm] = r.split("-").map(Number); const fim = new Date(y, mm, 0).getDate(); return { ini: `${r}-01`, fim: `${r}-${String(fim).padStart(2, "0")}`, nome: MESES[mm - 1] + " " + y }; }
  if (RK.modo === "tri") { const r = RK.ref || `${a}-T${Math.ceil(m / 3)}`; const [y, t] = [+r.slice(0, 4), +r.slice(-1)]; const m1 = (t - 1) * 3 + 1, m3 = m1 + 2; return { ini: `${y}-${String(m1).padStart(2, "0")}-01`, fim: `${y}-${String(m3).padStart(2, "0")}-${new Date(y, m3, 0).getDate()}`, nome: `${t}º trimestre de ${y}` }; }
  const y = RK.ref || String(a); return { ini: `${y}-01-01`, fim: `${y}-12-31`, nome: y };
}
async function rankingClientes() {
  const el = $("#rk-clientes"); if (!el) return;
  const { data: lim } = await sb.from("clientes_visitas").select("dia").order("dia").limit(1);
  if (!lim?.length) { el.innerHTML = `<div class="card"><h3>Quem mais vem</h3><div class="sub">Ainda sem visitas importadas. Elas vêm do relatório <b>Fidelidade</b> do Epoc, pela ponte de importação.</div></div>`; return; }
  const primeiro = lim[0].dia, hoje = diaOperacionalHoje();
  const P = periodoRK();
  const { data: R, error } = await sb.rpc("ranking_clientes", { p_ini: P.ini, p_fim: P.fim < hoje ? P.fim : hoje, p_lim: RK.busca ? 25000 : 300 });
  if (error) { el.innerHTML = `<div class="aviso">${esc(error.message)}</div>`; return; }
  // opções de período
  const meses = []; for (let d = primeiro.slice(0, 7); d <= hoje.slice(0, 7); d = addDias(d + "-01", 32).slice(0, 7)) meses.push(d);
  const tris = [...new Set(meses.map(x => `${x.slice(0, 4)}-T${Math.ceil(+x.slice(5, 7) / 3)}`))], anos = [...new Set(meses.map(x => x.slice(0, 4)))];
  const ops = RK.modo === "mes" ? meses.map(x => [x, MESES[+x.slice(5, 7) - 1] + " " + x.slice(0, 4)]) : RK.modo === "tri" ? tris.map(x => [x, `${x.slice(-1)}º tri ${x.slice(0, 4)}`]) : anos.map(x => [x, x]);
  const atual = RK.ref || ops[ops.length - 1]?.[0];
  const fone = t => t ? `(${t.slice(0, 2)}) ${t.slice(2, -4)}-${t.slice(-4)}` : "";
  const wa = (c, txt) => c.telefone ? `<a class="btn sec peq" target="_blank" rel="noopener" href="${esc(linkWhats(c.telefone, txt.replace("{nome}", (c.nome || "").split(" ")[0])))}">WhatsApp</a>` : "";
  const fr = R.freq || {};
  let top = R.top || [];
  if (RK.busca) { const b = semAcento(RK.busca); top = top.filter(c => semAcento(c.nome).includes(b)); }
  const ORD = { visitas: (a, b) => b.visitas - a.visitas || (+b.maior_conta || 0) - (+a.maior_conta || 0), total: (a, b) => b.visitas_total - a.visitas_total || b.visitas - a.visitas, conta: (a, b) => (+b.maior_conta || 0) - (+a.maior_conta || 0) };
  top = [...top].sort(ORD[RK.ordem]).slice(0, RK.busca ? 200 : 100);
  const linhaTop = (c, i) => `<tr><td class="n" style="color:var(--mute)">${i + 1}</td><td><b>${esc(c.nome || "cliente " + c.codigo)}</b><small class="sub2">${fone(c.telefone)}</small></td><td class="n"><b>${c.visitas}</b></td><td class="n">${c.visitas_total}</td><td>${br(c.ultima)}</td><td class="n">${c.maior_conta ? brl0(+c.maior_conta) : "—"}</td></tr>`;
  el.innerHTML = `
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
    <div><h3>Quem mais vem · ${esc(P.nome)}</h3><div class="sub">Visitas registradas no Epoc (cliente que deu entrada na noite) · dados desde ${br(primeiro)}</div></div>
    <div class="filtros"><div class="segmentos" style="margin:0">${[["mes", "Mês"], ["tri", "Trimestre"], ["ano", "Ano"]].map(([k, n]) => `<button class="${RK.modo === k ? "sel" : ""}" data-rkm="${k}">${n}</button>`).join("")}</div>
      <select id="rk-ref" style="width:auto">${ops.map(([v, n]) => `<option value="${v}" ${v === atual ? "selected" : ""}>${n}</option>`).join("")}</select></div></div>
    <div class="grade kpis" style="margin-top:12px">
      <div class="card kpi"><div class="rot">Clientes diferentes</div><div class="val">${nfmt(R.unicos)}</div><div class="det">${nfmt(R.visitas)} visitas no período</div></div>
      <div class="card kpi destaque"><div class="rot">Vieram 2 vezes ou mais</div><div class="val">${nfmt(R.recorrentes)}</div><div class="det">${R.unicos ? pct(R.recorrentes / R.unicos) : "—"} das clientes</div></div>
      <div class="card kpi"><div class="rot">Visitas por cliente</div><div class="val">${R.unicos ? nfmt(R.visitas / R.unicos, 2) : "—"}</div><div class="det">média do período</div></div>
      <div class="card kpi"><div class="rot">Frequência</div><div class="val" style="font-size:15px;line-height:1.5">${[1, 2, 3, 4, 5, 6].filter(k => fr[k]).map(k => `${k}${k === 6 ? "+" : ""}×: <b>${nfmt(fr[k])}</b>`).join(" · ")}</div></div>
    </div>
  </div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Ranking de visitas</h3><div class="sub">Quem veio no período</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0">
        <input id="rk-busca" placeholder="🔎 Buscar cliente…" value="${esc(RK.busca)}" style="max-width:220px">
        <div class="segmentos" style="margin:0">${[["visitas", "Visitas no período"], ["total", "Total histórico"], ["conta", "Maior conta"]].map(([k, n]) => `<button class="${RK.ordem === k ? "sel" : ""}" data-rko="${k}">${n}</button>`).join("")}</div></div>
      <div class="rolagem" style="max-height:520px"><table><thead><tr><th class="n">#</th><th>Cliente</th><th class="n">Visitas</th><th class="n">Total histórico</th><th>Última</th><th class="n">Maior conta</th></tr></thead><tbody>
      ${top.map(linhaTop).join("") || `<tr><td colspan="6" class="vazio">${RK.busca ? "Ninguém com esse nome no período" : "Ninguém no período"}</td></tr>`}</tbody></table></div></div>
    <div class="card"><h3>Maiores contas</h3><div class="sub">Entre quem veio no período · maior valor já gasto numa visita (o Epoc não separa o gasto por período)</div>
      <div class="rolagem" style="max-height:520px"><table><thead><tr><th class="n">#</th><th>Cliente</th><th class="n">Maior conta</th><th class="n">Visitas no período</th></tr></thead><tbody>
      ${(R.maiores_contas || []).map((c, i) => `<tr><td class="n" style="color:var(--mute)">${i + 1}</td><td><b>${esc(c.nome || c.codigo)}</b><small class="sub2">${fone(c.telefone)}</small></td><td class="n"><b>${brl0(+c.maior_conta)}</b></td><td class="n">${c.visitas}</td></tr>`).join("") || `<tr><td colspan="4" class="vazio">—</td></tr>`}</tbody></table></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Frequentes que sumiram</h3><div class="sub">Vieram 4 vezes ou mais e não aparecem há mais de 45 dias (até o fim do período) · bom público para um convite</div>
    <div class="rolagem" style="max-height:420px"><table><thead><tr><th>Cliente</th><th class="n">Visitas</th><th>Última visita</th><th></th></tr></thead><tbody>
    ${(R.sumidas || []).map(c => `<tr><td><b>${esc(c.nome || c.codigo)}</b><small class="sub2">${fone(c.telefone)}</small></td><td class="n">${c.visitas}</td><td>${br(c.ultima)}</td><td>${wa(c, "Oi {nome}! Aqui é o Vezpa 🐝 Tá fazendo falta por aqui! Essa semana tem programação nova, vem matar a saudade com a gente? 🧡")}</td></tr>`).join("") || `<tr><td colspan="4" class="vazio">Ninguém nessa situação 🎉</td></tr>`}</tbody></table></div></div>`;
  el.querySelectorAll("[data-rkm]").forEach(b => b.onclick = () => { RK.modo = b.dataset.rkm; RK.ref = null; rankingClientes(); });
  $("#rk-ref").onchange = e => { RK.ref = e.target.value; rankingClientes(); };
  el.querySelectorAll("[data-rko]").forEach(b => b.onclick = () => { RK.ordem = b.dataset.rko; rankingClientes(); });
  let tbk; $("#rk-busca").oninput = e => { clearTimeout(tbk); tbk = setTimeout(async () => { RK.busca = e.target.value.trim(); await rankingClientes(); const i = $("#rk-busca"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 400); };
}

async function abaRanking() {
  $("#conteudo").innerHTML = `<div class="cab-sec"><div><h2>Ranking de clientes</h2><p>Quem mais veio no mês (ou trimestre, ano) · visitas registradas no Epoc</p></div></div><div id="rk-clientes"></div>`;
  await rankingClientes();
}
async function abaPerfil() {
  const [{ data: P2, error }, dias] = await Promise.all([sb.rpc("perfil_clientes"), todos(() => sb.from("vw_resumo_diario").select("dia,faturamento"))]);
  if (error) throw error;
  if (!P2?.total) { $("#conteudo").innerHTML = `<div class="card vazio">Nenhum cliente importado ainda. Use Importar dados → cadastro de clientes do Epoc.</div>`; return; }
  const sx = P2.sexo || {}, mulheres = sx["Mulheres"] || 0, homens = sx["Homens"] || 0;
  const faixas = ["< 18", "18–24", "25–29", "30–34", "35–39", "40–49", "50+"].filter(f => f !== "< 18" || (P2.faixas || []).some(x => x.faixa === f));
  const fx = (f, s) => (P2.faixas || []).filter(x => x.faixa === f && (!s || x.sx === s)).reduce((a, x) => a + x.n, 0);
  const comIdade = faixas.reduce((a, f) => a + fx(f), 0);
  const top = [...faixas].sort((a, b) => fx(b) - fx(a))[0];
  const R = P2.recencia || {};
  const ultMes = (P2.ultima_mes || []).slice(-6), novos = (P2.novos_mes || []);
  const fatMes = {}; dias.forEach(d => { const m = d.dia.slice(0, 7); fatMes[m] = (fatMes[m] || 0) + +d.faturamento; });
  const mesAtual = diaOperacionalHoje().slice(0, 7);
  const ultimoMesCompleto = [...ultMes].reverse().find(x => x.mes < mesAtual && fatMes[x.mes] > 0) || null;
  const gastoEst = ultimoMesCompleto && fatMes[ultimoMesCompleto.mes] ? fatMes[ultimoMesCompleto.mes] / ultimoMesCompleto.n : null;
  const nomeMes = m => ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"][+m.slice(5, 7) - 1] + "/" + m.slice(2, 4);
  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Perfil dos clientes</h2><p>${nfmt(P2.total)} clientes cadastrados no Epoc · desde ${nomeMes(novos[0]?.mes || "2026-02")}</p></div></div>
  <div class="grade kpis">
    <div class="card kpi destaque"><div class="rot">Mulheres</div><div class="val">${pct(mulheres / P2.total)}</div><div class="det">${nfmt(mulheres)} · homens ${nfmt(homens)} (${pct(homens / P2.total)})</div></div>
    <div class="card kpi"><div class="rot">Idade média</div><div class="val">${nfmt(P2.idade_media, 0)} anos</div><div class="det">faixa mais comum: ${top} (${pct(fx(top) / comIdade)})</div></div>
    <div class="card kpi"><div class="rot">Vieram nos últimos 30 dias</div><div class="val">${nfmt(R.ate30)}</div><div class="det">${nfmt(R.d31a90)} entre 31 e 90 dias</div></div>
    <div class="card kpi"><div class="rot">Voltaram depois da 1ª visita</div><div class="val">${pct(P2.voltaram / P2.total)}</div><div class="det">${nfmt(P2.voltaram)} clientes</div></div>
  </div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Faixa etária</h3><div class="sub">${nfmt(comIdade)} clientes com data de nascimento</div><div class="graf"><canvas id="g-faixa"></canvas></div></div>
    <div class="card"><h3>Há quanto tempo não vêm</h3><div class="sub">Pela data da última visita no Epoc</div><div class="graf"><canvas id="g-rec"></canvas></div>
      <p class="dica">${nfmt(R.d91a180 + R.mais180)} clientes sumidos há mais de 90 dias — bom público para uma campanha de “volta”.</p></div>
  </div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Novos clientes por mês</h3><div class="sub">Primeira visita registrada</div><div class="graf"><canvas id="g-novos"></canvas></div></div>
    <div class="card"><h3>Gasto médio por cliente</h3><div class="sub">Estimativa</div>
      <div class="val" style="font:650 32px Inter;margin:10px 0">${gastoEst ? brl0(gastoEst) : "—"}</div>
      <p class="dica" style="margin-top:0">${ultimoMesCompleto ? `Faturamento de ${nomeMes(ultimoMesCompleto.mes)} (${brl0(fatMes[ultimoMesCompleto.mes] || 0)}) ÷ ${nfmt(ultimoMesCompleto.n)} clientes cuja última visita foi nesse mês.` : ""} É uma conta aproximada: quem voltou depois conta só no último mês, e nem todo mundo se cadastra na entrada. O Epoc informa por cliente a <b>maior conta</b> já feita numa visita (veja o ranking abaixo), mas não o total gasto por período.</p>
      <h3 style="margin-top:14px">Aniversários por mês</h3><div class="graf" style="height:170px"><canvas id="g-aniv"></canvas></div></div>
  </div>`;
  const cores = { Mulheres: "#e8607a", Homens: "#4fc3b0", "Não informado": "#9b8cf2" };
  grafico($("#g-faixa"), { type: "bar", data: { labels: faixas, datasets: ["Mulheres", "Homens"].map(s => ({ label: s, data: faixas.map(f => fx(f, s)), backgroundColor: cores[s], borderRadius: 4, _fmt: "n" })) },
    options: { maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } } });
  grafico($("#g-rec"), { type: "bar", data: { labels: ["até 30 dias", "31–90", "91–180", "mais de 180"], datasets: [{ data: [R.ate30, R.d31a90, R.d91a180, R.mais180], backgroundColor: ["#7cc46a", "#f2a63b", "#e8607a", "#6b5a60"], borderRadius: 6, _fmt: "n" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } } });
  grafico($("#g-novos"), { type: "bar", data: { labels: novos.map(x => nomeMes(x.mes)), datasets: [{ data: novos.map(x => x.n), backgroundColor: "#f2a63b", borderRadius: 5, _fmt: "n" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } } });
  const av = P2.aniv_mes || {};
  grafico($("#g-aniv"), { type: "bar", data: { labels: MESES.map(m => m.slice(0, 3)), datasets: [{ data: MESES.map((_, i) => av[i + 1] || 0), backgroundColor: "#9b8cf2", borderRadius: 4, _fmt: "n" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } } });
  $("#conteudo").insertAdjacentHTML("beforeend", `<div id="rk-clientes" style="margin-top:14px"></div>`);
  rankingClientes();
}

const AN = { filtro: "semana", regiao: "todos" };

    sb.from("config").select("valor").eq("chave", "aniversario").maybeSingle(),
    sb.from("aniversario_envios").select("cliente_codigo,enviado_em,veio").eq("ano", ay),
    sb.from("clientes").select("codigo", { count: "exact", head: true }),

  const C2 = { mensagem: "Oi {nome}! 🎂 Hoje o dia é todo seu e a gente do Vezpa não podia deixar passar: feliz aniversário! 🐝🧡 Que esse novo ciclo venha cheio de amor, saúde, risada e gente boa por perto. E pra celebrar do jeito que você merece, no mês do seu aniversário você ganha {presente} aqui no Vezpa. Chama as amigas, a crush (ou as duas 👀) e vem colar velcro com a gente! É só mostrar esta mensagem. 🏳️‍🌈", presente: "um drink de cortesia", mensagem_fora: MSG_FORA_PADRAO, ...(cfg?.valor || {}) };

  await generoPorNomes(itens.slice(0, 600).map(c => c.nome));

  const hojeK = am * 100 + +hoje.slice(8, 10);

// WhatsApp: no celular abre o app; no computador, WhatsApp Web (padrão) ou o app instalado (Mac/Windows), conforme a escolha salva
const ehCelular = () => /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
const destinoWhats = () => { try { return localStorage.getItem("vz_wa_destino") || "web"; } catch (_) { return "web"; } };
const linkWhats = (tel, texto, destino) => { const t = encodeURIComponent(texto), n = "55" + String(tel).replace(/\D/g, ""); destino ||= destinoWhats();
  if (ehCelular()) return `https://api.whatsapp.com/send?phone=${n}&text=${t}`;
  return destino === "app" ? `whatsapp://send?phone=${n}&text=${t}` : `https://web.whatsapp.com/send?phone=${n}&text=${t}`; };
const abrirWhats = (tel, texto, destino) => { if (destino) try { localStorage.setItem("vz_wa_destino", destino); } catch (_) {}
  const u = linkWhats(tel, texto, destino); if (u.startsWith("whatsapp:")) location.href = u; else window.open(u, "_blank", "noopener"); };
const botoesWhats = id => ehCelular() ? `<button class="btn" type="button" id="${id}" data-dest="web">Abrir no WhatsApp</button>`
  : `<button class="btn ${destinoWhats() === "app" ? "sec" : ""}" type="button" data-dest="web" id="${id}">WhatsApp Web</button><button class="btn ${destinoWhats() === "app" ? "" : "sec"}" type="button" data-dest="app" id="${id}-app">App do WhatsApp</button>`;
// gênero pelo PRIMEIRO NOME (frequência no Censo do IBGE), não pelo cadastro do Epoc (que tem muito erro)
const semAcento = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z]/g, "");
const primeiroNomeChave = n => semAcento(String(n || "").trim().split(/\s+/)[0]);
const GENERO = {};
async function generoPorNomes(nomes) {
  const ch = [...new Set(nomes.map(primeiroNomeChave).filter(x => x.length > 1 && !(x in GENERO)))];
  if (!ch.length) return;
  for (let i = 0; i < ch.length; i += 500) { const { data } = await sb.from("nomes_genero").select("nome,m,f").in("nome", ch.slice(i, i + 500)); (data || []).forEach(r => GENERO[r.nome] = r); }
  const faltam = ch.filter(x => !(x in GENERO));
  for (let i = 0; i < faltam.length; i += 40) {
    const lote = faltam.slice(i, i + 40), freq = {};
    try {
      for (const sx of ["M", "F"]) {
        const r = await fetch(`https://servicodados.ibge.gov.br/api/v2/censos/nomes/${lote.join("|")}?sexo=${sx}`);
        (await r.json()).forEach(x => { const k = semAcento(x.nome); (freq[k] ??= { m: 0, f: 0 })[sx.toLowerCase()] = x.res.reduce((a, b) => a + b.frequencia, 0); });
      }
    } catch (_) { continue; }
    const linhas = lote.map(n => ({ nome: n, m: freq[n]?.m || 0, f: freq[n]?.f || 0 }));
    linhas.forEach(r => GENERO[r.nome] = r);
    sb.from("nomes_genero").upsert(linhas).then(() => {});
  }
}
// masculino só quando o nome é claramente masculino (3x mais homens que mulheres no Censo); na dúvida, feminino
const ehHomem = c => { const g = GENERO[primeiroNomeChave(c?.nome)]; return !!g && g.m > 0 && g.m >= 3 * g.f; };
const TROCAS_MASC = [[/\buma Vezpa\b/g, "um Vezpa"], [/\bas amigas\b/g, "os amigos"], [/\bAs amigas\b/g, "Os amigos"], [/\bamigas\b/g, "amigos"],
  [/a crush \(ou as duas 👀\)/g, "o crush (ou os dois 👀)"], [/\ba crush\b/g, "o crush"], [/\bbem-vinda\b/g, "bem-vindo"], [/\bquerida\b/g, "querido"],
  [/\bsumida\b/g, "sumido"], [/\bconvidada\b/g, "convidado"], [/\blinda\b/g, "lindo"], [/\bparada\b/g, "parado"], [/\bapaixonada\b/g, "apaixonado"],
  [/\bsapatonas?\b/gi, "galera"], [/\bVezpetchys?\b/g, "Vezpetchy"]];
const generoMsg = (c, texto) => ehHomem(c) ? TROCAS_MASC.reduce((t, [r, v]) => t.replace(r, v), texto) : texto;
// ============ Prévia de WhatsApp reutilizável ============
function previaWhatsGeral({ titulo, sub, rotulo, texto, telefone, aoEnviar }) {
  const d = $("#dlg");
  d.innerHTML = `<h3>${titulo}</h3><div class="sub" style="margin-bottom:10px">${sub}</div>
    ${rotulo ? `<div class="rot-wa">${rotulo}</div>` : ""}<div class="wa-tela"><div class="wa-bolha" id="wg-bolha"></div></div>
    <label style="margin-top:12px">Ajustar só para esta pessoa</label><textarea id="wg-txt" rows="5">${esc(texto)}</textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap"><button class="btn sec" type="button" id="wg-c">Cancelar</button><button class="btn sec" type="button" id="wg-cop">Copiar texto</button>${botoesWhats("wg-ok")}</div>`;
  d.showModal();
  const t = $("#wg-txt"), at = () => { $("#wg-bolha").innerHTML = esc(t.value).replace(/\n/g, "<br>") + `<span class="wa-hora">${new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })} ✓✓</span>`; };
  t.oninput = at; at();
  $("#wg-c").onclick = () => d.close();
  $("#wg-cop").onclick = () => copiar(t.value, $("#wg-cop"));
  d.querySelectorAll("[data-dest]").forEach(b => b.onclick = async () => { abrirWhats(telefone, t.value, b.dataset.dest); await aoEnviar?.(); d.close(); });
}

  };

function lerCSV(texto, sep) {
  const linhas = []; let campo = "", linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) { if (c === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c; }
    else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && texto[i + 1] === "\n") i++; linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}
const numBR = s => { s = String(s ?? "").replace(/R\$|\s/g, ""); const neg = s.startsWith("(-)"); s = s.replace("(-)", ""); if (!s) return null; const v = parseFloat(s.replace(/\./g, "").replace(",", ".")); return neg ? -v : v; };
const numQtd = s => { s = String(s).trim(); return /^\d+\.\d{1,2}$/.test(s) ? parseFloat(s) : numBR(s); };
const dataBR = s => { const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };
const diasTxt = s => { s = String(s || "").toLowerCase(); let m = s.match(/(\d+)?\s*(\d)\/(\d)/); if (m) return (+(m[1] || 0)) + m[2] / m[3]; m = s.match(/(\d+(?:[.,]\d+)?)/); return m ? +m[1].replace(",", ".") : 0; };
async function lerArquivo(f) {
  const buf = await f.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("�")) t = new TextDecoder("windows-1252").decode(buf);
  return t.replace(/^﻿/, "");
}
function detectar(texto) {
  const h = texto.slice(0, 300).toLowerCase();
  if (h.includes('"data";"hora"') || /^data;hora/.test(h)) return "hora";
  if (h.includes("dt. de nasc") || /^"?codigo"?;"?nome"?;"?dia"?;"?mes"?/.test(h)) return "clientes";
  if (h.includes("total recebido") || (h.includes("codigo") && h.includes("grupo"))) return "produtos";
  if (h.includes("funcionario")) return "funcionario";
  if (/dias?\s*,/.test(h)) return "freelas";
  return "";
}
const TIPOS = { servicos: "Venda de serviços por noite — entrada, taxa de serviço, cliente gold (Epoc)", visitas: "Visitas de clientes por noite — relatório Fidelidade (Epoc)", fechamento: "Descontos e fechamento por noite (Epoc)", func_noites: "Vendas por funcionário, noite a noite (Epoc)", clientes: "Cadastro de clientes (Epoc)", hora: "Venda de produtos por hora (Epoc)", produtos: "Relatório de venda de produtos — atualiza os grupos (Epoc)", funcionario: "Vendas por funcionário (Epoc)", freelas: "Pagamento de freelancers da semana" };

async function preparar(arquivo) {
  const texto = await lerArquivo(arquivo);
  const tipo = detectar(texto);
  const prev = $("#prev");
  prev.innerHTML = `<label>Tipo de relatório</label><select id="tipo">${Object.entries(TIPOS).map(([k, v]) => `<option value="${k}" ${k === tipo ? "selected" : ""}>${v}</option>`).join("")}</select>
    <div id="extra"></div><div id="resumo" class="msg" style="margin-top:12px"></div>
    <button class="btn largo" id="btn-imp">Importar</button>`;
  const atualizar = () => {
    const t = $("#tipo").value; const ex = $("#extra");
    ex.innerHTML = t === "funcionario" ? `<div class="linha-form"><div><label>Período de</label><input type="date" id="p-ini"></div><div><label>até</label><input type="date" id="p-fim"></div></div>`
      : t === "freelas" ? `<label>Semana que começa na quarta-feira</label><input type="date" id="p-sem">` : "";
    try { const r = analisar(t, texto); $("#resumo").innerHTML = r.resumo; $("#resumo").className = "msg ok"; $("#btn-imp").disabled = false; prev._r = r; }
    catch (e) { $("#resumo").textContent = e.message; $("#resumo").className = "msg erro"; $("#btn-imp").disabled = true; }
  };
  $("#tipo").onchange = atualizar; atualizar();
  $("#btn-imp").onclick = async () => {
    const b = $("#btn-imp"); b.disabled = true; b.textContent = "Importando…";
    try { await enviar($("#tipo").value, prev._r, arquivo.name); $("#resumo").innerHTML = "Importado com sucesso ✔"; $("#resumo").className = "msg ok"; S.periodo = null; setTimeout(() => abrir("importar"), 1200); }
    catch (e) { $("#resumo").textContent = "Erro: " + (e.message || e); $("#resumo").className = "msg erro"; b.disabled = false; b.textContent = "Importar"; }
  };
}

function analisar(tipo, texto) {
  if (tipo === "hora") {
    const ls = lerCSV(texto, ";").slice(1).filter(l => dataBR(l[0]) && l[1]);
    if (!ls.length) throw new Error("Não encontrei linhas de venda (esperado: Data;Hora;Cód.;Produto;Qtde.;Vlr. Total).");
    const itens = ls.map(l => ({ data: dataBR(l[0]), hora: l[1].trim(), codigo: (l[2] || "").trim(), produto: (l[3] || "").trim(), qtd: numBR(l[4]) ?? 1, valor: numBR(l[5]) ?? 0 }));
    const datas = [...new Set(itens.map(i => i.data))].sort();
    const total = itens.reduce((s, i) => s + i.valor, 0);
    return { itens, resumo: `${nfmt(itens.length)} lançamentos de ${br(datas[0])} a ${br(datas[datas.length - 1])} · total ${brl(total)}` };
  }
  if (tipo === "servicos") {
    const itens = JSON.parse(texto); if (!itens.length) throw new Error("Nada recebido.");
    const ds = [...new Set(itens.map(i => i.dia))].sort(), ent = itens.filter(i => ehServicoEntrada(i.servico));
    return { itens, resumo: `${ds.length} noites (${br(ds[0])} a ${br(ds[ds.length - 1])}) · entradas: ${nfmt(ent.reduce((a, i) => a + i.qtd, 0))} pagantes, ${brl(ent.reduce((a, i) => a + i.total, 0))}` };
  }
  if (tipo === "visitas") {
    const j = JSON.parse(texto), pares = j.pares || []; if (!pares.length) throw new Error("Nenhuma visita recebida.");
    const ds = pares.map(p => p[1]).sort();
    return { itens: pares, maior: j.maior || {}, resumo: `${nfmt(pares.length)} visitas de ${nfmt(new Set(pares.map(p => p[0])).size)} clientes · ${br(ds[0])} a ${br(ds[ds.length - 1])}` };
  }
  if (tipo === "fechamento") {
    const itens = JSON.parse(texto); if (!itens.length) throw new Error("Nada recebido.");
    return { itens, resumo: `${itens.length} noites · descontos ${brl(itens.reduce((a, i) => a + (+i.desconto || 0) + (+i.rateio || 0), 0))} · líquido ${brl(itens.reduce((a, i) => a + (+i.liquido || 0), 0))}` };
  }
  if (tipo === "func_noites") {
    const itens = lerCSV(texto, ";").slice(1).filter(l => l[0] && l[1]).map(l => ({ data: dataBR(l[0]) || l[0], funcionario: l[1].trim(), qtd: parseFloat(l[2]) || 0, valor: numBR(l[3]) || 0 }));
    if (!itens.length) throw new Error("Não encontrei vendas por funcionário.");
    const noites = new Set(itens.map(i => i.data));
    return { itens, resumo: `${noites.size} noites · ${new Set(itens.map(i => i.funcionario.toLowerCase())).size} pessoas · total ${brl(itens.reduce((s, i) => s + i.valor, 0))}` };
  }
  if (tipo === "clientes") {
    const sep = (texto.split("\n")[0].match(/;/g) || []).length > (texto.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
    const todas = lerCSV(texto, sep); const cab = todas[0].map(c => c.toLowerCase());
    const so = v => String(v || "").replace(/\D/g, "");
    const data = v => { const m = String(v || "").match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? { d: +m[1], m: +m[2], a: +m[3] } : null; };
    let itens;
    if (cab[0] === "codigo") {
      itens = todas.slice(1).filter(l => l[0]).map(l => ({ codigo: l[0], nome: l[1], dia: l[2], mes: l[3], ano: l[4], telefone: l[5], sexo: l[6], primeira: l[7], ultima: l[8] }));
    } else { // exportação de clientes do Epoc (colunas deslocadas: cód, nome, reg, cpf, nascimento, cidade, uf, telefone, email, sexo, última visita)
      itens = todas.slice(1).filter(l => /^\d+$/.test((l[0] || "").trim())).map(l => {
        const n = data(l[4]), u = data(l[10]); const tel = so(l[7]);
        return { codigo: l[0].trim(), nome: (l[1] || "").trim(), dia: n?.d ?? "", mes: n?.m ?? "", ano: n && n.a > 1900 ? n.a : "", telefone: tel.length >= 10 && !/^0+$/.test(tel) ? tel : "", sexo: l[9] || "", primeira: "", ultima: u ? `${u.a}-${String(u.m).padStart(2, "0")}-${String(u.d).padStart(2, "0")}` : "" };
      });
    }
    if (!itens.length) throw new Error("Não encontrei clientes.");
    return { itens, resumo: `${nfmt(itens.length)} clientes · ${nfmt(itens.filter(i => i.mes).length)} com aniversário · ${nfmt(itens.filter(i => i.telefone).length)} com telefone` };
  }
  if (tipo === "produtos") {
    const ls = lerCSV(texto, ";").slice(1).filter(l => l.length >= 13 && /^\d+$/.test((l[0] || "").trim()));
    if (!ls.length) throw new Error("Não encontrei produtos com código e grupo.");
    const itens = ls.map(l => ({ codigo: l[0].trim(), nome: l[1].trim(), grupo: l[2].trim() }));
    return { itens, resumo: `${itens.length} produtos em ${new Set(itens.map(i => i.grupo)).size} grupos` };
  }
  if (tipo === "funcionario") {
    const ls = lerCSV(texto, ";").slice(1).filter(l => /^\d+$/.test((l[0] || "").trim()));
    const itens = ls.map(l => ({ funcionario: l[1].trim(), qtd: parseFloat(l[2]), valor: numBR(l[4]) }));
    if (!itens.length) throw new Error("Não encontrei funcionários.");
    return { itens, resumo: `${itens.length} funcionários · total ${brl(itens.reduce((s, i) => s + i.valor, 0))}` };
  }
  if (tipo === "freelas") {
    const sep = (texto.split("\n")[0].match(/;/g) || []).length > (texto.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
    const ls = lerCSV(texto, sep).filter(l => (l[0] || "").trim() && /dia/i.test(l[1] || ""));
    const itens = ls.map(l => ({ nome: l[0].trim(), dias: diasTxt(l[1]), valor: numBR(l[3]), funcao: (l[4] || "").trim() || null }));
    if (!itens.length) throw new Error("Não encontrei freelas (esperado: Nome, X dias, CPF/Pix, Valor, Função).");
    return { itens, resumo: `${itens.length} freelas · ${nfmt(itens.reduce((s, i) => s + i.dias, 0), 1)} diárias · ${brl(itens.reduce((s, i) => s + (i.valor || 0), 0))}` };
  }
  throw new Error("Escolha o tipo de relatório.");
}

async function enviar(tipo, r, nome) {
  if (tipo === "hora") {
    // envia em lotes de datas inteiras (cada lote substitui as suas datas)
    const porData = {}; r.itens.forEach(i => (porData[i.data] ??= []).push(i));
    let lote = [];
    const datas = Object.keys(porData).sort();
    for (let k = 0; k < datas.length; k++) {
      lote = lote.concat(porData[datas[k]]);
      if (lote.length > 2500 || k === datas.length - 1) {
        const { error } = await sb.rpc("importar_vendas_itens", { p_arquivo: nome, p_linhas: lote });
        if (error) throw error; lote = [];
      }
    }
  } else if (tipo === "servicos") {
    const { error } = await sb.rpc("importar_servicos", { p_linhas: r.itens }); if (error) throw error;
  } else if (tipo === "visitas") {
    for (let i = 0; i < r.itens.length; i += 5000) { const { error } = await sb.rpc("importar_visitas", { p_pares: r.itens.slice(i, i + 5000), p_maior: i === 0 ? r.maior : {} }); if (error) throw error; }
  } else if (tipo === "fechamento") {
    const { error } = await sb.rpc("importar_fechamento", { p_linhas: r.itens }); if (error) throw error;
  } else if (tipo === "func_noites") {
    for (let i = 0; i < r.itens.length; i += 2000) { const { error } = await sb.rpc("importar_vendas_func_noites", { p_linhas: r.itens.slice(i, i + 2000) }); if (error) throw error; }
  } else if (tipo === "clientes") {
    for (let i = 0; i < r.itens.length; i += 2000) { const { error } = await sb.rpc("importar_clientes", { p_linhas: r.itens.slice(i, i + 2000) }); if (error) throw error; }
  } else if (tipo === "produtos") {
    const { error } = await sb.rpc("importar_produtos", { p_linhas: r.itens }); if (error) throw error;
  } else if (tipo === "funcionario") {
    const ini = $("#p-ini").value, fim = $("#p-fim").value; if (!ini || !fim) throw new Error("Informe o período do relatório.");
    const { error } = await sb.rpc("importar_vendas_funcionario", { p_arquivo: nome, p_ini: ini, p_fim: fim, p_linhas: r.itens }); if (error) throw error;
  } else if (tipo === "freelas") {
    const sem = $("#p-sem").value; if (!sem) throw new Error("Informe a quarta-feira que inicia a semana.");
    const { error } = await sb.rpc("importar_freelas", { p_arquivo: nome, p_semana: sem, p_linhas: r.itens }); if (error) throw error;
  }
}

// ============ RECEBER DO EPOC (ponte entre abas) ============
// A aba do Epoc (logada) abre esta página e envia os CSVs por postMessage.
// Só aceita mensagens vindas do Epoc e só importa depois do clique em "Importar".
const ORIGENS_EPOC = ["https://cloud.epoc.com.br", "https://api.epoc.com.br"];
function abaReceber() {
  document.querySelectorAll("#abas button").forEach(b => b.classList.remove("ativa"));
  $("#trilha").innerHTML = "Configurações / <b>Importar do Epoc</b>";
  $("#conteudo").innerHTML = `<div class="cab-sec"><div><h2>Importar do Epoc</h2><p>Dados enviados pela aba do Epoc em que você está logada</p></div></div>
    <div class="card"><div id="rec-status" class="sub">Aguardando os dados do Epoc…</div><div id="rec-lista"></div>
    <button class="btn largo hidden" id="rec-ok">Importar tudo</button><div id="rec-msg"></div></div>`;
  let pacotes = [];
  window.addEventListener("message", e => {
    if (!ORIGENS_EPOC.includes(e.origin) || e.data?.tipo !== "vezpa-import") return;
    pacotes = (e.data.arquivos || []).map(a => {
      const tipo = a.tipoRel || detectar(a.texto);
      try { return { ...a, tipo, r: analisar(tipo, a.texto) }; } catch (err) { return { ...a, tipo, erro: err.message }; }
    });
    $("#rec-status").textContent = `${pacotes.length} relatório(s) recebido(s) do Epoc:`;
    $("#rec-lista").innerHTML = pacotes.map(p => `<div class="msg ${p.erro ? "erro" : "ok"}"><b>${esc(TIPOS[p.tipo] || p.nome)}</b><br>${p.erro ? esc(p.erro) : p.r.resumo}</div>`).join("");
    $("#rec-ok").classList.toggle("hidden", !pacotes.some(p => !p.erro));
    e.source?.postMessage({ tipo: "vezpa-recebido", n: pacotes.length }, e.origin);
  });
  $("#rec-ok").onclick = async () => {
    const b = $("#rec-ok"); b.disabled = true; b.textContent = "Importando…";
    try {
      // produtos primeiro (grupos), depois vendas
      for (const p of pacotes.filter(p => !p.erro).sort((a, b) => (a.tipo === "produtos" ? -1 : 0) - (b.tipo === "produtos" ? -1 : 0))) await enviar(p.tipo, p.r, p.nome);
      $("#rec-msg").innerHTML = `<div class="msg ok">Importado ✔ <a href="#geral" onclick="location.hash='geral';location.reload();return false">Ver o painel</a></div>`;
      b.textContent = "Importado ✔"; S.periodo = null;
    } catch (err) { $("#rec-msg").innerHTML = `<div class="msg erro">Erro: ${esc(err.message || err)}</div>`; b.disabled = false; b.textContent = "Tentar de novo"; }
  };
  const quemAbriu = window.opener || (window.parent !== window ? window.parent : null);
  if (quemAbriu) ORIGENS_EPOC.forEach(o => { try { quemAbriu.postMessage({ tipo: "vezpa-pronto" }, o); } catch (_) {} });
}

async function fnUsuarios(body) {
  const { data, error } = await sb.functions.invoke("usuarios", { body });
  if (error) { let m = error.message; try { m = (await error.context.json()).erro || m; } catch (_) {} throw new Error(m); }
  return data;
}
async function abaUsuarios() {
  const lista = await fnUsuarios({ acao: "listar" });
  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Usuários</h2><p>Quem pode entrar no painel e o que cada um vê</p></div></div>
  <div class="grade dois">
    <div class="card"><h3>Convidar pessoa</h3><div class="sub">Ela recebe um e-mail com link para criar a própria senha</div>
      <form id="f-conv"><div class="linha-form"><div><label>Nome</label><input name="nome" required></div><div><label>E-mail</label><input name="email" type="email" required></div></div>
      <label>Acesso</label><select name="papel"><option value="caixa">Equipe — noite atual, contagem, pagamentos e notas</option><option value="gerente">Gerência — tudo, menos usuários</option><option value="dona">Visão geral — tudo</option></select>
      <button class="btn largo">Enviar convite</button><div id="msg-conv"></div></form></div>
    <div class="card"><h3>O que cada acesso vê</h3><table><tbody>
      <tr><td><span class="selo">Visão geral</span></td><td>Tudo: faturamento, análises, pagamentos com Pix, notas, importação e usuários</td></tr>
      <tr><td><span class="selo">Gerência</span></td><td>Tudo, menos gerenciar usuários</td></tr>
      <tr><td><span class="selo">Equipe</span></td><td>Noite atual, contagem, lançar pagamentos da semana (sem ver Pix) e enviar notas</td></tr></tbody></table></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Pessoas com acesso</h3><table><thead><tr><th>Nome</th><th>E-mail</th><th>Acesso</th><th>Último acesso</th><th></th></tr></thead><tbody>
  ${lista.map(u => `<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td><select data-papel="${u.user_id}" style="width:auto;padding:6px" ${u.user_id === S.user.id ? "disabled" : ""}>${["dona", "gerente", "caixa"].map(p => `<option value="${p}" ${p === u.papel ? "selected" : ""}>${NOME_PAPEL[p]}</option>`).join("")}</select></td>
    <td>${u.ultimo ? new Date(u.ultimo).toLocaleString("pt-BR") : "<span class='tag'>convite pendente</span>"}</td>
    <td>${u.user_id === S.user.id ? "" : `<button class="btn perigo peq" data-rem="${u.user_id}" data-nome="${esc(u.nome)}">Remover</button>`}</td></tr>`).join("")}
  </tbody></table></div>`;
  $("#f-conv").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const m = $("#msg-conv");
    try { await fnUsuarios({ acao: "convidar", nome: f.get("nome"), email: f.get("email"), papel: f.get("papel"), redirect: location.origin + location.pathname }); m.className = "msg ok"; m.textContent = "Convite enviado."; setTimeout(() => abrir("usuarios"), 1200); }
    catch (err) { m.className = "msg erro"; m.textContent = err.message; }
  };
  document.querySelectorAll("[data-papel]").forEach(s => s.onchange = async () => {
    const { error } = await sb.from("perfis").update({ papel: s.value }).eq("user_id", s.dataset.papel);
    if (error) alert(error.message);
  });
  document.querySelectorAll("[data-rem]").forEach(b => b.onclick = () => {
    const d = $("#dlg");
    d.innerHTML = `<h3>Remover ${b.dataset.nome}?</h3><p style="color:var(--mute)">A pessoa perde o acesso na hora. Os dados do bar não são apagados.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="c-n">Cancelar</button><button class="btn perigo" id="c-s">Remover</button></div>`;
    d.showModal(); $("#c-n").onclick = () => d.close();
    $("#c-s").onclick = async () => { try { await fnUsuarios({ acao: "remover", user_id: b.dataset.rem }); d.close(); abrir("usuarios"); } catch (err) { d.close(); } };
  });
}

iniciar();
</script>
</body>
</html>
