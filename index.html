<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vezpa Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#141012; --panel:#1e181b; --panel2:#272024; --line:#3a3035; --ink:#f4ede6; --mute:#a99c94;
  --amber:#f2a63b; --amber2:#ffcf7a; --rose:#e8607a; --teal:#4fc3b0; --violet:#9b8cf2; --green:#7cc46a; --red:#e8604f;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Inter",system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:"Inter",system-ui,sans-serif;font-weight:650;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
a{color:var(--amber2)}

/* login */
#tela-login{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 20% 0%,#3b2418 0%,transparent 60%),radial-gradient(900px 500px at 100% 100%,#2c1830 0%,transparent 60%),var(--bg)}
.cartao-login{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:32px}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.marca .logo{width:44px;height:44px;border-radius:12px;background:var(--amber);color:#1a1208;display:grid;place-items:center;font:700 20px "Inter",sans-serif}
.marca h1{font-size:26px}.marca small{display:block;color:var(--mute);font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
.btn{background:var(--amber);color:#1a1208;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--amber2)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sec:hover{border-color:var(--amber)}
.btn.peq{padding:6px 10px;font-size:13px}
.btn.perigo{background:transparent;border:1px solid #6b2b30;color:#ff9aa5}
.btn:disabled{opacity:.5;cursor:wait}
.largo{width:100%;margin-top:20px}
.msg{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--panel2)}
.msg.erro{color:#ffb4b4;border:1px solid #5c2a2a}.msg.ok{color:#bfe8b0;border:1px solid #2f5a2a}
.link-btn{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:0;margin-top:14px;font-size:13px}

/* app: menu lateral agrupado */
#app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
#menu{position:sticky;top:0;height:100vh;overflow-y:auto;background:#100c0e;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
.marca2{display:flex;align-items:center;gap:11px;margin:2px 6px 16px}
.logo-hex{width:34px;height:34px;flex:none}
.marca2 b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.marca2 span{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.painel-dia{margin:0 4px 18px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(160deg,#1c1518,#141012);font-size:12.5px}
.pd-linha{display:flex;justify-content:space-between;align-items:baseline}
.pd-data{color:var(--mute)}
.pd-temp{font-size:20px;font-weight:650;letter-spacing:-.02em}
.pd-noite{margin-top:6px;color:var(--ink)}
.pd-prox{display:flex;justify-content:space-between;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.pd-prox div{text-align:center;color:var(--mute);font-size:11px;line-height:1.35}
.pd-prox b{display:block;color:var(--ink);font-weight:600;font-size:11px}
.pd-atr{margin-top:8px;color:var(--amber2);font-size:12px}
.pd-atr:empty,.pd-prox:empty{display:none}
#abas button .selo-n{margin-left:auto;background:var(--amber);color:#1a1208;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
#abas button .selo-n.alerta{background:var(--red);color:#fff}
#abas button:focus{outline:none}#abas button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.grupo{margin-bottom:16px}
.grupo-tit{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#7d7069;margin:0 10px 6px;font-weight:700}
#abas button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--mute);padding:8px 10px;border-radius:9px;cursor:pointer;font-weight:500;text-align:left;font-size:14px;position:relative}
#abas button svg{width:17px;height:17px;flex:none;opacity:.85}
#abas button:hover{color:var(--ink);background:var(--panel)}
#abas button.ativa{color:var(--ink);background:#2a1f17}
#abas button.ativa:before{content:"";position:absolute;left:-14px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
#abas button.ativa svg{color:var(--amber);opacity:1}
.menu-rodape{margin-top:auto;border-top:1px solid var(--line);padding:14px 6px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.menu-rodape b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-rodape small{display:block;color:var(--mute);font-size:12px}
.quem-av{width:32px;height:32px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--amber2);flex:none}
.selo{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--amber2)}
.barra{position:sticky;top:0;z-index:5;background:rgba(20,16,18,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px;min-height:56px}
.trilha{color:var(--mute);font-size:13px}.trilha b{color:var(--ink);font-weight:600}
#btn-menu{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:9px;width:38px;height:38px;font-size:18px;cursor:pointer}
#veu{display:none}
.area{min-width:0}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  #menu{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:30;transform:translateX(-102%);transition:transform .2s}
  #app.menu-aberto #menu{transform:none}
  #app.menu-aberto #veu{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
  #btn-menu{display:block}
  .barra{padding:10px 14px}
  main{padding:16px 14px 60px!important}
  .cab-sec h2{font-size:23px}
}
main{max-width:1280px;margin:0 auto;padding:26px 28px 60px}
.cab-sec{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cab-sec h2{font-size:24px}.cab-sec p{margin:4px 0 0;color:var(--mute)}
.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filtros input,.filtros select{width:auto;padding:8px 10px}
.grade{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.dois{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
@media(max-width:520px){.dois{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:17px;margin-bottom:4px}
.card .sub{color:var(--mute);font-size:13px;margin-bottom:12px}
.kpi .rot{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.kpi .val{font:650 26px "Inter";letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
body{font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
.kpi .det{color:var(--mute);font-size:12.5px;margin-top:4px}
.kpi.destaque{background:linear-gradient(135deg,#3a2612,#2a1d14);border-color:#5c3f1c}
.kpi.destaque .val{color:var(--amber2)}
.graf{position:relative;height:280px}.graf.alto{height:360px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--panel)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.rolagem{max-height:440px;overflow:auto}
.barra-mini{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:4px}
.barra-mini i{display:block;height:100%;background:var(--amber)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.tag.bom{color:#bfe8b0;border-color:#2f5a2a}.tag.ruim{color:#ffb4b4;border-color:#5c2a2a}.tag.ok{color:var(--amber2);border-color:#5c3f1c}
.vazio{padding:40px;text-align:center;color:var(--mute)}
.aviso{background:#2a2112;border:1px solid #5c4a1c;color:#f5dca0;border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.heat{display:grid;gap:3px;font-size:11px}
.heat .c{border-radius:4px;height:26px;display:grid;place-items:center;color:#1a1208;font-weight:700}
.heat .h{color:var(--mute);display:grid;place-items:center}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--mute);cursor:pointer;transition:.15s}
.drop.sobre,.drop:hover{border-color:var(--amber);color:var(--ink)}
.linha-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;align-items:end}
.ao-vivo{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.ao-vivo:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(124,196,106,.6);animation:pulso 2s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 8px rgba(124,196,106,0)}100%{box-shadow:0 0 0 0 rgba(124,196,106,0)}}
.insights li{margin:0 0 10px}
.insights{padding-left:18px;margin:0}
/* passo a passo */
.passos{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.passos span{font-size:12.5px;padding:5px 10px;border-radius:99px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.passos span.at{background:var(--amber);color:#1a1208;border-color:var(--amber);font-weight:700}
.passos span.ok{color:#bfe8b0;border-color:#2f5a2a}
.escolhas{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.escolha{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;color:var(--ink)}
.escolha:hover,.escolha.sel{border-color:var(--amber);background:#2e2318}
.escolha b{display:block;font-size:17px;margin-bottom:4px}.escolha small{color:var(--mute)}
.escolha .prog{margin-top:10px}
.item-cont{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item-cont .nome{flex:1;min-width:0}.item-cont .nome small{display:block;color:var(--mute);font-size:12px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:22px;cursor:pointer}
.stepper button:active{background:var(--amber);color:#1a1208}
.stepper input{width:76px;text-align:center;font-size:18px;font-weight:700;padding:9px 4px}
.salvo{width:20px;font-size:14px;color:var(--green)}
.salvo.erro{color:var(--red)}
.rodape-passos{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:9px 14px;cursor:pointer}
.chips button.sel{background:var(--amber);color:#1a1208;border-color:var(--amber);font-weight:700}
input.grande{font-size:26px;font-weight:700;padding:14px}
.dif-pos{color:#ff9aa5;font-weight:700}.dif-neg{color:var(--amber2);font-weight:700}
/* pagamentos / cadastros / notas */
.segmentos{display:inline-flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.segmentos button{background:none;border:0;color:var(--mute);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.segmentos button.sel{background:var(--amber);color:#1a1208}
.segmentos small{opacity:.7;font-weight:500;margin-left:2px}
table.pag td{vertical-align:middle}
.sub2{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:2px}
th.c,td.c{text-align:center;padding:6px 3px}
th.fechado,td.fechado{opacity:.45}
input.dia{width:58px;text-align:center;padding:8px 2px;font-weight:700;border-radius:8px;cursor:pointer}
input.dia.on{background:#3a2a14;border-color:#7a5422;color:var(--amber2)}
input.aj{width:76px;text-align:right;padding:6px}
input.aj-obs{width:90px;padding:4px 6px;font-size:12px;margin-top:4px;display:block;margin-left:auto}
input.val-banda{width:110px;text-align:right;font-weight:700;padding:8px}
.pix{display:flex;flex-direction:column;gap:3px;align-items:flex-start;font-size:13px}
.pix small{color:var(--mute);font-size:11.5px}
.status{background:var(--panel2);border:1px solid #5c3f1c;color:var(--amber2);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.status.pago{border-color:#2f5a2a;color:#bfe8b0;background:#1c2a19}
.x{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:6px}.x:hover{color:var(--red);background:var(--panel2)}
.acoes-pag{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.acoes-pag select{max-width:340px}
.dica{font-size:12.5px;color:var(--mute);margin:12px 0 0}
.semana-nav b{min-width:170px;text-align:center}
.cal-btn{position:relative;margin:0;display:inline-grid;place-items:center;width:38px;height:34px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:16px}
.cal-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.servico{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#14231f;border:1px solid #24453d;border-radius:12px;padding:12px 16px;margin-bottom:14px}
.add-banda{display:grid;gap:4px}
.chips button small{opacity:.7;margin-left:4px}
.filtros-at{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.linha-check{display:flex;gap:8px;align-items:center;margin:0;padding:7px 4px;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px;cursor:pointer}
.linha-check input{width:auto}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foto-btn{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:130px;border:2px dashed var(--line);border-radius:14px;cursor:pointer;color:var(--ink);background-size:cover;background-position:center;text-align:center;padding:10px}
.foto-btn span{font-size:30px}.foto-btn small{color:var(--mute);font-size:12px}
.foto-btn.ok{border-style:solid;border-color:var(--green)}
tfoot td{border-top:1px solid var(--line);border-bottom:0}
.quiz h3{font-size:22px;margin:6px 0 12px}
.chip-ins,.chip-add{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.chip-ins b{color:var(--amber2);font-weight:600}.chip-ins:hover{border-color:var(--amber)}
.chip-add{border-style:dashed;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.cal-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:center;padding:4px 0}
.cal-dia{min-height:104px;border:1px solid var(--line);border-radius:10px;padding:7px;background:var(--panel2);cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal-dia.com{background:rgba(242,166,59,var(--t));border-color:#5c3f1c}
.cal-dia.futuro{border-style:dashed;background:transparent}
.cal-dia.hoje{outline:2px solid var(--amber)}
.cal-dia.vazio-d{background:none;border:0;cursor:default}
.cal-dia:hover{border-color:var(--amber)}
.cal-top{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.cal-top small{font-size:10.5px;color:var(--mute);margin-left:2px}
.cal-n{font-weight:700;color:var(--mute)}
.cal-f{font:700 17px "Inter";color:var(--ink)}.cal-f.prog{font-size:11px;color:var(--amber2);font-weight:600}
.cal-b{font-size:11px;line-height:1.25;color:#f4ede6;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dia-nav .btn{white-space:nowrap}
@media(max-width:700px){.cal-dia{min-height:74px;padding:4px}.cal-b{display:none}.cal-f{font-size:13px}.cal-top{font-size:11px}.cal-top small{display:none}}
.sim-nao{display:flex;gap:10px;margin:8px 0 14px}
.sim-nao button{flex:0 1 160px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer}
.sim-nao button.sel{background:var(--amber);color:#1a1208;border-color:var(--amber)}
.ev-linha{grid-template-columns:1fr 1fr 2fr auto!important}
.clima-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.clima{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.clima.chuva{border-color:#3b5d8a;background:#16202d}
.clima .ic{font-size:30px}.clima .prob{font:700 26px "Inter"}.clima .prob small,.clima small{display:block;font-size:12px;color:var(--mute);font-weight:400}
.pedido-txt{white-space:pre-wrap;background:var(--panel2);padding:10px;border-radius:10px;font:13px/1.5 "Inter"}
code{background:var(--panel2);padding:1px 5px;border-radius:5px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="tela-login" class="hidden">
  <div class="cartao-login">
    <div class="marca2" style="margin:0 0 26px"><svg class="logo-hex" style="width:44px;height:44px" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2.5 35.2 11.25v17.5L20 37.5 4.8 28.75v-17.5z" fill="#f2a63b"/><path d="M13 13.5h3.6L20 23.2l3.4-9.7H27l-5.4 14h-3.2z" fill="#1a1208"/></svg><div><b style="font-size:22px">Vezpa</b><span>Gestão · acesso interno</span></div></div>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <button class="btn largo" type="submit">Entrar</button>
      <button class="link-btn" type="button" id="btn-esqueci">Esqueci minha senha</button>
    </form>

    <form id="form-nova-senha" class="hidden">
      <p style="margin:0;color:var(--mute)">Defina a sua senha para acessar o painel.</p>
      <label for="nova1">Nova senha (mín. 8 caracteres)</label>
      <input id="nova1" type="password" autocomplete="new-password" minlength="8" required>
      <label for="nova2">Repita a senha</label>
      <input id="nova2" type="password" autocomplete="new-password" minlength="8" required>
      <button class="btn largo" type="submit">Salvar senha e entrar</button>
    </form>
    <div id="msg-login" class="msg hidden"></div>
  </div>
</section>

async function painelDoDia() {
  const hoje = diaOperacionalHoje();
  { const t = new Date(hoje + "T12:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "short" }).replace(/\./g, "").replace("-feira", ""); $("#pd-data").textContent = t.charAt(0).toUpperCase() + t.slice(1); }

    const horas = j.hourly.time.map((t, k) => ({ t, p: j.hourly.precipitation_probability[k] }))

    const pmax = Math.max(0, ...horas.map(x => x.p || 0)), chuva = horas.filter(x => x.p >= 50);
    const faixa = chuva.length ? ` (${chuva[0].t.slice(11, 13)}h–${String((+chuva[chuva.length - 1].t.slice(11, 13) + 1) % 24).padStart(2, "0")}h)` : "";

    const abre = [3, 4, 5, 6, 0];
    $("#pd-prox").innerHTML = j.daily.time.slice(1).filter(d => abre.includes(dow(d))).slice(0, 4).map(d => { const i = j.daily.time.indexOf(d), pr = j.daily.precipitation_probability_max[i];
      return `<div><b>${DIAS[dow(d)]}</b>${pr >= 60 ? "🌧️" : pr >= 30 ? "🌦️" : j.daily.temperature_2m_max[i] >= 28 ? "☀️" : "⛅"}<br>${pr}%</div>`; }).join("");
  } catch (_) { $("#pd-noite").textContent = "Previsão indisponível no momento"; }
  try {

async function todos(q) { // pagina além do limite de 1000 linhas
  let out = [], de = 0, passo = 1000;
  for (;;) {
    const { data, error } = await q().range(de, de + passo - 1);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < passo) return out;
    de += passo;
  }
}

// clima de dias passados e futuros (Open-Meteo), com cache
const CLIMA = {};
async function climaDias(ini, fim) {
  const hoje = diaOperacionalHoje(), out = {};
  const faltam = []; for (let d = ini; d <= fim; d = addDias(d, 1)) { if (CLIMA[d]) out[d] = CLIMA[d]; else faltam.push(d); }
  if (!faltam.length) return out;
  const a = faltam[0], b = faltam[faltam.length - 1];
  const pedidos = [];
  const corte = addDias(hoje, -6);
  if (a <= corte) pedidos.push(`https://archive-api.open-meteo.com/v1/archive?latitude=${LOCAL.lat}&longitude=${LOCAL.lon}&start_date=${a}&end_date=${addDias(b < corte ? b : corte, 1)}&daily=precipitation_sum,temperature_2m_max,temperature_2m_min&hourly=precipitation&timezone=America%2FSao_Paulo`);
  if (b > corte) pedidos.push(`https://api.open-meteo.com/v1/forecast?latitude=${LOCAL.lat}&longitude=${LOCAL.lon}&past_days=10&forecast_days=16&daily=precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min&hourly=precipitation,precipitation_probability&timezone=America%2FSao_Paulo`);
  for (const u of pedidos) {
    try {
      const j = await (await fetch(u)).json();
      const noite = {}, probN = {}, horasChuva = {};
      j.hourly.time.forEach((t, k) => { const dia = t.slice(0, 10), h = +t.slice(11, 13); if (h > 2 && h < 17) return; const op = h <= 2 ? addDias(dia, -1) : dia;
        noite[op] = (noite[op] || 0) + (j.hourly.precipitation[k] || 0);
        const pr = j.hourly.precipitation_probability?.[k]; if (pr != null) probN[op] = Math.max(probN[op] || 0, pr);
        if ((j.hourly.precipitation[k] || 0) >= .3 || (pr ?? 0) >= 50) (horasChuva[op] ??= []).push(h); });
      j.daily.time.forEach((d, k) => { if (d < ini || d > fim || (CLIMA[d] && u.includes("archive"))) return;
        const hs = (horasChuva[d] || []).sort((x, y) => (x < 6 ? x + 24 : x) - (y < 6 ? y + 24 : y));
        CLIMA[d] = { mm: j.daily.precipitation_sum[k], mmNoite: noite[d] ?? null, prob: d >= hoje ? (probN[d] ?? j.daily.precipitation_probability_max?.[k]) : null,
          tmin: j.daily.temperature_2m_min[k], tmax: j.daily.temperature_2m_max[k], faixa: hs.length ? `${String(hs[0]).padStart(2, "0")}h–${String((hs[hs.length - 1] + 1) % 24).padStart(2, "0")}h` : null, futuro: d >= hoje };
        out[d] = CLIMA[d]; });
    } catch (_) {}
  }
  return out;
}
function iconeClima(c) {
  if (!c) return "";
  const chuva = c.futuro ? (c.prob ?? 0) >= 60 : (c.mmNoite ?? c.mm ?? 0) >= 1;
  const garoa = c.futuro ? (c.prob ?? 0) >= 30 : (c.mmNoite ?? c.mm ?? 0) > .2;
  return chuva ? "🌧️" : garoa ? "🌦️" : (c.tmax ?? 0) >= 28 ? "☀️" : (c.tmax ?? 30) <= 18 ? "🧥" : "⛅";
}
function textoClima(c) {
  if (!c) return "";
  const t = `${nfmt(c.tmin)}°–${nfmt(c.tmax)}°`;
  if (c.futuro) return `${t} · ${c.prob ?? 0}% de chuva${c.faixa ? " (" + c.faixa + ")" : ""}`;
  const mm = c.mmNoite ?? c.mm ?? 0;
  return `${t} · ${mm >= .2 ? "choveu " + nfmt(mm, 1) + " mm à noite" + (c.faixa ? " (" + c.faixa + ")" : "") : "noite sem chuva"}`;
}

// ============ ABA: FATURAMENTO ============
async function abaGeral() {
  const p = await periodoPadrao(); if (!p) return semDados();
  const [dias, horas, prods, { data: infos }] = await Promise.all([
    todos(() => sb.from("vw_resumo_diario").select("*").gte("dia", p.ini).lte("dia", p.fim).order("dia")),
    todos(() => sb.from("vw_vendas_hora").select("*").gte("dia", p.ini).lte("dia", p.fim)),
    todos(() => sb.from("vw_vendas_produto_dia").select("dia,grupo,faturamento").gte("dia", p.ini).lte("dia", p.fim)),
    sb.from("dias").select("*").gte("data", p.ini).lte("data", p.fim),
  ]);
  if (!dias.length) { $("#conteudo").innerHTML = `<div class="cab-sec"><h2>Faturamento</h2>${htmlFiltro(p)}</div><div class="card vazio">Sem vendas nesse período.</div>`; return ligarFiltro(); }
  const info = Object.fromEntries((infos || []).map(i => [i.data, i]));
  const total = dias.reduce((s, d) => s + +d.faturamento, 0);
  const itens = dias.reduce((s, d) => s + +d.itens, 0);
  const melhor = [...dias].sort((a, b) => b.faturamento - a.faturamento)[0];
  const pior = [...dias].sort((a, b) => a.faturamento - b.faturamento)[0];
  // por dia da semana
  const porDow = Array.from({ length: 7 }, () => ({ soma: 0, n: 0 }));
  dias.forEach(d => { const w = dow(d.dia); porDow[w].soma += +d.faturamento; porDow[w].n++; });
  const ordemDow = [3, 4, 5, 6, 0, 1, 2].filter(w => porDow[w].n);
  // categorias
  const porCat = {}; prods.forEach(r => { const c = CATEG(r.grupo); porCat[c] = (porCat[c] || 0) + +r.faturamento; });
  // heatmap
  const horasLista = [...new Set(horas.map(h => h.hora))].sort((a, b) => (a < 6 ? a + 24 : a) - (b < 6 ? b + 24 : b));
  const hm = {}; horas.forEach(h => { const k = dow(h.dia) + "-" + h.hora; hm[k] = (hm[k] || 0) + +h.faturamento; });
  Object.keys(hm).forEach(k => { const w = +k.split("-")[0]; hm[k] /= porDow[w].n; });
  const hmMax = Math.max(...Object.values(hm), 1);
  const corHeat = v => { const t = v / hmMax; return `rgba(242,166,59,${0.08 + t * 0.92})`; };

  // insights automáticos
  const medDow = ordemDow.map(w => ({ w, m: porDow[w].soma / porDow[w].n })).sort((a, b) => b.m - a.m);
  const ins = [];
  if (medDow.length > 1) ins.push(`<b>${DIAS_LONGO[medDow[0].w]}</b> é o dia mais forte (média ${brl0(medDow[0].m)}), ${nfmt(medDow[0].m / medDow[medDow.length - 1].m, 1)}× a <b>${DIAS_LONGO[medDow[medDow.length - 1].w].toLowerCase()}</b> (${brl0(medDow[medDow.length - 1].m)}).`);
  const pico = Object.entries(hm).sort((a, b) => b[1] - a[1])[0];
  if (pico) { const [w, h] = pico[0].split("-"); ins.push(`O pico médio é <b>${DIAS_LONGO[w].toLowerCase()} às ${h}h</b>, com ${brl0(pico[1])} por hora — é aí que a equipe não pode faltar.`); }
  const cerv = (porCat["Cerveja"] || 0) / total; ins.push(`Cerveja responde por <b>${pct(cerv)}</b> do faturamento; comida por <b>${pct((porCat["Comida"] || 0) / total)}</b>.`);
  ins.push(`Melhor dia: <b>${br(melhor.dia)}</b> (${brl0(melhor.faturamento)})${info[melhor.dia]?.jogo ? " — dia de " + esc(info[melhor.dia].jogo) : info[melhor.dia]?.atracao ? " — " + esc(info[melhor.dia].atracao) : ""}. Pior: ${br(pior.dia)} (${brl0(pior.faturamento)}).`);

  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Faturamento</h2><p>${br(p.ini)} a ${br(p.fim)} · ${dias.length} dias com vendas</p></div>${htmlFiltro(p)}</div>
  <div class="grade kpis">
    <div class="card kpi destaque"><div class="rot">Faturamento no período</div><div class="val">${brl0(total)}</div><div class="det">${nfmt(itens)} itens vendidos</div></div>
    <div class="card kpi"><div class="rot">Média por noite aberta</div><div class="val">${brl0(total / dias.length)}</div></div>
    <div class="card kpi"><div class="rot">Valor médio por item</div><div class="val">${brl(total / itens)}</div></div>
    <div class="card kpi"><div class="rot">Melhor noite</div><div class="val">${brl0(melhor.faturamento)}</div><div class="det">${DIAS[dow(melhor.dia)]} ${br(melhor.dia)}</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>O que os números dizem</h3><div class="sub">Gerado automaticamente a partir do período escolhido</div><ul class="insights">${ins.map(i => `<li>${i}</li>`).join("")}</ul></div>
  <div class="card" style="margin-top:14px" id="caixa-fat"></div>
  <div class="card" style="margin-top:14px" id="cal-fat"><div class="vazio">Carregando calendário…</div></div>
  <div class="card" style="margin-top:14px"><h3>Faturamento por noite</h3><div class="sub">Cor da barra = dia da semana</div><div class="graf alto"><canvas id="g-dias"></canvas></div></div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Média por dia da semana</h3><div class="sub">Faturamento médio por noite aberta</div><div class="graf"><canvas id="g-dow"></canvas></div></div>
    <div class="card"><h3>De onde vem o dinheiro</h3><div class="sub">Faturamento por categoria</div><div class="graf"><canvas id="g-cat"></canvas></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Mapa de calor: dia × hora</h3><div class="sub">Faturamento médio por hora em cada dia da semana — use para escalar equipe</div>
    <div style="overflow-x:auto"><div class="heat" style="grid-template-columns:44px repeat(${horasLista.length},minmax(42px,1fr));min-width:${60 + horasLista.length * 46}px">
      <div></div>${horasLista.map(h => `<div class="h">${String(h).padStart(2, "0")}h</div>`).join("")}
      ${ordemDow.map(w => `<div class="h">${DIAS[w]}</div>${horasLista.map(h => { const v = hm[w + "-" + h] || 0; return `<div class="c" style="background:${v ? corHeat(v) : "var(--panel2)"};color:${v / hmMax > .45 ? "#1a1208" : "#f4ede6"}" title="${DIAS[w]} ${h}h: ${brl0(v)}">${v ? nfmt(v / 1000, 1) + "k" : ""}</div>`; }).join("")}`).join("")}
    </div></div></div>`;
  ligarFiltro();
  const coresDow = ["#9b8cf2", "#555", "#555", "#4fc3b0", "#7cc46a", "#e8607a", "#f2a63b"];
  grafico($("#g-dias"), { type: "bar", data: { labels: dias.map(d => DIAS[dow(d.dia)] + " " + br(d.dia).slice(0, 5)), datasets: [{ data: dias.map(d => d.faturamento), backgroundColor: dias.map(d => coresDow[dow(d.dia)]), borderRadius: 5 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { afterLabel: ctx => { const i = info[dias[ctx.dataIndex].dia]; return i ? [i.atracao, i.jogo].filter(Boolean).join(" · ") : ""; } } } }, scales: { y: { ticks: { callback: v => brl0(v) } } } } });
  grafico($("#g-dow"), { type: "bar", data: { labels: ordemDow.map(w => DIAS[w] + ` (${porDow[w].n})`), datasets: [{ data: ordemDow.map(w => porDow[w].soma / porDow[w].n), backgroundColor: ordemDow.map(w => coresDow[w]), borderRadius: 6 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => brl0(v) } } } } });
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  conferenciaCaixa($("#caixa-fat"), p, dias).catch(() => $("#caixa-fat").remove());
  calendarioFaturamento($("#cal-fat"), p.fim.slice(0, 7)).catch(e => $("#cal-fat").innerHTML = `<div class="msg erro">${esc(e.message)}</div>`);
  grafico($("#g-cat"), { type: "bar", data: { labels: cats.map(c => c[0]), datasets: [{ data: cats.map(c => c[1]), backgroundColor: cats.map(c => COR_CAT[c[0]]), borderRadius: 6 }] },
    options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${brl0(ctx.parsed.x)} (${pct(ctx.parsed.x / total)})` } } }, scales: { x: { ticks: { callback: v => brl0(v) } } } } });
}

// ============ CONFERÊNCIA DE CAIXA (bruto × descontos × líquido × recebido) ============
async function conferenciaCaixa(el, p, dias) {

  const bruto = Object.fromEntries(dias.map(d => [d.dia, +d.faturamento]));

    <div class="grade kpis" style="margin-top:10px">
      <div class="card kpi"><div class="rot">Vendido (bruto)</div><div class="val">${brl0(T.b)}</div><div class="det">${fc.length} noites com fechamento</div></div>
      <div class="card kpi destaque"><div class="rot">Descontos + rateios</div><div class="val">${brl0(T.d + T.r)}</div><div class="det">${pct((T.d + T.r) / (T.b || 1))} do bruto · descontos ${brl0(T.d)} · rateios ${brl0(T.r)}</div></div>
      <div class="card kpi"><div class="rot">Líquido (Epoc)</div><div class="val">${brl0(T.l)}</div></div>
      <div class="card kpi"><div class="rot">Recebido nas máquinas</div><div class="val">${T.temPg ? brl0(T.pg) : "—"}</div><div class="det">${T.temPg ? "diferença " + brl0(T.pg - T.l) : "não importado"}</div></div></div>
    ${top.length ? `<p class="dica"><b>Onde mais teve desconto:</b> ${top.map(([n, v]) => `${esc(n)} ${brl0(v)}`).join(" · ")}</p>` : ""}
    <div class="rolagem" style="margin-top:10px;max-height:380px"><table><thead><tr><th>Noite</th><th class="n">Vendido</th><th class="n">Descontos</th><th class="n">Rateio</th><th class="n">Líquido</th><th class="n">% desc.</th>${T.temPg ? `<th class="n">Recebido</th><th class="n">Diferença</th>` : ""}</tr></thead><tbody>
    ${fc.map(r => { const b = bruto[r.data] || 0, dd = +(r.desconto || 0) + +(r.rateio || 0), dif = r.pagamentos != null ? +r.pagamentos - +r.liquido : null;
      return `<tr><td>${DIAS[dow(r.data)]} ${br(r.data)}</td><td class="n">${brl0(b)}</td><td class="n">${brl0(+r.desconto || 0)}</td><td class="n">${brl0(+r.rateio || 0)}</td><td class="n"><b>${brl0(+r.liquido || 0)}</b></td>
        <td class="n"><span class="tag ${dd / (b || 1) > .1 ? "ruim" : dd / (b || 1) > .05 ? "ok" : ""}">${pct(dd / (b || 1))}</span></td>${T.temPg ? `<td class="n">${r.pagamentos != null ? brl0(+r.pagamentos) : "—"}</td><td class="n">${dif != null ? `<span class="${Math.abs(dif) > 50 ? "dif-pos" : ""}">${brl0(dif)}</span>` : "—"}</td>` : ""}</tr>`; }).join("")}
    </tbody></table></div>`;
}

// ============ CALENDÁRIO DE FATURAMENTO (banda + clima + programação) ============
const CAL = {};
async function calendarioFaturamento(el, mesPadrao) {
  CAL.mes ??= mesPadrao;
  const [y, m] = CAL.mes.split("-").map(Number);
  const ini = `${CAL.mes}-01`, fim = iso(new Date(y, m, 0));
  const [dias, { data: pags }, { data: infos }, clima, { data: pessoas }] = await Promise.all([
    todos(() => sb.from("vw_resumo_diario").select("dia,faturamento").gte("dia", ini).lte("dia", fim)),
    sb.from("pagamentos_bandas").select("id,data,atracao,valor,pessoa_id").gte("data", ini).lte("data", fim),
    sb.from("dias").select("data,jogo,atracao").gte("data", ini).lte("data", fim),
    climaDias(ini, fim < addDias(diaOperacionalHoje(), 15) ? fim : addDias(diaOperacionalHoje(), 15)),
    gestor() ? sb.from("pessoas").select("id,nome,valor_padrao,observacao").eq("tipo", "banda").eq("ativo", true).order("nome") : Promise.resolve({ data: [] }),
  ]);
  const fat = Object.fromEntries(dias.map(d => [d.dia, +d.faturamento]));
  const bandas = {}; (pags || []).forEach(p => (bandas[p.data] ??= []).push(p));
  const info = Object.fromEntries((infos || []).map(i => [i.data, i]));
  const maxF = Math.max(...Object.values(fat), 1);
  const total = Object.values(fat).reduce((a, b) => a + b, 0);
  const cache = (pags || []).filter(p => fat[p.data] != null).reduce((a, p) => a + +p.valor, 0);
  const hoje = diaOperacionalHoje();
  const primeiro = (new Date(y, m - 1, 1).getDay() + 6) % 7; // segunda = 0
  const celulas = [];
  for (let i = 0; i < primeiro; i++) celulas.push(`<div class="cal-dia vazio-d"></div>`);
  for (let d = ini; d <= fim; d = addDias(d, 1)) {
    const f = fat[d], bs = bandas[d] || [], c = clima[d], fut = d > hoje;
    const nomes = bs.length ? bs.map(b => b.atracao) : info[d]?.atracao ? [info[d].atracao] : [];
    const t = f ? f / maxF : 0;
    celulas.push(`<div class="cal-dia ${fut ? "futuro" : ""} ${f ? "com" : ""} ${d === hoje ? "hoje" : ""}" data-cal="${d}" style="${f ? `--t:${(0.12 + t * 0.6).toFixed(2)}` : ""}">
      <div class="cal-top"><span class="cal-n">${+d.slice(8)}</span><span title="${esc(textoClima(c))}">${iconeClima(c)}${c ? `<small>${c.futuro ? (c.prob ?? 0) + "%" : nfmt(c.tmax) + "°"}</small>` : ""}</span></div>
      ${f ? `<div class="cal-f">${f >= 1000 ? nfmt(f / 1000, 1) + "k" : nfmt(f)}</div>` : fut && nomes.length ? `<div class="cal-f prog">programado</div>` : ""}
      ${nomes.length ? `<div class="cal-b">🎵 ${nomes.map(esc).join(" + ")}</div>` : ""}${info[d]?.jogo ? `<div class="cal-b">⚽ ${esc(info[d].jogo)}</div>` : ""}</div>`);
  }
  el.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap"><div><h3>Calendário do mês</h3>
      <div class="sub">Faturamento, atração e clima de cada noite · ${brl0(total)} no mês${cache ? ` · cachês ${brl0(cache)} (${pct(cache / total)})` : ""}${gestor() ? " · toque num dia futuro para lançar a programação" : ""}</div></div>
    <div class="filtros"><button class="btn sec peq" id="cal-ant">‹</button><b style="min-width:130px;text-align:center">${["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][m - 1]} ${y}</b><button class="btn sec peq" id="cal-prox">›</button></div></div>
    <div class="cal">${["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"].map(d => `<div class="cal-h">${d}</div>`).join("")}${celulas.join("")}</div>
    <p class="dica">🌧️ choveu à noite · 🌦️ garoa · ☀️ calor · 🧥 frio · nos dias futuros, % = chance de chuva à noite (previsão de até 16 dias).</p>`;
  const mover = k => { const dt2 = new Date(y, m - 1 + k, 1); CAL.mes = `${dt2.getFullYear()}-${String(dt2.getMonth() + 1).padStart(2, "0")}`; calendarioFaturamento(el); };
  $("#cal-ant").onclick = () => mover(-1); $("#cal-prox").onclick = () => mover(1);
  el.querySelectorAll("[data-cal]").forEach(c => c.onclick = () => {
    const d = c.dataset.cal;
    if (fat[d] != null && d <= hoje) { H.dia = d; abrir("hoje"); return; }
    if (!gestor()) return;
    const ja = bandas[d] || [];
    const dlg = $("#dlg");
    dlg.innerHTML = `<h3>Programação · ${DIAS_LONGO[dow(d)]} ${br(d)}</h3>
      ${clima[d] ? `<p class="dica" style="margin-top:0">${iconeClima(clima[d])} ${esc(textoClima(clima[d]))}</p>` : ""}
      ${ja.length ? `<table style="margin-bottom:10px"><tbody>${ja.map(b => `<tr><td>${esc(b.atracao)}</td><td class="n">${brl0(+b.valor)}</td><td><button class="x" data-rm="${b.id}">×</button></td></tr>`).join("")}</tbody></table>` : `<p style="color:var(--mute)">Nenhuma atração lançada.</p>`}
      <label>Toque na banda para programar (cachê e Pix vêm do cadastro)</label><div class="chips">${(pessoas || []).map(p => `<button data-pb="${p.id}">${esc(p.nome)}${p.valor_padrao ? ` <small>${brl0(+p.valor_padrao)}</small>` : ""}</button>`).join("") || `<span class="dica">Cadastre as bandas em Configurações → Freelas e bandas.</span>`}</div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" id="pb-ok">Pronto</button></div>`;
    dlg.showModal();
    const reabrir = () => { dlg.close(); calendarioFaturamento(el); };
    $("#pb-ok").onclick = reabrir;
    dlg.querySelectorAll("[data-pb]").forEach(b => b.onclick = async () => { const p = pessoas.find(x => x.id == b.dataset.pb);
      await sb.from("pagamentos_bandas").insert({ data: d, atracao: p.nome, pessoa_id: p.id, valor: +(p.valor_padrao || 0), status: "a pagar", observacao: p.observacao || null }); reabrir(); });
    dlg.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { await sb.from("pagamentos_bandas").delete().eq("id", b.dataset.rm); reabrir(); });
  });
}

// ============ ABA: PRODUTOS ============
async function abaProdutos() {
  const p = await periodoPadrao(); if (!p) return semDados();
  const rows = await todos(() => sb.from("vw_vendas_produto_dia").select("*").gte("dia", p.ini).lte("dia", p.fim));
  const nDias = new Set(rows.map(r => r.dia)).size;
  const ag = {};
  rows.forEach(r => {
    const k = r.produto; ag[k] ??= { produto: k, grupo: r.grupo, qtd: 0, fat: 0, dias: new Set(), fds: 0, sem: 0 };
    ag[k].qtd += +r.qtd; ag[k].fat += +r.faturamento; ag[k].dias.add(r.dia);
    const w = dow(r.dia); if (w === 5 || w === 6) ag[k].fds += +r.faturamento; else ag[k].sem += +r.faturamento;
  });
  const lista = Object.values(ag).sort((a, b) => b.fat - a.fat);
  const total = lista.reduce((s, x) => s + x.fat, 0);
  let acum = 0; lista.forEach(x => { acum += x.fat; x.abc = acum / total <= .8 ? "A" : acum / total <= .95 ? "B" : "C"; });
  const mortos = lista.filter(x => x.qtd < 10 && x.fat > 0);
  const gratis = lista.filter(x => x.fat === 0 && x.qtd > 0);
  const grupos = {}; lista.forEach(x => { grupos[x.grupo] = (grupos[x.grupo] || 0) + x.fat; });
  const gl = Object.entries(grupos).sort((a, b) => b[1] - a[1]);
  const nA = lista.filter(x => x.abc === "A").length;
  // produtos de dia fraco: maior peso relativo qua/qui/dom
  const fracos = lista.filter(x => x.fat > total * 0.003).map(x => ({ ...x, peso: x.sem / (x.fat || 1) })).sort((a, b) => b.peso - a.peso).slice(0, 8);

  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Produtos</h2><p>${br(p.ini)} a ${br(p.fim)} · ${lista.length} produtos vendidos em ${nDias} noites</p></div>${htmlFiltro(p)}</div>
  <div class="grade kpis">
    <div class="card kpi destaque"><div class="rot">Curva A</div><div class="val">${nA} produtos</div><div class="det">fazem 80% do faturamento</div></div>
    <div class="card kpi"><div class="rot">Quase parados</div><div class="val">${mortos.length}</div><div class="det">venderam menos de 10 un. e somam ${brl0(mortos.reduce((s, x) => s + x.fat, 0))}</div></div>
    <div class="card kpi"><div class="rot">Saíram a R$ 0</div><div class="val">${nfmt(gratis.reduce((s, x) => s + x.qtd, 0))} un.</div><div class="det">${gratis.length} itens (cortesias, welcome drink…)</div></div>
    <div class="card kpi"><div class="rot">Grupo líder</div><div class="val" style="font-size:22px">${esc(gl[0]?.[0])}</div><div class="det">${pct(gl[0]?.[1] / total)} do faturamento</div></div>
  </div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Faturamento por grupo do cardápio</h3><div class="sub">Grupos cadastrados no Epoc</div><div class="graf alto"><canvas id="g-grupos"></canvas></div></div>
    <div class="card"><h3>Bons para promover nos dias fracos</h3><div class="sub">Produtos relevantes que já vendem proporcionalmente mais de qua, qui e dom</div>
      <table><thead><tr><th>Produto</th><th class="n">% fora de sex/sáb</th><th class="n">Faturamento</th></tr></thead><tbody>${fracos.map(x => `<tr><td>${esc(x.produto)}</td><td class="n">${pct(x.peso)}</td><td class="n">${brl0(x.fat)}</td></tr>`).join("")}</tbody></table></div>
  </div>
  <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
    <div><h3>Ranking completo</h3><div class="sub">A = 80% do faturamento, B = próximos 15%, C = últimos 5%</div></div>
    <input id="busca" placeholder="Buscar produto…" style="width:220px"></div>
    <div class="rolagem"><table id="tab-prod"><thead><tr><th>#</th><th>Produto</th><th>Grupo</th><th class="n">Unid.</th><th class="n">Faturamento</th><th class="n">% total</th><th class="n">Noites</th><th>Curva</th></tr></thead>
    <tbody>${lista.map((x, i) => `<tr data-n="${esc(x.produto.toLowerCase())}"><td>${i + 1}</td><td>${esc(x.produto)}</td><td><span class="tag">${esc(x.grupo)}</span></td><td class="n">${nfmt(x.qtd)}</td><td class="n">${brl(x.fat)}</td><td class="n">${pct(x.fat / total)}</td><td class="n">${x.dias.size}</td><td><span class="tag ${x.abc === "A" ? "bom" : x.abc === "C" ? "ruim" : "ok"}">${x.abc}</span></td></tr>`).join("")}</tbody></table></div></div>
  <div class="card" style="margin-top:14px"><h3>Candidatos a sair do cardápio</h3><div class="sub">Menos de 10 unidades no período</div>
    <div class="rolagem" style="max-height:300px"><table><thead><tr><th>Produto</th><th>Grupo</th><th class="n">Unid.</th><th class="n">Faturamento</th></tr></thead><tbody>${mortos.map(x => `<tr><td>${esc(x.produto)}</td><td>${esc(x.grupo)}</td><td class="n">${nfmt(x.qtd)}</td><td class="n">${brl(x.fat)}</td></tr>`).join("")}</tbody></table></div></div>`;
  ligarFiltro();
  $("#busca").oninput = e => { const t = e.target.value.toLowerCase(); document.querySelectorAll("#tab-prod tbody tr").forEach(tr => tr.style.display = tr.dataset.n.includes(t) ? "" : "none"); };
  grafico($("#g-grupos"), { type: "bar", data: { labels: gl.map(g => g[0]), datasets: [{ data: gl.map(g => g[1]), backgroundColor: gl.map(g => COR_CAT[CATEG(g[0])]), borderRadius: 5 }] },
    options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => `${brl0(ctx.parsed.x)} (${pct(ctx.parsed.x / total)})` } } }, scales: { x: { ticks: { callback: v => brl0(v) } } } } });
}

// ============ ABA: EQUIPE ============
async function abaEquipe() {
  const p = await periodoPadrao(); if (!p) return semDados();
  let [{ data: fr }, { data: vf }, dias] = await Promise.all([
    sb.from("freelas").select("*").gte("semana_inicio", addDias(p.ini, -6)).lte("semana_inicio", p.fim).order("semana_inicio"),
    sb.from("vendas_funcionario").select("*").lte("periodo_inicio", p.fim).gte("periodo_fim", p.ini).order("valor", { ascending: false }),
    todos(() => sb.from("vw_resumo_diario").select("dia,faturamento").gte("dia", addDias(p.ini, -6)).lte("dia", addDias(p.fim, 6))),
  ]);
  const semanas = {};
  (fr || []).forEach(f => { const s = semanas[f.semana_inicio] ??= { ini: f.semana_inicio, pessoas: 0, diarias: 0, custo: 0, temCusto: false, lista: [] }; s.pessoas++; s.diarias += +f.dias || 0; if (f.valor != null) { s.custo += +f.valor; s.temCusto = true; } s.lista.push(f); });
  const sl = Object.values(semanas).sort((a, b) => a.ini.localeCompare(b.ini));
  sl.forEach(s => { const fim = addDias(s.ini, 6); s.fat = dias.filter(d => d.dia >= s.ini && d.dia <= fim).reduce((t, d) => t + +d.faturamento, 0); s.noites = dias.filter(d => d.dia >= s.ini && d.dia <= fim).length; });
  // totais do período (semanas que começam dentro do período ou o cruzam)
  const tot = sl.reduce((a, s) => ({ fat: a.fat + s.fat, diarias: a.diarias + s.diarias, noites: a.noites + s.noites, custo: a.custo + (s.temCusto ? s.custo : 0), fatComCusto: a.fatComCusto + (s.temCusto ? s.fat : 0), diariasComCusto: a.diariasComCusto + (s.temCusto ? s.diarias : 0) }), { fat: 0, diarias: 0, noites: 0, custo: 0, fatComCusto: 0, diariasComCusto: 0 });
  const pessoasPeriodo = new Set((fr || []).map(f => (f.pessoa_id || f.nome.toLowerCase()))).size;
  // vendas por funcionário: soma os relatórios que cruzam o período
  vf = (vf || []).filter(x => x.periodo_inicio !== x.periodo_fim || (x.periodo_inicio >= p.ini && x.periodo_inicio <= p.fim));
  const vfAg = {}; (vf || []).forEach(x => { const k = x.funcionario.toLowerCase(); const a = vfAg[k] ??= { funcionario: x.funcionario, qtd: 0, valor: 0, ini: x.periodo_inicio, fim: x.periodo_fim, noites: new Set() };
    a.qtd += +x.qtd; a.valor += +x.valor; if (x.periodo_inicio === x.periodo_fim) a.noites.add(x.periodo_inicio); if (x.periodo_inicio < a.ini) a.ini = x.periodo_inicio; if (x.periodo_fim > a.fim) a.fim = x.periodo_fim; });
  vf = Object.values(vfAg).sort((a, b) => b.valor - a.valor);
  const totVF = (vf || []).reduce((s, x) => s + +x.valor, 0);
  const custoMedioDiaria = sl.filter(s => s.temCusto).reduce((a, s) => a + s.custo, 0) / Math.max(1, sl.filter(s => s.temCusto).reduce((a, s) => a + s.diarias, 0));

  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Equipe</h2><p>Freelas por semana e vendas por funcionário · ${br(p.ini)} a ${br(p.fim)}</p></div>${htmlFiltro(p)}</div>
  <div class="grade kpis">
    <div class="card kpi destaque"><div class="rot">Faturamento por diária de freela</div><div class="val">${tot.diarias ? brl0(tot.fat / tot.diarias) : "—"}</div><div class="det">no período · quanto mais alto, mais enxuta a escala</div></div>
    <div class="card kpi"><div class="rot">Diárias no período</div><div class="val">${nfmt(tot.diarias, 1)}</div><div class="det">${pessoasPeriodo} pessoas · ${sl.length} ${sl.length === 1 ? "semana" : "semanas"} · ${tot.noites} noites</div></div>
    <div class="card kpi"><div class="rot">Custo de freelas no período</div><div class="val">${tot.custo ? brl0(tot.custo) : "—"}</div><div class="det">${tot.custo ? pct(tot.custo / tot.fatComCusto) + " do faturamento" + (tot.fatComCusto < tot.fat ? " (semanas com valor lançado)" : "") : "sem valores lançados no período"}</div></div>
    <div class="card kpi"><div class="rot">Custo médio da diária</div><div class="val">${tot.diariasComCusto ? brl0(tot.custo / tot.diariasComCusto) : "—"}</div></div>
  </div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Faturamento × diárias de freela por semana</h3><div class="sub">Barras: faturamento · linha: diárias</div><div class="graf"><canvas id="g-sem"></canvas></div></div>
    <div class="card"><h3>Vendas por funcionário</h3><div class="sub">${vf?.length ? "Relatórios de " + br(vf.reduce((m, x) => x.ini < m ? x.ini : m, vf[0].ini)) + " a " + br(vf.reduce((m, x) => x.fim > m ? x.fim : m, vf[0].fim)) : "Nenhum relatório de vendas por funcionário neste período"}</div>
      <div class="rolagem"><table><thead><tr><th>Funcionário</th><th class="n">Noites</th><th class="n">Itens</th><th class="n">Média/item</th><th class="n">Média/noite</th><th class="n">Total</th></tr></thead><tbody>${(vf || []).map(x => `<tr><td>${esc(x.funcionario)}<div class="barra-mini"><i style="width:${x.valor / (vf[0].valor || 1) * 100}%"></i></div></td><td class="n">${x.noites.size || "—"}</td><td class="n">${nfmt(x.qtd)}</td><td class="n">${brl(x.valor / x.qtd)}</td><td class="n">${x.noites.size ? brl0(x.valor / x.noites.size) : "—"}</td><td class="n">${brl0(x.valor)}</td></tr>`).join("")}</tbody></table></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Escala por semana</h3><div class="sub">Semanas começam na quarta</div>
    <div class="rolagem"><table><thead><tr><th>Semana</th><th class="n">Pessoas</th><th class="n">Diárias</th><th class="n">Custo</th><th class="n">Faturamento</th><th class="n">Fat./diária</th><th>Quem</th></tr></thead><tbody>
    ${sl.map(s => `<tr><td>${br(s.ini)}</td><td class="n">${s.pessoas}</td><td class="n">${nfmt(s.diarias, 1)}</td><td class="n">${s.temCusto ? brl0(s.custo) : "—"}</td><td class="n">${brl0(s.fat)}</td><td class="n">${s.diarias ? brl0(s.fat / s.diarias) : "—"}</td><td style="font-size:12.5px;color:var(--mute)">${s.lista.map(f => esc(f.nome) + (f.funcao ? " (" + esc(f.funcao) + ")" : "")).join(", ")}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  ligarFiltro();
  grafico($("#g-sem"), { type: "bar", data: { labels: sl.map(s => br(s.ini).slice(0, 5)), datasets: [
    { label: "Faturamento", data: sl.map(s => s.fat), backgroundColor: "#f2a63b", borderRadius: 6, yAxisID: "y" },
    { label: "Diárias", type: "line", data: sl.map(s => s.diarias), borderColor: "#4fc3b0", backgroundColor: "#4fc3b0", yAxisID: "y2", _fmt: "n", tension: .3 }] },
    options: { maintainAspectRatio: false, scales: { y: { ticks: { callback: v => brl0(v) } }, y2: { position: "right", grid: { display: false } } } } });
}

// ============ ABA: CRUZAMENTOS ============
async function abaCruzamentos() {
  const p = await periodoPadrao(); if (!p) return semDados();
  const [dias, { data: infos }, prods, { data: pags }] = await Promise.all([
    todos(() => sb.from("vw_resumo_diario").select("*").gte("dia", p.ini).lte("dia", p.fim).order("dia")),
    sb.from("dias").select("*").gte("data", p.ini).lte("data", p.fim),
    todos(() => sb.from("vw_vendas_produto_dia").select("dia,grupo,faturamento").gte("dia", p.ini).lte("dia", p.fim)),
    sb.from("pagamentos_bandas").select("data,atracao,valor").gte("data", p.ini).lte("data", p.fim),
  ]);
  const info = Object.fromEntries((infos || []).map(i => [i.data, { ...i }]));
  (pags || []).forEach(pg => {
    const i = info[pg.data] ??= { data: pg.data };
    i.cache_valor = (+i.cache_valor || 0) + +pg.valor;
    if (!i.atracao) i.atracao = pg.atracao;

// ============ PESSOAS (freelas e bandas) ============
const PIX_TIPOS = { cpf: "CPF", celular: "Celular", email: "E-mail", cnpj: "CNPJ", aleatoria: "Chave aleatória" };
function detectarPix(v) {
  if (v == null) return null;
  let s = typeof v === "number" ? String(Math.round(v)) : String(v).trim();
  if (!s || /^(pg|dh|-)$/i.test(s)) return null;
  if (/@/.test(s)) return { tipo: "email", chave: s.toLowerCase() };
  const d = s.replace(/\D/g, "");
  if (/^\(?\d{2}\)?\s?9/.test(s) && d.length === 11 && !/^\d{11}$/.test(s)) return { tipo: "celular", chave: d };
  if (d.length === 14) return { tipo: "cnpj", chave: d };
  if (/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(s)) return { tipo: "cpf", chave: d };
  const DDD = /^(1[1-9]|2[124]|2[78]|3[1-5]|3[78]|4[1-9]|5[135]|5[45]|6[1-9]|7[13-5]|7[79]|8[1-9]|9[1-9])9/;
  if (d.length === 13 && d.startsWith("55") && DDD.test(d.slice(2))) return { tipo: "celular", chave: d.slice(2) };
  if (d.length === 11) return { tipo: DDD.test(d) ? "celular" : "cpf", chave: d };
  if (d.length === 10 && typeof v === "number") return { tipo: "cpf", chave: d.padStart(11, "0") };
  if (d.length >= 8) return { tipo: "aleatoria", chave: s };
  return null;
}
function fmtPix(p) {
  if (!p?.pix_chave) return "";
  const c = p.pix_chave;
  if (p.pix_tipo === "cpf" && c.length === 11) return `${c.slice(0, 3)}.${c.slice(3, 6)}.${c.slice(6, 9)}-${c.slice(9)}`;
  if (p.pix_tipo === "celular" && c.length === 11) return `(${c.slice(0, 2)}) ${c.slice(2, 7)}-${c.slice(7)}`;
  return c;
}
async function copiar(txt, btn) {
  try { await navigator.clipboard.writeText(txt); if (btn) { const t = btn.textContent; btn.textContent = "Copiado ✔"; setTimeout(() => btn.textContent = t, 1400); } }
  catch (_) { if (btn) btn.textContent = "Selecione e copie"; }
}

      <div><label>${ehBanda ? "Cachê padrão" : "Diária padrão"} (R$)</label><input name="valor_padrao" inputmode="decimal" value="${p.valor_padrao != null ? nfmt(+p.valor_padrao, 2) : ""}"></div></div>

const fatSemanaCalc = res => res.reduce((s, r) => s + +r.faturamento, 0);

    todos(() => sb.from("vw_resumo_diario").select("dia,faturamento").gte("dia", ini).lte("dia", fim)),
    todos(() => sb.from("vw_resumo_diario").select("dia").gte("dia", addDias(ini, -56)).lt("dia", ini)),
    gestor() ? sb.from("config").select("valor").eq("chave", "servico").maybeSingle() : Promise.resolve({ data: null }),
  ]);
  const EQ = !gestor();
  if (EQ && W.sub === "pagar") W.sub = "freelas";
  const SV = { percentual: 10, casa: 20, incluir: !EQ, fixas: 0, ...(cfgServ?.valor || {}), ...(EQ ? { incluir: false } : {}) };
  const P = Object.fromEntries(pessoas.map(p => [p.id, p]));
  const pesDe = (id, nome, tipo) => P[id] || pessoas.find(p => p.tipo === tipo && p.nome.toLowerCase() === (nome || "").toLowerCase());
  const abreDow = new Set(hist.map(h => dow(h.dia)));

  fr.forEach(l => { l._total = totFr(l); });
  const nDiarias = fr.reduce((s, l) => s + Object.keys(l.dias_valores || {}).length, 0);

  const cotas = nDiarias + (+SV.fixas || 0);

async function carregarXLSX() {
  if (window.XLSX) return;
  await new Promise((ok, erro) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = ok; s.onerror = erro; document.head.appendChild(s); });
}
function lerPlanilhaPagamentos(wb) {
  const freelas = {}, bandas = {};
  for (const nomeAba of wb.SheetNames) {
    const linhas = XLSX.utils.sheet_to_json(wb.Sheets[nomeAba], { header: 1, raw: true, defval: null });
    let musicos = false;
    for (const r of linhas) {
      const nome = typeof r[0] === "string" ? r[0].trim() : null;
      if (!nome) continue;
      if (/^m[uú]sicos/i.test(nome)) { musicos = true; continue; }
      const cels = r.slice(1, 5);
      if (!musicos) {
        const iDias = cels.findIndex(c => typeof c === "string" && /\bdi[as]|dia/i.test(c));
        if (iDias < 0) continue;
        const nDias = diasTxt(cels[iDias]) || 1;
        let pix = null, valor = null, funcao = null;
        cels.forEach((c, i) => {
          if (i === iDias || c == null) return;
          const dp = (typeof c === "number" && c >= 1e9) || (typeof c === "string" && (/@|\d{3}\.\d{3}\.\d{3}-\d{2}|\(\d{2}\)/.test(c))) ? detectarPix(c) : null;
          if (dp) pix = dp;
          else if (typeof c === "number" && c > 0 && c < 100000) valor = c;
          else if (typeof c === "string" && /[a-zà-ú]{3,}/i.test(c) && !/@/.test(c)) funcao = c.trim();
        });
        const k = nome.toLowerCase();
        const atual = freelas[k] ||= { nome, funcao: null, pix: null, diaria: null };
        if (funcao) atual.funcao = funcao.charAt(0).toUpperCase() + funcao.slice(1).toLowerCase();
        if (pix) atual.pix = pix;
        if (valor && nDias) { const d = valor / nDias; if (d >= 50 && d <= 400) atual.diaria = Math.round(d / 5) * 5; }
      } else {
        let valor = null, dp = null, obs = null;
        r.slice(1, 6).forEach(c => {
          if (c == null || c === "") return;
          const pixAqui = (typeof c === "number" && c >= 1e9) || (typeof c === "string" && /@|\d{3}\.\d{3}\.\d{3}-\d{2}|\d{2}\s?9\d{4}-?\d{4}|^\(?\d{2}\)?[\s.-]*9/.test(c.trim())) ? detectarPix(c) : null;
          if (pixAqui && !dp) dp = pixAqui;
          else if (typeof c === "number" && c > 0 && c < 100000 && valor == null) valor = c;
          else if (typeof c === "string" && !pixAqui && !/^(segunda|terça|terca|quarta|quinta|sexta|s[aá]bado|domingo)\s*$/i.test(c.trim())) obs = c.trim();
        });
        const k = nome.toLowerCase().replace(/\s+/g, " ");
        const atual = bandas[k] ||= { nome: nome.replace(/\s+/g, " "), pix: null, cache: null, obs: null };
        if (dp) atual.pix = dp; if (valor) atual.cache = valor; if (obs) atual.obs = obs;
      }
    }
  }
  return { freelas: Object.values(freelas), bandas: Object.values(bandas) };
}
function importarPlanilhaAntiga() {
  const d = $("#dlg");
  d.innerHTML = `<h3>Importar da planilha de pagamentos</h3><p style="color:var(--mute);font-size:14px">Escolha o Excel de pagamentos (com as abas de cada semana). O painel puxa nomes, funções, diárias, cachês e Pix de freelas e músicos. Nada é apagado: quem já existe é atualizado.</p>
    <input type="file" id="xls" accept=".xlsx,.xls"><div id="xls-prev"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn sec" id="xls-fechar">Fechar</button><button class="btn hidden" id="xls-ok">Importar</button></div>`;
  d.showModal();
  $("#xls-fechar").onclick = () => d.close();
  let dados = null;
  $("#xls").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    $("#xls-prev").innerHTML = `<div class="msg">Lendo…</div>`;
    try {
      await carregarXLSX();
      dados = lerPlanilhaPagamentos(XLSX.read(await f.arrayBuffer(), { type: "array" }));
      const sp = a => a.filter(x => !x.pix).length;
      $("#xls-prev").innerHTML = `<div class="msg ok"><b>${dados.freelas.length} freelas</b> (${sp(dados.freelas)} sem Pix) e <b>${dados.bandas.length} bandas/DJs</b> (${sp(dados.bandas)} sem Pix) encontrados.</div>
        <div class="rolagem" style="max-height:220px;margin-top:8px"><table><tbody>${[...dados.freelas.map(x => ["Freela", x.nome, x.funcao, x.diaria, x.pix]), ...dados.bandas.map(x => ["Banda", x.nome, x.obs, x.cache, x.pix])]
          .map(([t, n, f, v, p]) => `<tr><td><span class="tag">${t}</span></td><td>${esc(n)}</td><td style="color:var(--mute)">${esc(f || "")}</td><td class="n">${v ? brl0(v) : ""}</td><td>${p ? esc(PIX_TIPOS[p.tipo]) : "<span class='tag ruim'>sem Pix</span>"}</td></tr>`).join("")}</tbody></table></div>
        <p class="dica">Confira os Pix depois em Freelas e bandas: números de 11 dígitos podem ser CPF ou celular, e o painel tenta adivinhar.</p>`;
      $("#xls-ok").classList.remove("hidden");
    } catch (err) { $("#xls-prev").innerHTML = `<div class="msg erro">Não consegui ler: ${esc(err.message || err)}</div>`; }
  };
  $("#xls-ok").onclick = async () => {
    const b = $("#xls-ok"); b.disabled = true; b.textContent = "Importando…";
    const { data: existentes } = await sb.from("pessoas").select("id,tipo,nome,pix_chave,funcao,valor_padrao");
    const idx = Object.fromEntries(existentes.map(p => [p.tipo + "|" + p.nome.toLowerCase(), p]));
    const regs = [...dados.freelas.map(x => ({ tipo: "freela", nome: x.nome, funcao: x.funcao, valor_padrao: x.diaria, pix: x.pix })),
                  ...dados.bandas.map(x => ({ tipo: "banda", nome: x.nome, valor_padrao: x.cache, pix: x.pix, observacao: x.obs }))];
    let novos = 0, atual = 0;
    for (const r of regs) {
      const ex = idx[r.tipo + "|" + r.nome.toLowerCase()];
      const campos = { funcao: r.funcao || ex?.funcao || null, valor_padrao: r.valor_padrao ?? ex?.valor_padrao ?? null };
      if (r.pix) Object.assign(campos, { pix_tipo: r.pix.tipo, pix_chave: r.pix.chave });
      if (r.observacao) campos.observacao = r.observacao;
      if (ex) { await sb.from("pessoas").update(campos).eq("id", ex.id); atual++; }
      else { await sb.from("pessoas").insert({ tipo: r.tipo, nome: r.nome, ...campos }); novos++; }
    }
    d.close(); abaCadastros();
  };
}

// ============ ABA: ATRAÇÕES (cachê × faturamento × entrada) ============
const AT = { modo: "noite", dows: [3, 4, 5, 6, 0] };
const ENTRADA_PADRAO = ["1049", "1138", "1107", "1098", "1066"];
async function abaAtracoes() {
  const p = await periodoPadrao();
  AT.ini ??= p ? p.ini : diaOperacionalHoje().slice(0, 8) + "01";
  AT.fim ??= p ? p.fim : diaOperacionalHoje();
  const [{ data: pags }, dias, { data: cfg }, { data: prods }] = await Promise.all([
    sb.from("pagamentos_bandas").select("*").order("data"),
    todos(() => sb.from("vw_resumo_diario").select("dia,faturamento")),
    sb.from("config").select("valor").eq("chave", "entrada").maybeSingle(),
    sb.from("produtos").select("codigo,nome,grupo").order("nome"),
  ]);
  const codEntrada = cfg?.valor?.codigos || ENTRADA_PADRAO;
  const ent = codEntrada.length ? await todos(() => sb.from("vw_vendas_codigo_dia").select("*").in("codigo", codEntrada)) : [];
  // vendas de entrada com valor (para R$) vêm de vendas_itens agregadas por dia
  const entValor = codEntrada.length ? await todos(() => sb.from("vw_vendas_produto_dia").select("dia,produto,qtd,faturamento").in("produto", (prods || []).filter(x => codEntrada.includes(x.codigo)).map(x => x.nome))) : [];
  const entDia = {}; entValor.forEach(r => { const e = entDia[r.dia] ??= { q: 0, v: 0 }; e.q += +r.qtd; e.v += +r.faturamento; });
  if (!entValor.length) ent.forEach(r => { const e = entDia[r.dia] ??= { q: 0, v: 0 }; e.q += +r.qtd; });
  const fat = Object.fromEntries(dias.map(d => [d.dia, +d.faturamento]));
  const porDow = {}; dias.forEach(d => (porDow[dow(d.dia)] ??= []).push(+d.faturamento));
  const mediaDow = w => porDow[w] ? porDow[w].reduce((a, b) => a + b, 0) / porDow[w].length : null;
  const cachePorDia = {}, atrPorDia = {};
  pags.forEach(x => { cachePorDia[x.data] = (cachePorDia[x.data] || 0) + +x.valor; (atrPorDia[x.data] ??= []).push(x.atracao); });

  // noites do período (com venda ou com cachê), filtradas por dia da semana
  const todasNoites = [...new Set([...Object.keys(fat), ...Object.keys(cachePorDia)])].filter(d => d >= AT.ini && d <= AT.fim).sort();
  const noites = todasNoites.filter(d => AT.dows.includes(dow(d))).map(d => {
    const c = cachePorDia[d] || 0, f = fat[d] || 0, e = entDia[d] || { q: 0, v: 0 }, m = mediaDow(dow(d));
    return { d, atr: atrPorDia[d] || [], cache: c, fat: f, entQ: e.q, entV: e.v, res: f - c, desv: m && f ? (f - m) / m : null };
  });
  // semanas cheias (quarta a domingo)
  const semanas = {};
  noites.forEach(n => { const w = dow(n.d); if (![3, 4, 5, 6, 0].includes(w)) return; const k = semanaDe(n.d);
    const s = semanas[k] ??= { ini: k, noites: 0, atr: [], cache: 0, fat: 0, entQ: 0, entV: 0 };
    s.noites++; s.atr.push(...n.atr); s.cache += n.cache; s.fat += n.fat; s.entQ += n.entQ; s.entV += n.entV; });
  const sl = Object.values(semanas).sort((a, b) => a.ini.localeCompare(b.ini)).map(s => ({ ...s, res: s.fat - s.cache }));
  const linhas = AT.modo === "semana" ? sl : noites;
  const tot = linhas.reduce((a, l) => ({ cache: a.cache + l.cache, fat: a.fat + l.fat, entV: a.entV + l.entV, entQ: a.entQ + l.entQ }), { cache: 0, fat: 0, entV: 0, entQ: 0 });
  // ranking (sempre por noite, respeitando o período e os dias escolhidos)
  const rk = {}; noites.forEach(n => n.atr.forEach(a => { const r = rk[a] ??= { nome: a, n: 0, cache: 0, fat: 0, ent: 0, desv: [] };
    r.n++; r.fat += n.fat; r.ent += n.entV; if (n.desv != null) r.desv.push(n.desv); }));
  pags.filter(x => x.data >= AT.ini && x.data <= AT.fim && AT.dows.includes(dow(x.data))).forEach(x => { if (rk[x.atracao]) rk[x.atracao].cache += +x.valor; });
  const rank = Object.values(rk).map(r => ({ ...r, desvMed: r.desv.length ? r.desv.reduce((a, b) => a + b, 0) / r.desv.length : null })).sort((a, b) => (b.desvMed ?? -9) - (a.desvMed ?? -9));

  const nomeLinha = l => AT.modo === "semana" ? `Qua ${br(l.ini).slice(0, 5)} a Dom ${br(addDias(l.ini, 4)).slice(0, 5)}<small class="sub2">${l.noites} noites</small>` : `${DIAS[dow(l.d)]} ${br(l.d)}`;
  const atrs = l => [...new Set(l.atr)].map(esc).join(" + ") || `<span style="color:var(--mute)">sem atração paga</span>`;
  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Atrações</h2><p>Quanto a banda custa × quanto a noite faturou × quanto entrou de entrada</p></div>
    <div class="filtros"><button class="btn sec peq" onclick="abrir('pagamentos')">Lançar cachês →</button></div></div>
  <div class="card filtros-at">
    <div class="segmentos" style="margin:0">${[["noite", "Por noite"], ["semana", "Por semana (qua–dom)"]].map(([k, n]) => `<button class="${AT.modo === k ? "sel" : ""}" data-modo="${k}">${n}</button>`).join("")}</div>
    <div class="filtros"><input type="date" id="at-ini" value="${AT.ini}"><span style="color:var(--mute)">até</span><input type="date" id="at-fim" value="${AT.fim}">
      <select id="at-atalho"><option value="">Atalhos…</option><option value="sem">Última semana</option><option value="mes">Último mês com dados</option><option value="90">Últimos 90 dias</option><option value="tudo">Tudo</option></select></div>
    <div class="chips" id="at-dows">${[3, 4, 5, 6, 0, 1, 2].map(w => `<button class="${AT.dows.includes(w) ? "sel" : ""}" data-dow="${w}">${DIAS[w]}</button>`).join("")}</div>
  </div>
  <div class="grade kpis" style="margin-top:14px">
    <div class="card kpi"><div class="rot">Cachês</div><div class="val">${brl0(tot.cache)}</div><div class="det">${pct(tot.cache / (tot.fat || 1))} do faturamento</div></div>
    <div class="card kpi"><div class="rot">Faturamento</div><div class="val">${brl0(tot.fat)}</div><div class="det">${noites.length} noites</div></div>
    <div class="card kpi"><div class="rot">Entradas</div><div class="val">${brl0(tot.entV)}</div><div class="det">${nfmt(tot.entQ)} pagantes · cobre ${pct(tot.entV / (tot.cache || 1))} dos cachês</div></div>
    <div class="card kpi destaque"><div class="rot">Faturamento − cachês</div><div class="val">${brl0(tot.fat - tot.cache)}</div><div class="det">antes de CMV e equipe</div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>${AT.modo === "semana" ? "Semana a semana" : "Noite a noite"}</h3><div class="sub">Barras: faturamento, cachê e entrada</div><div class="graf alto"><canvas id="g-at"></canvas></div></div>
  <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap"><div><h3>Detalhe</h3><div class="sub">Entrada = produtos marcados como entrada no Epoc</div></div><button class="btn sec peq" id="cfg-ent">Quais produtos são entrada?</button></div>
    <div class="rolagem" style="max-height:560px"><table><thead><tr><th>${AT.modo === "semana" ? "Semana" : "Noite"}</th><th>Atração</th><th class="n">Cachê</th><th class="n">Faturamento</th><th class="n">Cachê % fat.</th><th class="n">Entrada</th><th class="n">Entrada cobre</th><th class="n">Fat. − cachê</th>${AT.modo === "noite" ? `<th class="n">vs média do dia</th>` : ""}</tr></thead><tbody>
    ${linhas.map(l => `<tr><td>${nomeLinha(l)}</td><td>${atrs(l)}</td><td class="n">${l.cache ? brl0(l.cache) : "—"}</td><td class="n">${brl0(l.fat)}</td><td class="n">${l.cache && l.fat ? `<span class="tag ${l.cache / l.fat > .2 ? "ruim" : l.cache / l.fat < .1 ? "bom" : "ok"}">${pct(l.cache / l.fat)}</span>` : "—"}</td>
      <td class="n">${l.entV ? brl0(l.entV) + `<small class="sub2">${nfmt(l.entQ)} pag.</small>` : "—"}</td><td class="n">${l.cache ? pct(l.entV / l.cache) : "—"}</td><td class="n"><b>${brl0(l.res)}</b></td>
      ${AT.modo === "noite" ? `<td class="n">${l.desv != null ? `<span class="tag ${l.desv > .1 ? "bom" : l.desv < -.1 ? "ruim" : ""}">${l.desv >= 0 ? "+" : ""}${pct(l.desv)}</span>` : "—"}</td>` : ""}</tr>`).join("") || `<tr><td colspan="9" class="vazio">Nada no período</td></tr>`}
    </tbody><tfoot><tr><td colspan="2"><b>Total</b></td><td class="n"><b>${brl0(tot.cache)}</b></td><td class="n"><b>${brl0(tot.fat)}</b></td><td class="n">${pct(tot.cache / (tot.fat || 1))}</td><td class="n"><b>${brl0(tot.entV)}</b></td><td class="n">${pct(tot.entV / (tot.cache || 1))}</td><td class="n"><b>${brl0(tot.fat - tot.cache)}</b></td>${AT.modo === "noite" ? "<td></td>" : ""}</tr></tfoot></table></div></div>
  <div class="card" style="margin-top:14px"><h3>Quais atrações valem o cachê</h3><div class="sub">No período e dias escolhidos · comparado com a média do mesmo dia da semana</div>
    <div class="rolagem"><table><thead><tr><th>Atração</th><th class="n">Noites</th><th class="n">Cachê total</th><th class="n">Faturamento das noites</th><th class="n">Entradas</th><th class="n">vs média do dia</th><th class="n">R$ faturado por R$ 1 de cachê</th></tr></thead><tbody>
    ${rank.map(r => `<tr><td>${esc(r.nome)}</td><td class="n">${r.n}</td><td class="n">${brl0(r.cache)}</td><td class="n">${brl0(r.fat)}</td><td class="n">${r.ent ? brl0(r.ent) : "—"}</td><td class="n">${r.desvMed != null ? `<span class="tag ${r.desvMed > .1 ? "bom" : r.desvMed < -.1 ? "ruim" : ""}">${r.desvMed >= 0 ? "+" : ""}${pct(r.desvMed)}</span>` : "—"}</td><td class="n">${r.cache ? nfmt(r.fat / r.cache, 1) : "—"}</td></tr>`).join("") || `<tr><td colspan="7" class="vazio">Sem cachês no período</td></tr>`}
    </tbody></table></div><p class="dica">Quando duas atrações tocam na mesma noite (ex.: banda + DJ), o faturamento da noite conta para as duas.</p></div>`;

  const lbl = AT.modo === "semana" ? sl.map(s => br(s.ini).slice(0, 5)) : noites.map(n => DIAS[dow(n.d)] + " " + br(n.d).slice(0, 5));
  grafico($("#g-at"), { type: "bar", data: { labels: lbl, datasets: [
    { label: "Faturamento", data: linhas.map(l => l.fat), backgroundColor: "#f2a63b", borderRadius: 4 },
    { label: "Cachê", data: linhas.map(l => l.cache), backgroundColor: "#e8607a", borderRadius: 4 },
    { label: "Entrada", data: linhas.map(l => l.entV), backgroundColor: "#4fc3b0", borderRadius: 4 }] },
    options: { maintainAspectRatio: false, scales: { y: { ticks: { callback: v => brl0(v) } } } } });
  const ir = () => abaAtracoes();
  document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { AT.modo = b.dataset.modo; ir(); });
  document.querySelectorAll("[data-dow]").forEach(b => b.onclick = () => { const w = +b.dataset.dow; AT.dows = AT.dows.includes(w) ? AT.dows.filter(x => x !== w) : [...AT.dows, w]; ir(); });
  $("#at-ini").onchange = e => { AT.ini = e.target.value; ir(); };
  $("#at-fim").onchange = e => { AT.fim = e.target.value; ir(); };
  $("#at-atalho").onchange = e => { const v = e.target.value, mx = p?.max || diaOperacionalHoje();
    if (v === "sem") { AT.ini = semanaDe(mx); AT.fim = addDias(AT.ini, 4); }
    if (v === "mes") { AT.ini = mx.slice(0, 8) + "01"; AT.fim = mx; }
    if (v === "90") { AT.ini = addDias(mx, -89); AT.fim = mx; }
    if (v === "tudo") { AT.ini = p?.min || mx; AT.fim = mx; }
    ir(); };
  $("#cfg-ent").onclick = () => {
    const d = $("#dlg");
    d.innerHTML = `<h3>Quais produtos contam como entrada?</h3><input id="ent-busca" placeholder="Buscar produto…" style="margin:8px 0">
      <div class="rolagem" style="max-height:340px">${(prods || []).map(x => `<label class="linha-check" data-n="${esc(x.nome.toLowerCase())}"><input type="checkbox" value="${x.codigo}" ${codEntrada.includes(x.codigo) ? "checked" : ""}> ${esc(x.nome)} <small style="color:var(--mute)">${esc(x.grupo || "")} · ${x.codigo}</small></label>`).join("")}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn sec" id="ent-c">Cancelar</button><button class="btn" id="ent-ok">Salvar</button></div>`;
    d.showModal();
    $("#ent-busca").oninput = e => { const t = e.target.value.toLowerCase(); d.querySelectorAll(".linha-check").forEach(l => l.style.display = l.dataset.n.includes(t) ? "" : "none"); };
    $("#ent-c").onclick = () => d.close();
    $("#ent-ok").onclick = async () => { const cods = [...d.querySelectorAll("input[type=checkbox]:checked")].map(i => i.value);
      await sb.from("config").upsert({ chave: "entrada", valor: { codigos: cods } }); d.close(); ir(); };
  };
}

const NT = { filtro: "a conferir" };
const CATEGORIAS = ["Bebidas", "Alimentos", "Descartáveis", "Limpeza", "Gás", "Manutenção", "Serviços", "Outros"];
async function reduzirImagem(file) {
  if (!file.type.startsWith("image/") || file.type === "image/heic") return file;
  const img = await createImageBitmap(file).catch(() => null); if (!img) return file;
  const max = 1800, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(ok => c.toBlob(b => ok(b || file), "image/jpeg", 0.82));
}
async function enviarFoto(file, prefixo) {
  const blob = await reduzirImagem(file);
  const ext = blob.type === "application/pdf" ? "pdf" : blob.type === "image/jpeg" ? "jpg" : (file.name.split(".").pop() || "jpg");
  const caminho = `${new Date().toISOString().slice(0, 7)}/${prefixo}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
  const { error } = await sb.storage.from("notas").upload(caminho, blob, { contentType: blob.type || file.type });
  if (error) throw error;
  return caminho;
}
async function verArquivo(caminho) {
  const { data, error } = await sb.storage.from("notas").createSignedUrl(caminho, 600);

  const d = $("#dlg");

    ${/\.pdf$/i.test(caminho) ? `<p>Arquivo PDF — use “Abrir em tela cheia”.</p>` : `<img src="${data.signedUrl}" style="max-width:100%;border-radius:10px">`}`;
  d.style.width = "min(760px,94vw)"; d.showModal(); $("#ver-f").onclick = () => { d.close(); d.style.width = ""; };
}

async function climaPrevisao() {

function resumoClimaDia(prev, d) {
  if (!prev?.daily) return null;
  const i = prev.daily.time.indexOf(d); if (i < 0) return null;
  // horas da noite: 17h do dia até 02h do dia seguinte
  const horas = [];
  prev.hourly.time.forEach((t, k) => { const dia = t.slice(0, 10), h = +t.slice(11, 13);
    if ((dia === d && h >= 17) || (dia === addDias(d, 1) && h <= 2)) horas.push({ h, p: prev.hourly.precipitation_probability[k], mm: prev.hourly.precipitation[k] }); });
  const chuvosas = horas.filter(x => x.p >= 50);
  const probNoite = horas.length ? Math.max(...horas.map(x => x.p ?? 0)) : prev.daily.precipitation_probability_max[i];
  const faixa = chuvosas.length ? `${String(chuvosas[0].h).padStart(2, "0")}h–${String((chuvosas[chuvosas.length - 1].h + 1) % 24).padStart(2, "0")}h` : null;
  return { prob: probNoite ?? 0, probDia: prev.daily.precipitation_probability_max[i], mm: prev.daily.precipitation_sum[i], tmin: prev.daily.temperature_2m_min[i], tmax: prev.daily.temperature_2m_max[i], faixa };
}
