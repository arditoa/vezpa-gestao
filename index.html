// A aba do Epoc (logada) abre esta página e envia os CSVs por postMessage.
// Só aceita mensagens vindas do Epoc e só importa depois do clique em "Importar".
const ORIGEM_EPOC = "https://cloud.epoc.com.br";
function abaReceber() {
  document.querySelectorAll("#abas button").forEach(b => b.classList.remove("ativa"));
  $("#trilha").innerHTML = "Configurações / <b>Importar do Epoc</b>";
  $("#conteudo").innerHTML = `<div class="cab-sec"><div><h2>Importar do Epoc</h2><p>Dados enviados pela aba do Epoc em que você está logada</p></div></div>
    <div class="card"><div id="rec-status" class="sub">Aguardando os dados do Epoc…</div><div id="rec-lista"></div>
    <button class="btn largo hidden" id="rec-ok">Importar tudo</button><div id="rec-msg"></div></div>`;
  let pacotes = [];
  window.addEventListener("message", e => {
    if (e.origin !== ORIGEM_EPOC || e.data?.tipo !== "vezpa-import") return;
    pacotes = (e.data.arquivos || []).map(a => {
      const tipo = a.tipoRel || detectar(a.texto);
      try { return { ...a, tipo, r: analisar(tipo, a.texto) }; } catch (err) { return { ...a, tipo, erro: err.message }; }
    });
    $("#rec-status").textContent = `${pacotes.length} relatório(s) recebido(s) do Epoc:`;
    $("#rec-lista").innerHTML = pacotes.map(p => `<div class="msg ${p.erro ? "erro" : "ok"}"><b>${esc(TIPOS[p.tipo] || p.nome)}</b><br>${p.erro ? esc(p.erro) : p.r.resumo}</div>`).join("");
    $("#rec-ok").classList.toggle("hidden", !pacotes.some(p => !p.erro));
    e.source?.postMessage({ tipo: "vezpa-recebido", n: pacotes.length }, ORIGEM_EPOC);
  });
  $("#rec-ok").onclick = async () => {
    const b = $("#rec-ok"); b.disabled = true; b.textContent = "Importando…";
    try {
      // produtos primeiro (grupos), depois vendas
      for (const p of pacotes.filter(p => !p.erro).sort((a, b) => (a.tipo === "produtos" ? -1 : 0) - (b.tipo === "produtos" ? -1 : 0))) await enviar(p.tipo, p.r, p.nome);
      $("#rec-msg").innerHTML = `<div class="msg ok">Importado ✔ <a href="#geral" onclick="location.hash='geral';location.reload();return false">Ver o painel</a></div>`;
      b.textContent = "Importado ✔"; S.periodo = null;
    } catch (err) { $("#rec-msg").innerHTML = `<div class="msg erro">Erro: ${esc(err.message || err)}</div>`; b.disabled = false; b.textContent = "Tentar de novo"; }
  };
  const quemAbriu = window.opener || (window.parent !== window ? window.parent : null);
  if (quemAbriu) try { quemAbriu.postMessage({ tipo: "vezpa-pronto" }, ORIGEM_EPOC); } catch (_) {}
}

      <button class="btn largo">Enviar convite</button><div id="msg-conv"></div></form></div>
    <div class="card"><h3>O que cada acesso vê</h3><table><tbody>
      <tr><td><span class="selo">Dona</span></td><td>Tudo: faturamento, produtos, equipe e custos, cruzamentos, importação e usuários</td></tr>
      <tr><td><span class="selo">Gerente</span></td><td>Tudo, menos gerenciar usuários</td></tr>
      <tr><td><span class="selo">Caixa</span></td><td>Só a aba Hoje: vendas e contagem da noite (o banco bloqueia o histórico)</td></tr></tbody></table></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Pessoas com acesso</h3><table><thead><tr><th>Nome</th><th>E-mail</th><th>Acesso</th><th>Último acesso</th><th></th></tr></thead><tbody>
  ${lista.map(u => `<tr><td>${esc(u.nome)}</td><td>${esc(u.email)}</td><td><select data-papel="${u.user_id}" style="width:auto;padding:6px" ${u.user_id === S.user.id ? "disabled" : ""}>${["dona", "gerente", "caixa"].map(p => `<option ${p === u.papel ? "selected" : ""}>${p}</option>`).join("")}</select></td>
    <td>${u.ultimo ? new Date(u.ultimo).toLocaleString("pt-BR") : "<span class='tag'>convite pendente</span>"}</td>
    <td>${u.user_id === S.user.id ? "" : `<button class="btn perigo peq" data-rem="${u.user_id}" data-nome="${esc(u.nome)}">Remover</button>`}</td></tr>`).join("")}
  </tbody></table></div>`;
  $("#f-conv").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const m = $("#msg-conv");
    try { await fnUsuarios({ acao: "convidar", nome: f.get("nome"), email: f.get("email"), papel: f.get("papel"), redirect: location.origin + location.pathname }); m.className = "msg ok"; m.textContent = "Convite enviado."; setTimeout(() => abrir("usuarios"), 1200); }
    catch (err) { m.className = "msg erro"; m.textContent = err.message; }
  };
  document.querySelectorAll("[data-papel]").forEach(s => s.onchange = async () => {
    const { error } = await sb.from("perfis").update({ papel: s.value }).eq("user_id", s.dataset.papel);
    if (error) alert(error.message);
  });
  document.querySelectorAll("[data-rem]").forEach(b => b.onclick = () => {
    const d = $("#dlg");
    d.innerHTML = `<h3>Remover ${b.dataset.nome}?</h3><p style="color:var(--mute)">A pessoa perde o acesso na hora. Os dados do bar não são apagados.</p>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" id="c-n">Cancelar</button><button class="btn perigo" id="c-s">Remover</button></div>`;
    d.showModal(); $("#c-n").onclick = () => d.close();
    $("#c-s").onclick = async () => { try { await fnUsuarios({ acao: "remover", user_id: b.dataset.rem }); d.close(); abrir("usuarios"); } catch (err) { d.close(); } };
  });
}

iniciar();
</script>
</body>
</html>
