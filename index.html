// ============ ABA: PERFIL DOS CLIENTES ============
async function abaPerfil() {
  const [{ data: P2, error }, dias] = await Promise.all([sb.rpc("perfil_clientes"), todos(() => sb.from("vw_resumo_diario").select("dia,faturamento"))]);
  if (error) throw error;
  if (!P2?.total) { $("#conteudo").innerHTML = `<div class="card vazio">Nenhum cliente importado ainda. Use Importar dados → cadastro de clientes do Epoc.</div>`; return; }
  const sx = P2.sexo || {}, mulheres = sx["Mulheres"] || 0, homens = sx["Homens"] || 0;
  const faixas = ["< 18", "18–24", "25–29", "30–34", "35–39", "40–49", "50+"].filter(f => f !== "< 18" || (P2.faixas || []).some(x => x.faixa === f));
  const fx = (f, s) => (P2.faixas || []).filter(x => x.faixa === f && (!s || x.sx === s)).reduce((a, x) => a + x.n, 0);
  const comIdade = faixas.reduce((a, f) => a + fx(f), 0);
  const top = [...faixas].sort((a, b) => fx(b) - fx(a))[0];
  const R = P2.recencia || {};
  const ultMes = (P2.ultima_mes || []).slice(-6), novos = (P2.novos_mes || []);
  const fatMes = {}; dias.forEach(d => { const m = d.dia.slice(0, 7); fatMes[m] = (fatMes[m] || 0) + +d.faturamento; });
  const mesAtual = diaOperacionalHoje().slice(0, 7);
  const ultimoMesCompleto = [...ultMes].reverse().find(x => x.mes < mesAtual && fatMes[x.mes] > 0) || null;
  const gastoEst = ultimoMesCompleto && fatMes[ultimoMesCompleto.mes] ? fatMes[ultimoMesCompleto.mes] / ultimoMesCompleto.n : null;
  const nomeMes = m => ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"][+m.slice(5, 7) - 1] + "/" + m.slice(2, 4);
  $("#conteudo").innerHTML = `
  <div class="cab-sec"><div><h2>Perfil dos clientes</h2><p>${nfmt(P2.total)} clientes cadastrados no Epoc · desde ${nomeMes(novos[0]?.mes || "2026-02")}</p></div></div>
  <div class="grade kpis">
    <div class="card kpi destaque"><div class="rot">Mulheres</div><div class="val">${pct(mulheres / P2.total)}</div><div class="det">${nfmt(mulheres)} · homens ${nfmt(homens)} (${pct(homens / P2.total)})</div></div>
    <div class="card kpi"><div class="rot">Idade média</div><div class="val">${nfmt(P2.idade_media, 0)} anos</div><div class="det">faixa mais comum: ${top} (${pct(fx(top) / comIdade)})</div></div>
    <div class="card kpi"><div class="rot">Vieram nos últimos 30 dias</div><div class="val">${nfmt(R.ate30)}</div><div class="det">${nfmt(R.d31a90)} entre 31 e 90 dias</div></div>
    <div class="card kpi"><div class="rot">Voltaram depois da 1ª visita</div><div class="val">${pct(P2.voltaram / P2.total)}</div><div class="det">${nfmt(P2.voltaram)} clientes</div></div>
  </div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Faixa etária</h3><div class="sub">${nfmt(comIdade)} clientes com data de nascimento</div><div class="graf"><canvas id="g-faixa"></canvas></div></div>
    <div class="card"><h3>Há quanto tempo não vêm</h3><div class="sub">Pela data da última visita no Epoc</div><div class="graf"><canvas id="g-rec"></canvas></div>
      <p class="dica">${nfmt(R.d91a180 + R.mais180)} clientes sumidos há mais de 90 dias — bom público para uma campanha de “volta”.</p></div>
  </div>
  <div class="grade dois" style="margin-top:14px">
    <div class="card"><h3>Novos clientes por mês</h3><div class="sub">Primeira visita registrada</div><div class="graf"><canvas id="g-novos"></canvas></div></div>
    <div class="card"><h3>Gasto médio por cliente</h3><div class="sub">Estimativa</div>
      <div class="val" style="font:650 32px Inter;margin:10px 0">${gastoEst ? brl0(gastoEst) : "—"}</div>
      <p class="dica" style="margin-top:0">${ultimoMesCompleto ? `Faturamento de ${nomeMes(ultimoMesCompleto.mes)} (${brl0(fatMes[ultimoMesCompleto.mes] || 0)}) ÷ ${nfmt(ultimoMesCompleto.n)} clientes cuja última visita foi nesse mês.` : ""} É uma conta aproximada: quem voltou depois conta só no último mês, e nem todo mundo se cadastra na entrada. Para o gasto exato por pessoa, o Epoc precisa ligar a comanda ao cliente — dá para ver com o suporte se essa informação sai no relatório.</p>
      <h3 style="margin-top:14px">Aniversários por mês</h3><div class="graf" style="height:170px"><canvas id="g-aniv"></canvas></div></div>
  </div>`;
  const cores = { Mulheres: "#e8607a", Homens: "#4fc3b0", "Não informado": "#9b8cf2" };
  grafico($("#g-faixa"), { type: "bar", data: { labels: faixas, datasets: ["Mulheres", "Homens"].map(s => ({ label: s, data: faixas.map(f => fx(f, s)), backgroundColor: cores[s], borderRadius: 4, _fmt: "n" })) },
    options: { maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } } });
  grafico($("#g-rec"), { type: "bar", data: { labels: ["até 30 dias", "31–90", "91–180", "mais de 180"], datasets: [{ data: [R.ate30, R.d31a90, R.d91a180, R.mais180], backgroundColor: ["#7cc46a", "#f2a63b", "#e8607a", "#6b5a60"], borderRadius: 6, _fmt: "n" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } } });
  grafico($("#g-novos"), { type: "bar", data: { labels: novos.map(x => nomeMes(x.mes)), datasets: [{ data: novos.map(x => x.n), backgroundColor: "#f2a63b", borderRadius: 5, _fmt: "n" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } } });
  const av = P2.aniv_mes || {};
  grafico($("#g-aniv"), { type: "bar", data: { labels: MESES.map(m => m.slice(0, 3)), datasets: [{ data: MESES.map((_, i) => av[i + 1] || 0), backgroundColor: "#9b8cf2", borderRadius: 4, _fmt: "n" }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } } } });
}

// ============ ABA: IMPORTAR ============
function lerCSV(texto, sep) {
  const linhas = []; let campo = "", linha = [], aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    if (aspas) { if (c === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c; }
    else if (c === '"') aspas = true;
    else if (c === sep) { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && texto[i + 1] === "\n") i++; linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}
const numBR = s => { s = String(s ?? "").replace(/R\$|\s/g, ""); const neg = s.startsWith("(-)"); s = s.replace("(-)", ""); if (!s) return null; const v = parseFloat(s.replace(/\./g, "").replace(",", ".")); return neg ? -v : v; };
const numQtd = s => { s = String(s).trim(); return /^\d+\.\d{1,2}$/.test(s) ? parseFloat(s) : numBR(s); };
const dataBR = s => { const m = String(s).match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : null; };
const diasTxt = s => { s = String(s || "").toLowerCase(); let m = s.match(/(\d+)?\s*(\d)\/(\d)/); if (m) return (+(m[1] || 0)) + m[2] / m[3]; m = s.match(/(\d+(?:[.,]\d+)?)/); return m ? +m[1].replace(",", ".") : 0; };
async function lerArquivo(f) {
  const buf = await f.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("�")) t = new TextDecoder("windows-1252").decode(buf);
  return t.replace(/^﻿/, "");
}
function detectar(texto) {
  const h = texto.slice(0, 300).toLowerCase();
  if (h.includes('"data";"hora"') || /^data;hora/.test(h)) return "hora";
  if (h.includes("dt. de nasc") || /^"?codigo"?;"?nome"?;"?dia"?;"?mes"?/.test(h)) return "clientes";
  if (h.includes("total recebido") || (h.includes("codigo") && h.includes("grupo"))) return "produtos";
  if (h.includes("funcionario")) return "funcionario";
  if (/dias?\s*,/.test(h)) return "freelas";
  return "";
}
const TIPOS = { fechamento: "Descontos e fechamento por noite (Epoc)", func_noites: "Vendas por funcionário, noite a noite (Epoc)", clientes: "Cadastro de clientes (Epoc)", hora: "Venda de produtos por hora (Epoc)", produtos: "Relatório de venda de produtos — atualiza os grupos (Epoc)", funcionario: "Vendas por funcionário (Epoc)", freelas: "Pagamento de freelancers da semana" };

  </div>
  <div class="card" style="margin-top:14px"><h3>Histórico de importações</h3>

async function preparar(arquivo) {
  const texto = await lerArquivo(arquivo);
  const tipo = detectar(texto);
  const prev = $("#prev");
  prev.innerHTML = `<label>Tipo de relatório</label><select id="tipo">${Object.entries(TIPOS).map(([k, v]) => `<option value="${k}" ${k === tipo ? "selected" : ""}>${v}</option>`).join("")}</select>
    <div id="extra"></div><div id="resumo" class="msg" style="margin-top:12px"></div>
    <button class="btn largo" id="btn-imp">Importar</button>`;
  const atualizar = () => {
    const t = $("#tipo").value; const ex = $("#extra");
    ex.innerHTML = t === "funcionario" ? `<div class="linha-form"><div><label>Período de</label><input type="date" id="p-ini"></div><div><label>até</label><input type="date" id="p-fim"></div></div>`
      : t === "freelas" ? `<label>Semana que começa na quarta-feira</label><input type="date" id="p-sem">` : "";
    try { const r = analisar(t, texto); $("#resumo").innerHTML = r.resumo; $("#resumo").className = "msg ok"; $("#btn-imp").disabled = false; prev._r = r; }
    catch (e) { $("#resumo").textContent = e.message; $("#resumo").className = "msg erro"; $("#btn-imp").disabled = true; }
  };
  $("#tipo").onchange = atualizar; atualizar();
  $("#btn-imp").onclick = async () => {
    const b = $("#btn-imp"); b.disabled = true; b.textContent = "Importando…";
    try { await enviar($("#tipo").value, prev._r, arquivo.name); $("#resumo").innerHTML = "Importado com sucesso ✔"; $("#resumo").className = "msg ok"; S.periodo = null; setTimeout(() => abrir("importar"), 1200); }
    catch (e) { $("#resumo").textContent = "Erro: " + (e.message || e); $("#resumo").className = "msg erro"; b.disabled = false; b.textContent = "Importar"; }
  };
}

function analisar(tipo, texto) {
  if (tipo === "hora") {
    const ls = lerCSV(texto, ";").slice(1).filter(l => dataBR(l[0]) && l[1]);
    if (!ls.length) throw new Error("Não encontrei linhas de venda (esperado: Data;Hora;Cód.;Produto;Qtde.;Vlr. Total).");
    const itens = ls.map(l => ({ data: dataBR(l[0]), hora: l[1].trim(), codigo: (l[2] || "").trim(), produto: (l[3] || "").trim(), qtd: numBR(l[4]) ?? 1, valor: numBR(l[5]) ?? 0 }));
    const datas = [...new Set(itens.map(i => i.data))].sort();
    const total = itens.reduce((s, i) => s + i.valor, 0);
    return { itens, resumo: `${nfmt(itens.length)} lançamentos de ${br(datas[0])} a ${br(datas[datas.length - 1])} · total ${brl(total)}` };
  }
  if (tipo === "fechamento") {
    const itens = JSON.parse(texto); if (!itens.length) throw new Error("Nada recebido.");
    return { itens, resumo: `${itens.length} noites · descontos ${brl(itens.reduce((a, i) => a + (+i.desconto || 0) + (+i.rateio || 0), 0))} · líquido ${brl(itens.reduce((a, i) => a + (+i.liquido || 0), 0))}` };
  }
  if (tipo === "func_noites") {
    const itens = lerCSV(texto, ";").slice(1).filter(l => l[0] && l[1]).map(l => ({ data: dataBR(l[0]) || l[0], funcionario: l[1].trim(), qtd: parseFloat(l[2]) || 0, valor: numBR(l[3]) || 0 }));
    if (!itens.length) throw new Error("Não encontrei vendas por funcionário.");
    const noites = new Set(itens.map(i => i.data));
    return { itens, resumo: `${noites.size} noites · ${new Set(itens.map(i => i.funcionario.toLowerCase())).size} pessoas · total ${brl(itens.reduce((s, i) => s + i.valor, 0))}` };
  }
  if (tipo === "clientes") {
    const sep = (texto.split("\n")[0].match(/;/g) || []).length > (texto.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
    const todas = lerCSV(texto, sep); const cab = todas[0].map(c => c.toLowerCase());
    const so = v => String(v || "").replace(/\D/g, "");
    const data = v => { const m = String(v || "").match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? { d: +m[1], m: +m[2], a: +m[3] } : null; };
    let itens;
    if (cab[0] === "codigo") {
      itens = todas.slice(1).filter(l => l[0]).map(l => ({ codigo: l[0], nome: l[1], dia: l[2], mes: l[3], ano: l[4], telefone: l[5], sexo: l[6], primeira: l[7], ultima: l[8] }));
    } else { // exportação de clientes do Epoc (colunas deslocadas: cód, nome, reg, cpf, nascimento, cidade, uf, telefone, email, sexo, última visita)
      itens = todas.slice(1).filter(l => /^\d+$/.test((l[0] || "").trim())).map(l => {
        const n = data(l[4]), u = data(l[10]); const tel = so(l[7]);
        return { codigo: l[0].trim(), nome: (l[1] || "").trim(), dia: n?.d ?? "", mes: n?.m ?? "", ano: n && n.a > 1900 ? n.a : "", telefone: tel.length >= 10 && !/^0+$/.test(tel) ? tel : "", sexo: l[9] || "", primeira: "", ultima: u ? `${u.a}-${String(u.m).padStart(2, "0")}-${String(u.d).padStart(2, "0")}` : "" };
      });
    }
    if (!itens.length) throw new Error("Não encontrei clientes.");
    return { itens, resumo: `${nfmt(itens.length)} clientes · ${nfmt(itens.filter(i => i.mes).length)} com aniversário · ${nfmt(itens.filter(i => i.telefone).length)} com telefone` };
  }
  if (tipo === "produtos") {
    const ls = lerCSV(texto, ";").slice(1).filter(l => l.length >= 13 && /^\d+$/.test((l[0] || "").trim()));
    if (!ls.length) throw new Error("Não encontrei produtos com código e grupo.");
    const itens = ls.map(l => ({ codigo: l[0].trim(), nome: l[1].trim(), grupo: l[2].trim() }));
    return { itens, resumo: `${itens.length} produtos em ${new Set(itens.map(i => i.grupo)).size} grupos` };
  }
  if (tipo === "funcionario") {
    const ls = lerCSV(texto, ";").slice(1).filter(l => /^\d+$/.test((l[0] || "").trim()));
    const itens = ls.map(l => ({ funcionario: l[1].trim(), qtd: parseFloat(l[2]), valor: numBR(l[4]) }));
    if (!itens.length) throw new Error("Não encontrei funcionários.");
    return { itens, resumo: `${itens.length} funcionários · total ${brl(itens.reduce((s, i) => s + i.valor, 0))}` };
  }
  if (tipo === "freelas") {
    const sep = (texto.split("\n")[0].match(/;/g) || []).length > (texto.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
    const ls = lerCSV(texto, sep).filter(l => (l[0] || "").trim() && /dia/i.test(l[1] || ""));
    const itens = ls.map(l => ({ nome: l[0].trim(), dias: diasTxt(l[1]), valor: numBR(l[3]), funcao: (l[4] || "").trim() || null }));
    if (!itens.length) throw new Error("Não encontrei freelas (esperado: Nome, X dias, CPF/Pix, Valor, Função).");
    return { itens, resumo: `${itens.length} freelas · ${nfmt(itens.reduce((s, i) => s + i.dias, 0), 1)} diárias · ${brl(itens.reduce((s, i) => s + (i.valor || 0), 0))}` };
  }
  throw new Error("Escolha o tipo de relatório.");
}

async function enviar(tipo, r, nome) {
  if (tipo === "hora") {
    // envia em lotes de datas inteiras (cada lote substitui as suas datas)
    const porData = {}; r.itens.forEach(i => (porData[i.data] ??= []).push(i));
    let lote = [];
    const datas = Object.keys(porData).sort();
    for (let k = 0; k < datas.length; k++) {
      lote = lote.concat(porData[datas[k]]);
      if (lote.length > 2500 || k === datas.length - 1) {
        const { error } = await sb.rpc("importar_vendas_itens", { p_arquivo: nome, p_linhas: lote });
        if (error) throw error; lote = [];
      }
    }
  } else if (tipo === "fechamento") {
    const { error } = await sb.rpc("importar_fechamento", { p_linhas: r.itens }); if (error) throw error;
  } else if (tipo === "func_noites") {
    for (let i = 0; i < r.itens.length; i += 2000) { const { error } = await sb.rpc("importar_vendas_func_noites", { p_linhas: r.itens.slice(i, i + 2000) }); if (error) throw error; }
  } else if (tipo === "clientes") {
    for (let i = 0; i < r.itens.length; i += 2000) { const { error } = await sb.rpc("importar_clientes", { p_linhas: r.itens.slice(i, i + 2000) }); if (error) throw error; }
  } else if (tipo === "produtos") {
    const { error } = await sb.rpc("importar_produtos", { p_linhas: r.itens }); if (error) throw error;
  } else if (tipo === "funcionario") {
    const ini = $("#p-ini").value, fim = $("#p-fim").value; if (!ini || !fim) throw new Error("Informe o período do relatório.");
    const { error } = await sb.rpc("importar_vendas_funcionario", { p_arquivo: nome, p_ini: ini, p_fim: fim, p_linhas: r.itens }); if (error) throw error;
  } else if (tipo === "freelas") {
    const sem = $("#p-sem").value; if (!sem) throw new Error("Informe a quarta-feira que inicia a semana.");
    const { error } = await sb.rpc("importar_freelas", { p_arquivo: nome, p_semana: sem, p_linhas: r.itens }); if (error) throw error;
  }
}

// ============ RECEBER DO EPOC (ponte entre abas) ============
// A aba do Epoc (logada) abre esta página e envia os CSVs por postMessage.
// Só aceita mensagens vindas do Epoc e só importa depois do clique em "Importar".
const ORIGEM_EPOC = "https://cloud.epoc.com.br";
function abaReceber() {
  document.querySelectorAll("#abas button").forEach(b => b.classList.remove("ativa"));
  $("#trilha").innerHTML = "Configurações / <b>Importar do Epoc</b>";
  $("#conteudo").innerHTML = `<div class="cab-sec"><div><h2>Importar do Epoc</h2><p>Dados enviados pela aba do Epoc em que você está logada</p></div></div>
    <div class="card"><div id="rec-status" class="sub">Aguardando os dados do Epoc…</div><div id="rec-lista"></div>
    <button class="btn largo hidden" id="rec-ok">Importar tudo</button><div id="rec-msg"></div></div>`;
  let pacotes = [];
  window.addEventListener("message", e => {
    if (e.origin !== ORIGEM_EPOC || e.data?.tipo !== "vezpa-import") return;
    pacotes = (e.data.arquivos || []).map(a => {
      const tipo = a.tipoRel || detectar(a.texto);
      try { return { ...a, tipo, r: analisar(tipo, a.texto) }; } catch (err) { return { ...a, tipo, erro: err.message }; }
    });
    $("#rec-status").textContent = `${pacotes.length} relatório(s) recebido(s) do Epoc:`;
    $("#rec-lista").innerHTML = pacotes.map(p => `<div class="msg ${p.erro ? "erro" : "ok"}"><b>${esc(TIPOS[p.tipo] || p.nome)}</b><br>${p.erro ? esc(p.erro) : p.r.resumo}</div>`).join("");
    $("#rec-ok").classList.toggle("hidden", !pacotes.some(p => !p.erro));
    e.source?.postMessage({ tipo: "vezpa-recebido", n: pacotes.length }, ORIGEM_EPOC);
  });
  $("#rec-ok").onclick = async () => {
    const b = $("#rec-ok"); b.disabled = true; b.textContent = "Importando…";
    try {
      // produtos primeiro (grupos), depois vendas
      for (const p of pacotes.filter(p => !p.erro).sort((a, b) => (a.tipo === "produtos" ? -1 : 0) - (b.tipo === "produtos" ? -1 : 0))) await enviar(p.tipo, p.r, p.nome);
      $("#rec-msg").innerHTML = `<div class="msg ok">Importado ✔ <a href="#geral" onclick="location.hash='geral';location.reload();return false">Ver o painel</a></div>`;
      b.textContent = "Importado ✔"; S.periodo = null;
    } catch (err) { $("#rec-msg").innerHTML = `<div class="msg erro">Erro: ${esc(err.message || err)}</div>`; b.disabled = false; b.textContent = "Tentar de novo"; }
  };
  const quemAbriu = window.opener || (window.parent !== window ? window.parent : null);
  if (quemAbriu) try { quemAbriu.postMessage({ tipo: "vezpa-pronto" }, ORIGEM_EPOC); } catch (_) {}
}
